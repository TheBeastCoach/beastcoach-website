// ---------- calorie and target calculator ----------
// Calculator formula (Mifflin-St Jeor × daily activity). Steps aren't asked: if they track steps,
// the challenge's 10,000 a day is built in, and workouts are counted on the day they're logged.
const GOALS={fatloss:{label:"Fat loss",proteinPerKg:2.2,delta:-500},recomp:{label:"Tone",proteinPerKg:2.0,delta:-250},muscle:{label:"Muscle",proteinPerKg:1.8,delta:300}};
function calcTargets(p){
  const bmr=10*p.kg+6.25*p.cm-5*p.age+(p.sex==="male"?5:-161);
  const stepsKcal=p.walk?STEP_GOAL*p.kg*0.00057:0;
  const maint=bmr*p.job+stepsKcal;
  const g=GOALS[p.goal];
  const bmi=p.kg/((p.cm/100)**2);
  return {bmr:Math.round(bmr),maint:Math.round(maint),target:Math.round(maint+g.delta),protein:Math.round(p.kg*g.proteinPerKg),bmi:Math.round(bmi*10)/10,stepsKcal:Math.round(stepsKcal)};
}
function bmiNote(b){return b<18.5?"below the healthy range":b<25?"in the healthy range":b<30?"above the healthy range":"well above the healthy range"}

let user=null, S=null, page="loading", tab="today", logDay=null, mealFilter="all", communityKm=null;
const pad=n=>String(n).padStart(2,"0");
const dateStr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDate=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
function todayDate(){const t=new Date();t.setHours(0,0,0,0);return t}
function dayDate(d){const x=new Date(S.start);x.setDate(x.getDate()+d-1);return x}
function rawDay(){return Math.round((todayDate()-S.start)/864e5)+1}
function currentDay(){return Math.min(30,Math.max(1,rawDay()))}
function finished(){return rawDay()>30}
function dayNum(s){return Math.round((parseDate(s)-S.start)/864e5)+1}
function L(d){return S.logs[d]||(S.logs[d]={steps:null,water:0,sleep:null,protein:false,alcohol:false,kcal:[],workouts:[]})}

// ---------- scoring and streaks ----------
function dueItems(d){const dow=dayDate(d).getDay();return S.tracked.filter(k=>k!=="workout"||S.workoutDays.includes(dow))}
const kcalTotal=l=>l.kcal.reduce((a,b)=>a+b.k,0);
function hit(k,l){
  if(!l)return false;
  switch(k){
    case"steps":return (l.steps||0)>=STEP_GOAL;
    case"workout":return l.workouts.length>0;
    case"calories":return l.kcal.length>0;
    case"protein":return !!l.protein;
    case"water":return (l.water||0)>=S.targets.water;
    case"sleep":return l.sleep!=null&&Math.abs(l.sleep-S.targets.sleep)<=0.5;
    case"alcohol":return !!l.alcohol;
  }}
function dayScore(d){const l=S.logs[d];const due=dueItems(d);if(!l||!due.length)return 0;return Math.round(due.filter(k=>hit(k,l)).length/due.length*100)}
function logged(d){const l=S.logs[d];if(!l)return false;return (l.steps||0)>0||l.water>0||l.protein||l.alcohol||l.kcal.length>0||l.workouts.length>0||l.sleep!=null}
function challengeScore(){const n=currentDay();let t=0;for(let d=1;d<=n;d++)t+=dayScore(d);return Math.round(t/n)}
function streaks(){
  const cd=currentDay();let best=0,run=0;
  for(let d=1;d<=cd;d++){run=logged(d)?run+1:0;best=Math.max(best,run)}
  let cur=0;let d=logged(cd)||finished()?cd:cd-1; // today not logged yet doesn't break the streak
  while(d>=1&&logged(d)){cur++;d--}
  return {cur,best};
}
function kmWalked(){let t=0;for(let d=1;d<=30;d++){const l=S.logs[d];if(l)t+=l.steps||0}return t*M_PER_STEP/1000}

function profileToState(p){
  const ri=ROUTES.findIndex(r=>r[1]===p.route);
  return {name:p.first_name,why:p.why,region:p.region,route:ri<0?0:ri,tracked:p.tracked||[],
    targets:{calories:p.calorie_target,protein:p.protein_target,water:p.water_target||8,sleep:+p.sleep_target||7.5},
    workoutDays:p.workout_days||[],start:parseDate(p.start_date),kg:+p.weight_kg,maint:p.maintenance,stepsBaseline:p.steps_baseline||0,logs:{}};
}
async function loadLogs(){
  const from=dateStr(S.start);
  const [days,cals,wos]=await Promise.all([
    sb.from("beast_challenge_days").select("*").eq("user_id",user.id).gte("day",from),
    sb.from("beast_challenge_calories").select("id,day,kcal").eq("user_id",user.id).gte("day",from).order("id"),
    sb.from("beast_challenge_workouts").select("id,day,location,type,minutes").eq("user_id",user.id).gte("day",from).order("id")]);
  if(days.error||cals.error||wos.error)throw (days.error||cals.error||wos.error);
  S.logs={};
  days.data.forEach(r=>{const l=L(dayNum(r.day));Object.assign(l,{steps:r.steps,water:r.water||0,sleep:r.sleep==null?null:+r.sleep,protein:r.protein_hit,alcohol:r.alcohol_free})});
  cals.data.forEach(r=>L(dayNum(r.day)).kcal.push({id:r.id,k:r.kcal}));
  wos.data.forEach(r=>L(dayNum(r.day)).workouts.push({id:r.id,where:r.location,type:r.type,min:r.minutes}));
}
async function loadProfile(){
  const {data,error}=await sb.from("beast_challenge_profiles").select("*").eq("user_id",user.id).maybeSingle();

async function saveDay(d){

  if(error)return failed(error);
}
async function failed(err){console.error(err);toast("Couldn't save that. Check your connection and try again.");try{await loadLogs()}catch(e){}render()}

function signHTML(){
  const [,name,km]=ROUTES[S.route];const done=Math.min(km,kmWalked());const pct=done/km*100;

  const need=Math.ceil(left*1000/M_PER_STEP/daysLeft);
  return `<div class="sign"><div class="row"><div class="dest">${name}</div><div class="km">${Math.round(done)}<span style="font-size:18px;opacity:.8"> / ${km} km</span></div></div>
  <div class="road"><i style="width:${pct.toFixed(1)}%"></i></div>
  <div class="sub">${left<=0?"You made it. Pick another route to keep going.":finished()?"Distances are approximate.":`${fmt(need)} steps a day gets you there by day 30 · approx. distances`}</div></div>`;
}

  screen.querySelectorAll("[data-restart]").forEach(b=>b.onclick=async()=>{
    b.disabled=true;const {error}=await sb.from("beast_challenge_profiles").update({start_date:dateStr(todayDate()),updated_at:new Date().toISOString()}).eq("user_id",user.id);
    if(error){b.disabled=false;return failed(error)}
    S.start=todayDate();await loadLogs();logDay=1;tab="today";render();toast("Day 1. Here we go again.")});
  screen.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{
    const d=logDay,l=L(d),a=b.dataset.act,v=id=>document.getElementById(id).value;
    if(a==="steps"){const n=+v("in-steps");if(v("in-steps")===""||!(n>=0&&n<=60000)){toast("Steps must be between 0 and 60,000");return}l.steps=Math.round(n);render();await saveDay(d);toast("Steps saved");return}
    if(a==="kcal"){const n=+v("in-kcal");if(!(n>0&&n<=5000)){toast("Enter calories between 1 and 5,000");return}await addKcal(d,Math.round(n));return}
    if(a==="workout"){const w={where:v("in-where"),type:v("in-type"),min:+v("in-min")||null};
      if(w.min!=null&&!(w.min>=1&&w.min<=600)){toast("Minutes should be between 1 and 600");return}
      b.disabled=true;const {data,error}=await sb.from("beast_challenge_workouts").insert({user_id:user.id,day:dateStr(dayDate(d)),location:w.where,type:w.type,minutes:w.min}).select("id").single();
      if(error)return failed(error);w.id=data.id;l.workouts.push(w);render();toast("Workout logged");return}
    if(a==="sleep"){const n=+v("in-sleep");if(!(n>0&&n<=14)){toast("Enter hours between 0.5 and 14");return}l.sleep=n;render();await saveDay(d);toast("Sleep saved");return}
    if(a==="protein")l.protein=!l.protein;
    if(a==="alcohol")l.alcohol=!l.alcohol;
    if(a==="water+")l.water=Math.min(40,(l.water||0)+1);
    if(a==="water-")l.water=Math.max(0,(l.water||0)-1);
    render();await saveDay(d);
  });
  const c=document.getElementById("card");if(c){drawCard(c);document.fonts&&document.fonts.ready.then(()=>{if(document.getElementById("card")===c)drawCard(c)})}
  const sh=document.getElementById("share");if(sh)sh.onclick=()=>shareCard(c);
}
async function addKcal(d,k){
  const {data,error}=await sb.from("beast_challenge_calories").insert({user_id:user.id,day:dateStr(dayDate(d)),kcal:k}).select("id").single();
  if(error)return failed(error);
  L(d).kcal.push({id:data.id,k});render();toast(`Added. ${fmt(kcalTotal(L(d)))} cal that day`);

function shareCard(c){

// ---------- share card ----------
function drawCard(c){
  const x=c.getContext("2d");
  const sign="#2D6A4F",acc="#52B788";
  const cd=currentDay(),wk=Math.min(4,Math.ceil(cd/7)),st=streaks();
  const D="'Bebas Neue', 'Arial Narrow', Impact, sans-serif",B="Manrope, Arial, sans-serif";
  x.clearRect(0,0,1080,1920);
  x.fillStyle="#1B3022";x.fillRect(0,0,1080,1920);
  x.fillStyle=sign;x.fillRect(0,0,1080,600);
  x.fillStyle="#FFFFFF";x.font=`400 72px ${D}`;x.fillText("BEAST CHALLENGE",80,140);
  x.font=`600 54px ${B}`;x.fillText(`${S.name} · ${finished()?"30 days":"Week "+wk}`,80,225);
  x.font=`400 250px ${D}`;const sc=String(challengeScore());x.fillText(sc,80,500);const sw=x.measureText(sc).width;
  x.font=`600 54px ${B}`;x.fillText("/100",80+sw+16,500);
  const earned=[...BADGES].reverse().find(b=>st.best>=b);
  if(earned){const cx=860,cy=380,R=150;x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.fillStyle=acc;x.fill();x.lineWidth=14;x.strokeStyle="#FFFFFF";x.stroke();x.fillStyle=sign;x.beginPath();x.arc(cx,cy,R-24,0,Math.PI*2);x.fill();
    x.fillStyle="#FFFFFF";x.textAlign="center";x.font=`400 130px ${D}`;x.fillText(String(earned),cx,cy+30);x.font=`400 40px ${D}`;x.fillText("DAY STREAK",cx,cy+82);x.textAlign="left"}
  if(S.tracked.includes("steps")){const [,name,km]=ROUTES[S.route];const done=Math.min(km,kmWalked());
    x.fillStyle="#FFFFFF";x.font=`600 46px ${B}`;x.fillText(name,80,720);
    x.fillStyle="rgba(255,255,255,.18)";x.fillRect(80,760,920,40);x.fillStyle=acc;x.fillRect(80,760,920*done/km,40);
    x.fillStyle="#FFFFFF";x.font=`400 90px ${D}`;x.fillText(`${Math.round(done)} / ${km} km`,80,900);}
  const vals=Object.entries(S.logs).filter(([d])=>d>=1&&d<=30).map(([,l])=>l);
  const rows=[[`${st.cur}`,"day streak right now"],[`${Array.from({length:cd},(_,i)=>i+1).filter(logged).length} of ${cd}`,"days logged"],[vals.reduce((a,l)=>a+l.workouts.length,0),"workouts"],[vals.filter(l=>l.protein).length,"protein days"]];
  rows.forEach((r,i)=>{const y=1040+i*150;x.fillStyle=acc;x.font=`400 96px ${D}`;x.fillText(String(r[0]),80,y+70);x.fillStyle="#C9D3D0";x.font=`500 44px ${B}`;x.fillText(r[1],440,y+60)});
  x.fillStyle="#FFFFFF";x.font=`700 52px ${B}`;x.fillText("beastcoach.fit",80,1800);
  x.fillStyle="#93A09C";x.font=`500 36px ${B}`;x.fillText("Free 30-day challenge · App launching late 2026",80,1860);
}

       <p class="note">${t.includes("steps")?`This includes the 10,000 steps a day you'll walk in the challenge (about ${c.stepsKcal} calories). `:""}Workouts you log are counted on the day, not built in here. BMI is a rough guide and can't tell muscle from fat. You can change any number below.</p>`;

      if(!d.tracked.includes("steps"))return `<div class="label">${lab(5)} · Ready</div><h2>You're set, ${esc(d.name)}</h2><p class="note">Add Steps any time to walk a route.</p>${agree}`;
      const list=ROUTES.map((r,i)=>[r,i]).filter(([r])=>r[0]===d.region);

  const g=id=>document.getElementById(id);
  function save(){
    if(step===0){d.email=g("ob-email").value.trim();if(g("ob-fullname"))d.name=g("ob-fullname").value.trim().split(" ")[0]}

      if(d.units==="metric"){d.cm=g("ob-cm").value;d.kg=g("ob-kg").value}else{d.ft=g("ob-ft").value;d.inch=g("ob-in").value;d.lb=g("ob-lb").value}

  async function doAuth(){
    const email=d.email,pw=g("ob-pass").value,msg=g("ob-msg");msg.textContent="";
    if(!email||!pw){msg.textContent="Enter your email and password.";return false}
    if(d.authMode==="signup"){

  function draw(){
    layer.innerHTML=`<div class="ob"><div class="app">${bar()}<div class="panel">${screens[step]()}</div>
      <div class="navrow"><button class="btn alt" id="ob-back">${step===first?"Cancel":"Back"}</button><button class="btn" id="ob-next">${step===N-1?"Start day 1":step===0?(d.authMode==="signup"?"Create account":"Log in"):"Next"}</button></div></div></div>`;

      const key=s.dataset.seg;save();d[key]=isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v;
      if(key==="goal")d.tracked=null;
      if(key==="units"){if(d.units==="imperial"&&d.cm){const inches=d.cm/2.54;d.ft=Math.floor(inches/12);d.inch=Math.round(inches%12);d.lb=d.kg?Math.round(d.kg/0.4536):""}
        if(d.units==="metric"&&d.ft){d.cm=Math.round((+d.ft*12+ +d.inch)*2.54);d.kg=d.lb?Math.round(d.lb*0.4536):""}}

    const so=g("ob-signout");if(so)so.onclick=async()=>{await sb.auth.signOut();user=null;S=null;layer.innerHTML="";document.getElementById("signout").hidden=true;onboarding()};
    g("ob-next").onclick=async e=>{
      const btn=e.currentTarget;save();
      if(step===0){btn.disabled=true;const ok=await doAuth();btn.disabled=false;if(!ok){if(page!=="app")draw2();return}first=1;step=1;draw();return}
      const err=valid();if(err){toast(err);return}
      if(step===2&&!d.tracked)d.tracked=presets(d.goal);
      if(step<N-1){step++;draw();layer.firstChild.scrollTop=0;return}
      btn.disabled=true;await finish();btn.disabled=false;
    };
  }
  // Redraw the account step while keeping any message on screen
  function draw2(){const m=g("ob-msg");const t=m?m.textContent:"",col=m?m.style.color:"";draw();const m2=g("ob-msg");if(m2){m2.textContent=t;m2.style.color=col}}
  draw();
}

// ---------- start up ----------
async function start(){
  const params=new URLSearchParams(location.search);
  if(!sb){page="intro";render();return}
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session&&session.user){user=session.user;if(await loadProfile()){page="app"}else page="intro"}else page="intro";
  }catch(e){console.error(e);page="intro"}
  if(params.get("intro")!==null)page="intro";
  render();
  if(params.get("support")==="thanks"){
    history.replaceState({},"",location.pathname);
    modal(`<h3 style="font-size:28px">Thank you</h3><p>Your coffee's on its way. It genuinely helps keep the Beast Challenge free for everyone.</p><p class="note">Stripe will email you a receipt. You won't be charged again.</p>`);
  }
}
if(sb)sb.auth.onAuthStateChange(async(event,session)=>{
  if(event==="SIGNED_OUT"){user=null}
});
start();
</script>
