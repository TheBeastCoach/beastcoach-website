<title>Beast Challenge — Beast Coach</title>
<meta name="description" content="A free 30-day challenge: walk 10,000 steps a day to a real destination, log a few simple habits, and build a streak you can see.">

<style>
:root{
  --bg:#F7F9F8; --surface:#FFFFFF; --ink:#1B2E24; --muted:#707973; --line:#E4E8E6;
  --sign:#2D6A4F; --sign-ink:#FFFFFF; --accent:#52B788; --accent-ink:#1B3022;
  --good:#2D6A4F; --warn:#B45309; --soft:#EAF1ED; --deep:#1B3022; --err:#E24B4A;
  --display:"Bebas Neue","Arial Narrow",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-synthesis:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.nav{position:sticky;top:0;z-index:15;background:rgba(27,46,36,0.97);border-bottom:1px solid rgba(255,255,255,0.08);padding-top:env(safe-area-inset-top,0px)}
.nav-inner{max-width:440px;margin:0 auto;height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav-logo{font-family:var(--display);font-size:24px;letter-spacing:2px;color:#fff;text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.nav-logo span{color:var(--accent)}
.nav-links{display:flex;gap:14px;align-items:center}
.nav-links a,.nav-links button{color:rgba(255,255,255,.8);text-decoration:none;font:500 14px var(--body);background:none;border:0;cursor:pointer;padding:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.03em}
p{margin:0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{background:none;border:0;padding:9px 4px;border-radius:9px;font:600 14px var(--body);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hello h2{font-size:30px;line-height:1.05}
.why{font-style:italic;color:var(--muted);font-size:14px}
.score{font-family:var(--display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.score small{font-size:18px;color:var(--muted)}
.sign{background:var(--sign);color:var(--sign-ink);border-radius:12px;padding:14px 16px;border:3px solid var(--sign-ink);box-shadow:0 0 0 2px var(--sign);display:flex;flex-direction:column;gap:10px}
.sign .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sign .dest{font-family:var(--display);font-size:22px;line-height:1.1;min-width:0;letter-spacing:.03em}
.sign .km{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;white-space:nowrap}
.road{height:14px;border-radius:7px;background:rgba(255,255,255,.22);position:relative;overflow:hidden}
.road i{position:absolute;inset:0 auto 0 0;background:#F59E0B;border-radius:7px}
.road::after{content:"";position:absolute;left:0;right:0;top:6px;border-top:2px dashed rgba(255,255,255,.55)}
.sign .sub{font-size:14px;opacity:.9}
.day-chips{display:flex;gap:6px;flex-wrap:wrap}
.day-chips button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 13px var(--body);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.day-chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day-chips .dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.catchup{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--soft);border:1px solid color-mix(in srgb,var(--accent) 60%,var(--line));border-radius:10px;padding:10px 12px;font-size:14px;flex-wrap:wrap}
.catchup p{flex:1 1 180px;min-width:0}
.item{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .name{font-weight:600}
.item .meta{font-size:14.5px;color:var(--muted);grid-column:1/-1;margin-top:-6px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.hit{background:var(--good);color:var(--surface)}
.pill.miss{background:var(--soft);color:var(--muted)}
.pill.off{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.ctrl{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctrl input,.ctrl select{flex:1;min-width:0;font:500 16px var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 14px;font:700 14px var(--body);cursor:pointer;white-space:nowrap;text-align:center;text-decoration:none}
.btn:disabled{opacity:.6;cursor:default}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.accent{background:var(--sign);color:#FFFFFF}
.btn.big{padding:14px 18px;font-size:16px}
.toggle{display:flex;gap:6px}
.toggle button{flex:1}
.entries{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.entries span{background:var(--soft);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.entries button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0 6px}
.grid30{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.grid30 div{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);background:var(--soft);max-width:100%}
.grid30 .s1{background:color-mix(in srgb,var(--good) 35%,var(--soft));color:var(--ink)}
.grid30 .s2{background:color-mix(in srgb,var(--good) 65%,var(--soft));color:var(--surface)}
.grid30 .s3{background:var(--good);color:var(--surface)}
.grid30 .today{outline:2px solid var(--accent);outline-offset:1px}
.grid30 .future{background:transparent;border:1px dashed var(--line)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);text-align:center}
.badge .disc{width:52px;height:52px;max-width:100%;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:22px;border:2px dashed var(--line);color:var(--muted)}
.badge.on .disc{background:var(--sign);color:#FFFFFF;border:3px solid var(--accent)}
.badge.on{color:var(--ink);font-weight:600}
.routes{display:flex;flex-direction:column;gap:8px}
.route{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;text-align:left;color:var(--ink);font:500 15px var(--body);width:100%}
.route[aria-pressed="true"]{border-color:var(--sign);box-shadow:inset 0 0 0 2px var(--sign)}
.route b{font-variant-numeric:tabular-nums;font-family:var(--display);font-weight:400;font-size:18px;white-space:nowrap}
.route .rh{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-top:2px}
@media (max-width:480px){.route{font-size:16.5px}.route .rh{font-size:14.5px}}
.region-h{margin-top:6px}
.meals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meal{border-radius:12px;overflow:hidden;background:var(--bg);border:1px solid var(--line);cursor:pointer;text-align:left;padding:0;color:var(--ink);font:inherit}
.meal .ph{aspect-ratio:4/3;display:grid;place-items:center;font-family:var(--display);font-size:15px;color:var(--muted);letter-spacing:.06em;background:var(--soft);max-width:100%}
.meal p{padding:8px 10px 2px;font-weight:600;font-size:14px;line-height:1.25}
.meal small{display:block;padding:0 10px 4px;color:var(--muted);font-size:12px}
.meal .tag{display:inline-block;margin:0 10px 8px;font-size:11px;font-weight:700;color:var(--sign);text-transform:uppercase;letter-spacing:.06em}
.meal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;max-width:100%}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{flex:0 1 auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 13px;font:600 13px var(--body);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--sign);color:#FFFFFF;border-color:var(--sign)}
.recipe img{width:100%;border-radius:10px;aspect-ratio:4/3;object-fit:cover}
.recipe ul,.recipe ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.est{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.est b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;color:var(--sign);white-space:nowrap}
.est span{font-size:13px;color:var(--muted)}
.supportbox{border:2px solid var(--sign);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.supportbox h3{font-size:24px}
.supportbox .facts{display:flex;flex-wrap:wrap;gap:6px}
.supportbox .facts span{background:var(--soft);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.donate-mini{border-color:var(--sign);flex-direction:row;align-items:center;gap:14px;padding:14px 16px}
.donate-mini p{flex:1;min-width:0;font-size:16px;line-height:1.45}
.donate-mini .btn{flex:none;padding:12px 16px;font-size:15px}
@media (max-width:420px){.donate-mini{flex-direction:column;align-items:stretch}.donate-mini .btn{width:100%}}
.support-mini{display:flex;flex-direction:row;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:var(--muted)}
.support-mini p{flex:1 1 220px;min-width:0;font-size:15px}
.community{font-size:14px;color:var(--muted)}
.community b{color:var(--ink)}
canvas{width:100%;max-width:270px;height:auto;border-radius:12px;display:block;margin:0 auto;border:1px solid var(--line)}
.note{font-size:14.5px;color:var(--muted)}
@media (max-width:480px){.note,.why,.sign .sub,.catchup,.item .meta,.community,.disclaimer,.faq p{font-size:16.5px;line-height:1.55}}
.hero{background:var(--deep);color:var(--sign-ink);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:12px}
.hero .eyebrow{font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;font-size:16px;opacity:.85}
.hero h1{font-size:52px;line-height:.95;text-transform:uppercase}
.hero p{font-size:17px;max-width:34ch}
.how{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none;counter-reset:s}
.how li{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;counter-increment:s}
.how li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-size:18px}
.how b{display:block}
.how span{color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:14px;background:var(--bg)}
.disclaimer{font-size:14.5px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.disclaimer ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.disclaimer a{color:var(--sign);font-weight:600}
.linkbtn{background:none;border:0;padding:0;color:var(--sign);font:600 inherit var(--body);font-size:inherit;text-decoration:underline;cursor:pointer}
.agree{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;font-size:14px}
.agree input{width:20px;height:20px;accent-color:var(--sign);flex:none;margin-top:1px}
.faq details{border-top:1px solid var(--line);padding:10px 0}
.faq details:first-of-type{border-top:0}
.faq summary{font-weight:600;cursor:pointer}
.faq p{color:var(--muted);font-size:14px;margin-top:6px}
.ob{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ob .app{gap:16px}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--sign)}
.ob h2{font-size:32px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .flabel{font-weight:600;font-size:14px}
.field input,.field select{font:500 16px var(--body);padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
.field .hint{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:600 14px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.checks{display:flex;flex-direction:column;gap:8px}
.check{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--sign);flex:none}
.check small{display:block;color:var(--muted);font-size:13px}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc .wide{grid-column:1/-1}
.navrow{display:flex;gap:10px;justify-content:space-between}
.ob .navrow{position:sticky;bottom:0;z-index:2;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 12px -8px var(--bg)}
.route .cur{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--sign)}
.lockbar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.lockbar b{display:block;font-size:16px}.lockbar span{font-size:14px;opacity:.85}
.lockbar .lockbtns{display:flex;gap:8px}.lockbar .lockbtns .btn{flex:1}
.restart p{font-size:14.5px;color:var(--muted)}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn.tiny{padding:6px 12px;font-size:13px}
.msg{font-size:14px;color:var(--err)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;z-index:30;padding:16px;overflow-y:auto}

.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.road i{transition:width .6s ease}}
.d{--bg:#EEF6F0;--card:#FFFFFF;--ink:#1B3022;--muted:#4F6757;--line:#DCE8DF;--band:#2D6A4F;--band-ink:#FFFFFF;--band-soft:#B9DCC8;--accent:#52B788;--accent-ink:#1B4332;--accent-soft:#D8F3DC;--amber:#F59E0B;--amber-soft:#FFF1CC;--amber-ink:#6B4200;--idle-bg:#E9EEEA;--idle-ink:#3A4A40;--sign:#2D6A4F;--sign-ink:#FFFFFF;--sign-track:rgba(255,255,255,.2);--focus:#1B6FD8;--c1:#CDEBD6;--c2:#74C69D;--c3:#2D6A4F;--t1:#1B4332;--t2:#06281A;--t3:#FFFFFF;display:flex;flex-direction:column;gap:14px;color:var(--ink)}
body.inapp{background:#EEF6F0}
.d button,.d input{font:inherit;color:inherit}
.d [hidden]{display:none!important}
.d :focus-visible{outline:3px solid var(--focus);outline-offset:2px}

// ---------- calorie and target calculator ----------
// Calculator formula (Mifflin-St Jeor × daily activity). Steps aren't asked: if they track steps,
// the challenge's 10,000 a day is built in, and workouts are counted on the day they're logged.
const GOALS={fatloss:{label:"Fat loss",proteinPerKg:2.2,delta:-500},recomp:{label:"Tone",proteinPerKg:2.0,delta:-250},muscle:{label:"Muscle",proteinPerKg:1.8,delta:300}};
function calcTargets(p){
  const bmr=10*p.kg+6.25*p.cm-5*p.age+(p.sex==="male"?5:-161);
  const stepsKcal=p.walk?STEP_GOAL*p.kg*0.00057:0;
  const maint=bmr*p.job+stepsKcal;
  const g=GOALS[p.goal];
  const bmi=p.kg/((p.cm/100)**2);
  return {bmr:Math.round(bmr),maint:Math.round(maint),target:Math.round(maint+g.delta),protein:Math.round(p.kg*g.proteinPerKg),bmi:Math.round(bmi*10)/10,stepsKcal:Math.round(stepsKcal)};
}
function bmiNote(b){return b<18.5?"below the healthy range":b<25?"in the healthy range":b<30?"above the healthy range":"well above the healthy range"}

let user=null, S=null, page="loading", tab="today", logDay=null, mealFilter="all", communityKm=null, pendingRoute=null;

const parseDate=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
function todayDate(){const t=new Date();t.setHours(0,0,0,0);return t}
function dayDate(d){const x=new Date(S.start);x.setDate(x.getDate()+d-1);return x}
function rawDay(){return Math.round((todayDate()-S.start)/864e5)+1}
function currentDay(){return Math.min(30,Math.max(1,rawDay()))}
function finished(){return rawDay()>30}
function dayNum(s){return Math.round((parseDate(s)-S.start)/864e5)+1}
function L(d){return S.logs[d]||(S.logs[d]={steps:null,water:0,sleep:null,protein:false,alcohol:false,kcal:[],workouts:[]})}

// ---------- scoring and streaks ----------
function dueItems(d){const dow=dayDate(d).getDay();return S.tracked.filter(k=>k!=="workout"||S.workoutDays.includes(dow))}
const kcalTotal=l=>l.kcal.reduce((a,b)=>a+b.k,0);
function hit(k,l){
  if(!l)return false;
  switch(k){
    case"steps":return (l.steps||0)>=STEP_GOAL;
    case"workout":return l.workouts.length>0;
    case"calories":return l.kcal.length>0;
    case"protein":return !!l.protein;
    case"water":return (l.water||0)>=S.targets.water;
    case"sleep":return l.sleep!=null&&Math.abs(l.sleep-S.targets.sleep)<=0.5;
    case"alcohol":return !!l.alcohol;
  }}
function dayScore(d){const l=S.logs[d];const due=dueItems(d);if(!l||!due.length)return 0;return Math.round(due.filter(k=>hit(k,l)).length/due.length*100)}
function logged(d){const l=S.logs[d];if(!l)return false;return (l.steps||0)>0||l.water>0||l.protein||l.alcohol||l.kcal.length>0||l.workouts.length>0||l.sleep!=null}
function challengeScore(){const n=currentDay();let t=0;for(let d=1;d<=n;d++)t+=dayScore(d);return Math.round(t/n)}
function streaks(){
  const cd=currentDay();let best=0,run=0;
  for(let d=1;d<=cd;d++){run=logged(d)?run+1:0;best=Math.max(best,run)}
  let cur=0;let d=logged(cd)||finished()?cd:cd-1; // today not logged yet doesn't break the streak
  while(d>=1&&logged(d)){cur++;d--}
  return {cur,best};
}
function kmWalked(){let t=0;for(let d=1;d<=30;d++){const l=S.logs[d];if(l)t+=l.steps||0}return t*M_PER_STEP/1000}

function profileToState(p){
  const ri=ROUTES.findIndex(r=>r[1]===p.route);
  return {name:p.first_name,why:p.why,region:p.region,route:ri<0?defaultRoute(p.region):ri,tracked:p.tracked||[],
    targets:{calories:p.calorie_target,protein:p.protein_target,water:p.water_target||8,sleep:+p.sleep_target||7.5},
    workoutDays:p.workout_days||[],start:parseDate(p.start_date),kg:+p.weight_kg,maint:p.maintenance,stepsBaseline:p.steps_baseline||0,logs:{}};
}
async function loadLogs(){
  const from=dateStr(S.start);
  const [days,cals,wos]=await Promise.all([
    sb.from("beast_challenge_days").select("*").eq("user_id",user.id).gte("day",from),
    sb.from("beast_challenge_calories").select("id,day,kcal").eq("user_id",user.id).gte("day",from).order("id"),
    sb.from("beast_challenge_workouts").select("id,day,location,type,minutes").eq("user_id",user.id).gte("day",from).order("id")]);
  if(days.error||cals.error||wos.error)throw (days.error||cals.error||wos.error);
  S.logs={};
  days.data.forEach(r=>{const l=L(dayNum(r.day));Object.assign(l,{steps:r.steps,water:r.water||0,sleep:r.sleep==null?null:+r.sleep,protein:r.protein_hit,alcohol:r.alcohol_free})});
  cals.data.forEach(r=>L(dayNum(r.day)).kcal.push({id:r.id,k:r.kcal}));
  wos.data.forEach(r=>L(dayNum(r.day)).workouts.push({id:r.id,where:r.location,type:r.type,min:r.minutes}));
}
async function loadProfile(){
  const {data,error}=await sb.from("beast_challenge_profiles").select("*").eq("user_id",user.id).maybeSingle();
  if(error)throw error;
  if(!data){S=null;return false}
  S=profileToState(data);await loadLogs();return true;
}
async function saveDay(d){
  const l=L(d);
  const {error}=await sb.from("beast_challenge_days").upsert({user_id:user.id,day:dateStr(dayDate(d)),steps:l.steps,water:l.water||0,sleep:l.sleep,protein_hit:!!l.protein,alcohol_free:!!l.alcohol,updated_at:new Date().toISOString()});
  if(error)return failed(error);
}
async function failed(err){console.error(err);toast("Couldn't save that. Check your connection and try again.");try{await loadLogs()}catch(e){}render()}
// Begin Day 1 again today. Anything logged from today onwards is cleared; older days simply stop counting.
async function restartChallenge(){
  const today=todayDate();
  const nums=Object.keys(S.logs).map(Number).filter(n=>dayDate(n)>=today);
  const kIds=[],wIds=[];
  nums.forEach(n=>{S.logs[n].kcal.forEach(x=>x.id&&kIds.push(x.id));S.logs[n].workouts.forEach(x=>x.id&&wIds.push(x.id))});
  try{
    if(kIds.length){const {error}=await sb.from("beast_challenge_calories").delete().in("id",kIds);if(error)throw error}
    if(wIds.length){const {error}=await sb.from("beast_challenge_workouts").delete().in("id",wIds);if(error)throw error}
    for(const n of nums){const {error}=await sb.from("beast_challenge_days").upsert({user_id:user.id,day:dateStr(dayDate(n)),steps:null,water:0,sleep:null,protein_hit:false,alcohol_free:false,updated_at:new Date().toISOString()});if(error)throw error}
    const {error}=await sb.from("beast_challenge_profiles").update({start_date:dateStr(today),updated_at:new Date().toISOString()}).eq("user_id",user.id);
    if(error)throw error;
  }catch(err){mlayer.innerHTML="";return failed(err)}
  mlayer.innerHTML="";S.start=today;S.logs={};await loadLogs();logDay=1;pendingRoute=null;tab="today";render();window.scrollTo(0,0);toast("Day 1. Here we go again.");
}

function communityHTML(cls){return `<div class="${cls}" data-community${communityKm?"":" hidden"}>${communityText()}</div>`}
function communityText(){return communityKm?`Together, everyone in the Beast Challenge has walked about <b>${fmt(communityKm)} km</b>.`:""}

function habMeta(k,l){
  switch(k){
    case"steps":return `${fmt(l.steps||0)} of ${fmt(STEP_GOAL)} steps`;
    case"workout":return l.workouts.length?esc(l.workouts.map(w=>w.type+(w.min?" "+w.min+" min":"")).join(", ")):(S.workoutDays.length?`Planned ${S.workoutDays.map(d=>DOW[d]).join(", ")}`:"Gym or home");
    case"calories":{const t=kcalTotal(l);return `${fmt(t)} of ${fmt(S.targets.calories)} cal${t&&Math.abs(t-S.targets.calories)<=S.targets.calories*.1?" · on target":""}`}
    case"protein":return `Target ${S.targets.protein} g`;
    case"water":return `${l.water||0} of ${S.targets.water} glasses`;
    case"sleep":return l.sleep==null?`Aim for ${fh(S.targets.sleep)} hours`:`${fh(l.sleep)} hours. Aim for ${fh(S.targets.sleep)}`;
    case"alcohol":return hit("alcohol",l)?"Stayed off it":"Stayed off it?";
  }
}

function sleepStatus(h){const t=S.targets.sleep,lo=t-.5,hi=t+.5;
  if(h>=lo&&h<=hi)return["ok","In the sweet spot. This counts as done."];
  if(h<lo)return["no",`A little short. Done counts ${fh(lo)} to ${fh(hi)} hours.`];
  return["no",`A bit over. Done counts ${fh(lo)} to ${fh(hi)} hours.`]}
function sleepVisual(h){
  const min=4,max=12,pos=Math.max(0,Math.min(100,(h-min)/(max-min)*100)),zl=Math.max(0,(S.targets.sleep-.5-min)/(max-min)*100),zw=1/(max-min)*100,s2=sleepStatus(h);
  return `<div class="nightwrap" aria-hidden="true"><div class="night"><div class="zone" style="left:${zl}%;width:${zw}%"></div></div><div class="moon" style="left:${pos}%"></div></div>
   <div class="ticks" aria-hidden="true"><span>4 h</span><span>8 h</span><span>12 h</span></div>
   <p class="status ${s2[0]}" role="status">${s2[1]}</p>`;
}

function habRow(k,l,due){
  const done=hit(k,l), isDue=due.includes(k), isOpen=openHab===k&&EXPANDS.includes(k);
  const pill=!isDue&&!done?`<span class="pill rest">Rest day</span>`:`<span class="pill">${done?"Done":"Not yet"}</span>`;
  const inner=`<span class="htxt"><span class="hname">${HNAME[k]}${pill}</span><span class="meta">${habMeta(k,l)}</span>${k==="steps"?`<span class="mini"><i style="width:${Math.min(100,(l.steps||0)/STEP_GOAL*100)}%"></i></span>`:""}</span>`;
  const ico=`<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg></span>`;
  const cls=`habit${done?" done":""}${isOpen?" open":""}`;
  if(EXPANDS.includes(k)){
    const panel={steps:stepsPanel,workout:workoutPanel,calories:mealsPanel,water:waterPanel,sleep:sleepPanel}[k](l);
    return `<article class="${cls}" data-k="${k}"><button class="hrow" aria-expanded="${isOpen}" data-open="${k}">${ico}${inner}${CHEV}</button>${isOpen?panel:""}</article>`;
  }
  const on=k==="protein"?!!l.protein:!!l.alcohol;
  const label=k==="protein"?(on?"Hit it ✓":"I hit it"):(on?"Yes ✓":"Yes");
  return `<article class="${cls}" data-k="${k}"><div class="hrow">${ico}${inner}<div class="ctl"><button class="tog" data-act="${k}" aria-pressed="${on}">${label}</button></div></div></article>`;
}

function vRoute(){

  }

function confirmAdd(r){
  const cd=currentDay(), d=logDay, word=dayWord(d,cd), batch=/batch/i.test(r.kl||""), odd=(r.kl||"kcal")!=="kcal"&&!batch;
  let n=1;const t=kcalTotal(L(d));
  const note=batch?`<div class="warn">The calories on this recipe are for the whole batch. We’ll add that amount for each serving, so check it suits what you ate.</div>`:odd?`<div class="warn">The calories on this recipe are listed ${esc((r.kl||"").replace(/^kcal\s*/,""))}. We’ll add that amount for each serving.</div>`:"";
  mlayer.innerHTML=`<div class="d"><div class="scrim" id="dlg"><div class="dlgbox" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h2 id="dlgT">Add to ${word==="2 days ago"?"that day’s":word+"’s"} calories?</h2><p id="dlgP"></p>${note}
   <div class="stepper" style="margin-top:14px"><button class="sq" id="sMinus" aria-label="Half a serving less">−</button><div class="hv"><b id="sN">1</b><span id="sW">serving</span></div><button class="sq fill" id="sPlus" aria-label="Half a serving more">+</button></div>
   <div class="calc2" id="dlgCalc"></div><button class="primary" id="dlgYes">Yes, add it</button><button class="linkish" id="dlgNo">Cancel</button></div></div></div>`;
  const cals=()=>Math.round(r.k*n), sv=()=>n%1===0?String(n):n.toFixed(1);

    document.getElementById("sN").textContent=sv();document.getElementById("sW").textContent=n===1?"serving":"servings";
    document.getElementById("dlgP").innerHTML=`This adds <b>${sv()} ${n===1?"serving":"servings"}</b> of <b>${esc(r.n)}</b> (${fmt(cals())} cal) to Log meals. You can remove it there if you change your mind.`;
    document.getElementById("dlgCalc").textContent=`${fmt(t)} cal → ${fmt(t+cals())} cal (target ${fmt(S.targets.calories)})`;
  };
  document.getElementById("sMinus").onclick=()=>{n=Math.max(.5,n-.5);upd()};
  document.getElementById("sPlus").onclick=()=>{n=Math.min(6,n+.5);upd()};

  document.getElementById("dlgYes").onclick=async()=>{
    const v=cals();if(!(v>=1&&v<=5000)){toast("That is over the 5,000 cal limit for one entry. Try fewer servings.");return}

  };

}

function onboarding(){
  const meta=(user&&user.user_metadata)||{};
  const d={name:(meta.full_name||"").split(" ")[0],region:"Australia",units:"metric",sex:"",age:"",cm:"",kg:"",ft:"",inch:"",lb:"",job:1.15,goal:"fatloss",why:"",found:"Instagram",
    tracked:null,targets:{water:8,sleep:7.5},workoutDays:[1,3,5],route:0,calc:null,over:{},agree:false,authMode:"signup"};
  try{const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"";
    d.region=tz.startsWith("Australia")?"Australia":tz.startsWith("Africa/Johannesburg")?"South Africa":tz==="Europe/London"?"UK":/^America\/(Toronto|Vancouver|Edmonton|Winnipeg|Halifax|Montreal|Regina|St_Johns)/.test(tz)?"Canada":tz.startsWith("America")?"US":"Australia";
    if(d.region==="US"||d.region==="UK")d.units="imperial";}catch(e){}
  d.route=defaultRoute(d.region);
  const presets=g=>({fatloss:["steps","calories","protein","water"],recomp:["steps","workout","protein","sleep"],muscle:["workout","calories","protein","sleep"]})[g];
  const N=6;let first=user?1:0;let step=first;
  const lab=i=>`Step ${i+1-first} of ${N-first}`;
  const bar=()=>`<div class="steps">${Array.from({length:N-first},(_,i)=>`<i class="${i+first<=step?"on":""}"></i>`).join("")}</div>`;
  const seg=(key,opts)=>`<div class="seg" data-seg="${key}">${opts.map(([v,t])=>`<button type="button" data-v="${v}" aria-pressed="${String(d[key])===String(v)}">${t}</button>`).join("")}</div>`;
  const body=()=>({kg:d.units==="metric"?+d.kg:+d.lb*0.4536,cm:d.units==="metric"?+d.cm:(+d.ft*12+ +d.inch)*2.54,age:+d.age,sex:d.sex,job:+d.job,goal:d.goal,walk:(d.tracked||presets(d.goal)).includes("steps")});
  const screens=[
    ()=>`<div class="label">${lab(0)} · Account</div><h2>Start your 30 days</h2><p class="note">Use your beastcoach.fit account, or create a free one. It's the same login as the member dashboard.</p>
      ${seg("authMode",[["signup","Create account"],["signin","Log in"]])}
      ${d.authMode==="signup"?`<div class="field"><label for="ob-fullname">Your name</label><input id="ob-fullname" autocomplete="name" value="${esc(d.name)}"></div>`:""}
      <div class="field"><label for="ob-email">Email</label><input id="ob-email" type="email" autocomplete="email" value="${esc(d.email||"")}"></div>
      <div class="field"><label for="ob-pass">Password</label><input id="ob-pass" type="password" autocomplete="${d.authMode==="signup"?"new-password":"current-password"}" minlength="6"></div>
      ${d.authMode==="signin"?`<a class="note" href="/dashboard" style="color:var(--sign)">Forgot your password? Reset it from the dashboard.</a>`:""}
      <p class="msg" id="ob-msg" role="alert"></p>`,
    ()=>`<div class="label">${lab(1)} · About you</div><h2>The basics</h2>${user?`<div class="catchup"><p>Signed in as <b>${esc(user.email)}</b>.</p><button type="button" class="btn alt" id="ob-signout">Not you?</button></div>`:""}
      <div class="field"><label for="ob-name">First name</label><input id="ob-name" value="${esc(d.name)}" placeholder="Your first name" autocomplete="given-name"></div>
      <div class="two"><div class="field"><label for="ob-region">Region</label><select id="ob-region">${["Australia","US","South Africa","UK","Canada"].map(r=>`<option ${r===d.region?"selected":""}>${r}</option>`).join("")}</select></div>
      <div class="field"><label for="ob-age">Age</label><input id="ob-age" type="number" inputmode="numeric" min="16" max="90" value="${esc(d.age)}" placeholder="Years"></div></div>
      <div class="field"><span class="flabel">Sex</span>${seg("sex",[["female","Female"],["male","Male"]])}<span class="hint">Used only to calculate your calories.</span></div>
      <div class="field"><span class="flabel">Units</span>${seg("units",[["metric","cm / kg"],["imperial","ft / lb"]])}</div>
      ${d.units==="metric"?`<div class="two"><div class="field"><label for="ob-cm">Height (cm)</label><input id="ob-cm" type="number" inputmode="numeric" value="${esc(d.cm)}" placeholder="e.g. 175"></div><div class="field"><label for="ob-kg">Weight (kg)</label><input id="ob-kg" type="number" inputmode="decimal" value="${esc(d.kg)}" placeholder="e.g. 88"></div></div>`
       :`<div class="two"><div class="field"><label for="ob-ft">Height (ft)</label><input id="ob-ft" type="number" inputmode="numeric" value="${esc(d.ft)}" placeholder="5"></div><div class="field"><label for="ob-in">(in)</label><input id="ob-in" type="number" inputmode="numeric" value="${esc(d.inch)}" placeholder="9"></div></div><div class="field"><label for="ob-lb">Weight (lb)</label><input id="ob-lb" type="number" inputmode="decimal" value="${esc(d.lb)}" placeholder="e.g. 195"></div>`}`,
    ()=>`<div class="label">${lab(2)} · Your day</div><h2>How active are you now?</h2>
      <div class="field"><label for="ob-job">Daily activity (job and lifestyle, not counting exercise)</label><select id="ob-job">${[[1.15,"Desk job: mostly sitting"],[1.25,"On your feet sometimes: teaching, service, errands"],[1.35,"Physically demanding: trades, labour, delivery"]].map(([v,t])=>`<option value="${v}" ${+d.job===v?"selected":""}>${t}</option>`).join("")}</select></div>
      <div class="field"><span class="flabel">Your goal</span>${seg("goal",[["fatloss","Fat loss"],["recomp","Tone"],["muscle","Muscle"]])}</div>
      <div class="field"><label for="ob-why">Why are you doing this? (optional)</label><input id="ob-why" value="${esc(d.why)}" placeholder="One line, just for you" maxlength="140"></div>
      <div class="field"><label for="ob-found">How did you find us?</label><select id="ob-found">${["Instagram","TikTok","A friend","Other"].map(o=>`<option ${o===d.found?"selected":""}>${o}</option>`).join("")}</select></div>`,
    ()=>`<div class="label">${lab(3)} · What you'll log</div><h2>Pick 3 or 4 to start</h2><p class="note">We've ticked a good starting set for you. You can add more later.</p>
      <div class="checks">${Object.entries(ITEMS).map(([k,v])=>`<label class="check"><input type="checkbox" data-k="${k}" ${d.tracked.includes(k)?"checked":""}><span><b>${v[0]}</b><small>${v[1]}</small></span></label>`).join("")}</div>`,
    ()=>{const c=d.calc=calcTargets(body());const t=d.tracked;
      const cal=d.over.calories??c.target, pro=d.over.protein??c.protein;
      let h=`<div class="label">${lab(4)} · Your numbers</div><h2>Here's what we worked out</h2>
       <div class="calc">
        <div class="stat"><b>${c.bmi}</b><span>BMI, ${bmiNote(c.bmi)}</span></div>
        <div class="stat"><b>${fmt(c.maint)}</b><span>calories to maintain</span></div>
        <div class="stat wide"><b>${fmt(cal)} cal · ${pro} g protein</b><span>your daily target for ${GOALS[d.goal].label.toLowerCase()} (${GOALS[d.goal].delta>0?"+":"−"}${Math.abs(GOALS[d.goal].delta)} cal from maintenance)</span></div>
       </div>
       <p class="note">${t.includes("steps")?`This includes the 10,000 steps a day you'll walk in the challenge (about ${c.stepsKcal} calories). `:""}Workouts you log are counted on the day, not built in here. BMI is a rough guide and can't tell muscle from fat. You can change any number below.</p>`;
      if(t.includes("calories"))h+=`<div class="field"><label for="ob-cal">Daily calories</label><input id="ob-cal" type="number" value="${cal}"></div>`;
      if(t.includes("protein"))h+=`<div class="field"><label for="ob-pro">Daily protein (g)</label><input id="ob-pro" type="number" value="${pro}"></div>`;
      if(t.includes("water"))h+=`<div class="field"><label for="ob-water">Glasses of water a day</label><input id="ob-water" type="number" value="${d.targets.water}"><span class="hint">We recommend 8.</span></div>`;
      if(t.includes("sleep"))h+=`<div class="field"><label for="ob-sleep">Hours of sleep</label><input id="ob-sleep" type="number" step="0.5" value="${d.targets.sleep}"><span class="hint">We recommend 7.5.</span></div>`;
      if(t.includes("workout"))h+=`<div class="field"><span class="flabel">Which days will you train?</span><div class="day-chips">${DOW.map((n,i)=>`<button type="button" data-wd="${i}" aria-pressed="${d.workoutDays.includes(i)}">${n}</button>`).join("")}</div><span class="hint">Other days count as rest days, not misses.</span></div>`;
      return h},
    ()=>{const agree=`<label class="agree"><input type="checkbox" id="ob-agree" ${d.agree?"checked":""}><span>I understand this is general information, not medical advice, and I take part at my own risk. <button type="button" class="linkbtn" data-disclaimer>Read the disclaimer</button></span></label>`;
      if(!d.tracked.includes("steps"))return `<div class="label">${lab(5)} · Ready</div><h2>You're set, ${esc(d.name)}</h2><p class="note">Add Steps any time to walk a route.</p>${agree}`;
      const list=ROUTES.map((r,i)=>[r,i]).filter(([r])=>r[0]===d.region);
      return `${agree}<div class="label">${lab(5)} · Your route</div><h2>Where are you walking?</h2><p class="note">10,000 steps a day is about 8 km, so around 240 km in 30 days. Short routes you can finish. Longer ones are epic journeys, and you cover as much of the way as you can.</p>
      <div class="routes">${list.map(([r,i])=>`<button type="button" class="route" data-r="${i}" aria-pressed="${i===d.route}"><span>${r[1]}<small class="rh">${routeHint(r[2])}</small></span><b>${r[2]} km</b></button>`).join("")}</div>`}
  ];
  const g=id=>document.getElementById(id);
  function save(){
    if(step===0){d.email=g("ob-email").value.trim();if(g("ob-fullname"))d.name=g("ob-fullname").value.trim().split(" ")[0]}
    if(step===1){d.name=g("ob-name").value.trim();d.region=g("ob-region").value;d.age=g("ob-age").value;
      if(d.units==="metric"){d.cm=g("ob-cm").value;d.kg=g("ob-kg").value}else{d.ft=g("ob-ft").value;d.inch=g("ob-in").value;d.lb=g("ob-lb").value}
      if(ROUTES[d.route][0]!==d.region)d.route=defaultRoute(d.region)}
    if(step===2){d.job=+g("ob-job").value;d.why=g("ob-why").value.trim();d.found=g("ob-found").value}
    if(step===3)d.tracked=[...layer.querySelectorAll("[data-k]")].filter(c=>c.checked).map(c=>c.dataset.k);
    if(step===4){if(g("ob-cal"))d.over.calories=+g("ob-cal").value||undefined;if(g("ob-pro"))d.over.protein=+g("ob-pro").value||undefined;
      if(g("ob-water"))d.targets.water=Math.min(40,Math.max(1,+g("ob-water").value||8));if(g("ob-sleep"))d.targets.sleep=Math.min(14,Math.max(1,+g("ob-sleep").value||7.5))}
    if(step===N-1)d.agree=g("ob-agree").checked;
  }
  function valid(){
    if(step===1){const p=body();
      if(!d.name)return"Add your first name";
      if(!(p.age>=16&&p.age<=90))return"Enter an age between 16 and 90";
      if(!d.sex)return"Choose female or male";
      if(!(p.cm>=120&&p.cm<=230))return"Check your height";
      if(!(p.kg>=35&&p.kg<=300))return"Check your weight"}
    if(step===3&&!d.tracked.length)return"Pick at least one thing to log";
    if(step===4){if(d.tracked.includes("calories")&&!((d.over.calories??d.calc.target)>=800&&(d.over.calories??d.calc.target)<=6000))return"Daily calories should be between 800 and 6,000";
      if(d.tracked.includes("protein")&&!((d.over.protein??d.calc.protein)>=20&&(d.over.protein??d.calc.protein)<=400))return"Daily protein should be between 20 and 400 g"}
    if(step===N-1&&!d.agree)return"Tick the box to confirm you've read the disclaimer";
    return"";
  }
  async function doAuth(){
    const email=d.email,pw=g("ob-pass").value,msg=g("ob-msg");msg.textContent="";
    if(!email||!pw){msg.textContent="Enter your email and password.";return false}
    if(d.authMode==="signup"){
      if(pw.length<6){msg.textContent="Use at least 6 characters for your password.";return false}
      const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{full_name:g("ob-fullname").value.trim()},emailRedirectTo:window.location.origin+"/beast-challenge"}});
      if(error){msg.textContent=error.message||"Couldn't create your account.";return false}
      if(!data.session){msg.style.color="var(--sign)";msg.textContent="Check your email to confirm your account, then come back here and log in. Can't find it? Check your spam/junk folder.";d.authMode="signin";return false}
      user=data.user;
    }else{
      const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
      if(error){msg.textContent=error.message||"Couldn't log in.";return false}
      user=data.user;
    }
    // Already started? Skip onboarding and open their challenge.
    if(await loadProfile()){layer.innerHTML="";logDay=null;tab="today";go("app");toast(`Welcome back, ${S.name}`);return false}
    const m=user.user_metadata||{};if(!d.name&&m.full_name)d.name=m.full_name.split(" ")[0];
    return true;
  }
  async function finish(){
    const bp=body(),c=calcTargets(bp);
    const row={user_id:user.id,first_name:d.name,region:d.region,units:d.units,sex:d.sex,age:bp.age,height_cm:Math.round(bp.cm*10)/10,weight_kg:Math.round(bp.kg*10)/10,
      activity:bp.job,goal:d.goal,why:d.why||null,found_via:d.found,tracked:d.tracked,
      calorie_target:d.over.calories??c.target,protein_target:d.over.protein??c.protein,water_target:d.targets.water,sleep_target:d.targets.sleep,
      workout_days:d.tracked.includes("workout")?d.workoutDays:[],route:ROUTES[d.route][1],maintenance:c.maint,steps_baseline:bp.walk?STEP_GOAL:0,
      start_date:dateStr(todayDate()),agreed_disclaimer_at:new Date().toISOString(),updated_at:new Date().toISOString()};
    const {error}=await sb.from("beast_challenge_profiles").upsert(row);
    if(error){console.error(error);toast("Couldn't start your challenge. Please try again.");return}
    S=profileToState(row);layer.innerHTML="";tab="today";logDay=1;go("app");toast(`Day 1. Let's go, ${d.name}`);
  }
  function draw(){
    layer.innerHTML=`<div class="ob"><div class="app">${bar()}<div class="panel">${screens[step]()}</div>
      <div class="navrow"><button class="btn alt" id="ob-back">${step===first?"Cancel":"Back"}</button><button class="btn" id="ob-next">${step===N-1?"Start day 1":step===0?(d.authMode==="signup"?"Create account":"Log in"):"Next"}</button></div></div></div>`;
    layer.querySelectorAll("[data-seg]").forEach(s=>s.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      const key=s.dataset.seg;save();d[key]=isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v;
      if(key==="goal")d.tracked=null;
      if(key==="units"){if(d.units==="imperial"&&d.cm){const inches=d.cm/2.54;d.ft=Math.floor(inches/12);d.inch=Math.round(inches%12);d.lb=d.kg?Math.round(d.kg/0.4536):""}
        if(d.units==="metric"&&d.ft){d.cm=Math.round((+d.ft*12+ +d.inch)*2.54);d.kg=d.lb?Math.round(d.lb*0.4536):""}}
      draw()}));
    layer.querySelectorAll("[data-wd]").forEach(b=>b.onclick=()=>{const i=+b.dataset.wd;d.workoutDays=d.workoutDays.includes(i)?d.workoutDays.filter(x=>x!==i):[...d.workoutDays,i].sort();b.setAttribute("aria-pressed",d.workoutDays.includes(i))});
    layer.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{d.route=+b.dataset.r;layer.querySelectorAll("[data-r]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
    g("ob-back").onclick=()=>{if(step===first){layer.innerHTML="";return}save();step--;draw()};
    const so=g("ob-signout");if(so)so.onclick=async()=>{await sb.auth.signOut();user=null;S=null;layer.innerHTML="";document.getElementById("signout").hidden=true;onboarding()};
    g("ob-next").onclick=async e=>{
      const btn=e.currentTarget;save();
      if(step===0){btn.disabled=true;const ok=await doAuth();btn.disabled=false;if(!ok){if(page!=="app")draw2();return}first=1;step=1;draw();return}
      const err=valid();if(err){toast(err);return}
      if(step===2&&!d.tracked)d.tracked=presets(d.goal);
      if(step<N-1){step++;draw();layer.firstChild.scrollTop=0;return}
      btn.disabled=true;await finish();btn.disabled=false;
    };
  }
  // Redraw the account step while keeping any message on screen
  function draw2(){const m=g("ob-msg");const t=m?m.textContent:"",col=m?m.style.color:"";draw();const m2=g("ob-msg");if(m2){m2.textContent=t;m2.style.color=col}}
  draw();
}

// ---------- start up ----------
async function start(){
  const params=new URLSearchParams(location.search);
  if(!sb){page="intro";render();return}
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session&&session.user){user=session.user;if(await loadProfile()){page="app"}else page="intro"}else page="intro";
  }catch(e){console.error(e);page="intro"}
  if(params.get("intro")!==null)page="intro";
  render();
  if(page==="app")loadCommunity();
  // Coming from the public landing page (/30-day-challenge): open sign up straight away.
  if(params.get("join")!==null&&page==="intro"&&!S){history.replaceState({},"",location.pathname);onboarding()}
  if(params.get("support")==="thanks"){
    history.replaceState({},"",location.pathname);
    modal(`<h3 style="font-size:28px">Thank you</h3><p>Your coffee's on its way. It genuinely helps keep the Beast Challenge free for everyone.</p><p class="note">Stripe will email you a receipt. You won't be charged again.</p>`);
  }
}
if(sb)sb.auth.onAuthStateChange(async(event,session)=>{
  if(event==="SIGNED_OUT"){user=null}
});
start();
</script>
</body>
</html>
