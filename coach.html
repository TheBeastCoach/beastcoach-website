<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach | Beast Coach</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B3022;--green:#2D6A4F;--mint:#52B788;--bg:#F4F7F2;--amber:#F59E0B;--amber-hover:#FFB62E;--muted:#3B4F43;--line:#D5E0D8;--red:#b42318;--amber-text:#8a5300}
*{box-sizing:border-box}
body{margin:0;font-family:'Manrope',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
h1,h2,h3,.disp{font-family:'Bebas Neue','Arial Narrow',Impact,sans-serif;font-weight:400;letter-spacing:.02em;margin:0;color:var(--ink)}
h1{font-size:clamp(48px,7vw,80px);line-height:.95}h2{font-size:clamp(36px,5vw,52px);line-height:1}h3{font-size:30px;line-height:1.05}
p{margin:0 0 10px}
a{color:var(--green)}a:hover{color:var(--ink)}
:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:18px 20px}
.muted{color:var(--muted);font-size:14px}
.eyebrow{font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
.card h3{margin-bottom:12px}
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:26px 24px;margin-bottom:16px}
.hero h1{color:#fff}.hero .muted{color:#D5E6DB}
.hero .eyebrow{color:#8FD3B0}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}
.grid3{display:grid;gap:14px;grid-template-columns:1fr}
.grid5{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}.grid5{grid-template-columns:repeat(5,1fr)}}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack>*+*{margin-top:10px}
.hidden,[hidden]{display:none !important}
/* demo bar */
.demo-bar{background:var(--ink);color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
@media(min-width:900px){.demo-bar{position:sticky;top:0;z-index:50}}
.logo{font-family:'Bebas Neue',Impact,sans-serif;font-size:24px;letter-spacing:.1em;color:#fff}
.logo span{color:var(--mint)}
.tag{background:var(--amber);color:#1B1200;font-weight:800;border-radius:6px;padding:3px 9px;font-size:12px;letter-spacing:1px}
.demo-bar select{width:auto;min-width:230px;max-width:100%}
.demo-bar .note{font-size:13px;color:#D5E6DB;flex:1 1 260px}
.ai{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px}
.ai.on{background:#d8f3e3;color:#1b5e3a}.ai.off{background:#fde7c2;color:#7a4a00}
/* form controls */
select,input,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid #C5D3C8;border-radius:12px;padding:10px 12px;width:100%;max-width:100%}
select option{color:var(--ink);background:#fff}
textarea{min-height:92px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;margin:0;accent-color:var(--green)}
label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.field{margin-bottom:12px}
.field.inline label{display:inline}
.err{color:var(--red);font-size:13px;margin-top:4px;min-height:0}
.err:empty{display:none}
.invalid{border-color:var(--red)!important;box-shadow:0 0 0 2px #fbd4cf}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid #C5D3C8;border-radius:999px;padding:7px 13px;background:#fff;cursor:pointer;font-size:14px;font-weight:600;margin:0}
.chip:has(input:checked){background:#d8f3e3;border-color:var(--mint)}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin:0 0 10px;cursor:pointer}
.check input{margin-top:4px}
.hl-red{background:#fdecea;border-left:4px solid var(--red);padding:9px 12px;border-radius:10px}
.hl-amber{background:#fff6e0;border-left:4px solid var(--amber);padding:9px 12px;border-radius:10px}
.note-box{background:#EEF5F0;border-radius:14px;padding:12px 14px;font-size:15px}
/* buttons: amber is the primary action, as on the sales page */
button,.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:13px 20px;min-height:48px;cursor:pointer;background:var(--amber);color:#1B1200;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
button:hover{background:var(--amber-hover)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:var(--ink);color:#fff}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid #C5D3C8}.btn-ghost:hover{background:#F4F7F2}
.btn-danger{background:#fff;color:var(--red);border:1px solid #f0c4c0}.btn-danger:hover{background:#fdecea}
.btn-sm{padding:7px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn-link{background:none;color:var(--green);padding:0;min-height:0;text-decoration:underline;font-weight:800}.btn-link:hover{background:none;color:var(--ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{background:#fff;color:var(--ink);border:1px solid #C5D3C8;padding:9px 16px;border-radius:999px;min-height:40px}
.tab:hover{background:#F4F7F2}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill{display:inline-block;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;white-space:nowrap}
.p-onboarding{background:#eef1f4;color:#3b4a57}.p-awaiting{background:#fff3d6;color:#8a5a00}.p-active{background:#d8f3e3;color:#1b5e3a}.p-paused{background:#e6ecff;color:#2c3e9a}.p-finished{background:#ececec;color:#444}
.need{display:inline-block;background:#fde7c2;color:#7a4a00;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:800;margin:2px 4px 2px 0}
.bar{height:10px;background:#E3EBE4;border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--mint)}
.bar>span.g{background:#2fa36b}.bar>span.a{background:var(--amber)}.bar>span.r{background:var(--red)}
.c-green{color:#1b7a46}.c-amber{color:var(--amber-text)}.c-red{color:var(--red)}
.metric{margin-bottom:14px}
.metric .top{display:flex;justify-content:space-between;gap:8px;font-size:15px;margin-bottom:5px;flex-wrap:wrap}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td input,td select{padding:7px 9px;font-size:14px}
td.num input{width:76px}
.meal{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start;flex-wrap:wrap}
.meal:last-child{border-bottom:0}
.meal .kcal{font-family:'Bebas Neue',Impact,sans-serif;font-size:28px;line-height:1;white-space:nowrap}
.meal .acts{display:flex;gap:6px}
.meal-edit{display:grid;gap:8px;grid-template-columns:repeat(2,1fr);width:100%}
.meal-edit .wide{grid-column:1/-1}
@media(min-width:700px){.meal-edit{grid-template-columns:repeat(6,1fr)}.meal-edit .wide{grid-column:span 2}}
.mini{font-size:14px;color:var(--muted)}
.edited{font-size:13px;color:var(--amber-text);background:#fff6e0;border-radius:8px;padding:4px 9px;display:inline-block;margin-top:5px}
.dl{display:grid;grid-template-columns:1fr;gap:2px 14px}
.dl dt{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:10px}
.dl dd{margin:0 0 4px;font-size:15px}
@media(min-width:700px){.dl{grid-template-columns:200px 1fr}.dl dt{margin-top:9px}}
.cap-nums{display:flex;gap:24px;margin:6px 0 14px}
.cap-nums b{font-family:'Bebas Neue',Impact,sans-serif;font-size:44px;line-height:1;display:block}
.cap-nums span{font-size:14px;color:var(--muted)}
.plans{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.plans{grid-template-columns:repeat(3,1fr)}}
.plan-card{display:flex;flex-direction:column;gap:8px}
.price{font-family:'Bebas Neue',Impact,sans-serif;font-size:52px;line-height:1}
.chart{width:100%;height:auto;display:block;margin:10px 0}
details{margin-bottom:10px}
summary{cursor:pointer;font-weight:800;padding:8px 0;list-style:none}
summary::-webkit-details-marker{display:none}
.day-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.day-row button{padding:8px 13px;border-radius:999px;font-size:14px;min-height:38px}
.day-row button.on{background:var(--ink);color:#fff}
.day-row button.dot::after{content:" \2022";color:var(--mint)}
.pre{white-space:pre-wrap;font-family:inherit;margin:0;font-size:15px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 18px;border-radius:14px;z-index:99;display:none;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{display:block}
.status-line{font-weight:700;font-size:17px;color:#fff}
.fine{font-size:13px;color:var(--muted)}
.list-clean{margin:6px 0 0;padding-left:18px}
.sr{position:absolute;left:-9999px}
.plan-inputs{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
.pi-grid{display:grid;gap:18px 26px;grid-template-columns:1fr;margin-top:14px}
@media(min-width:760px){.pi-grid{grid-template-columns:repeat(3,1fr)}}
.pi-sec h4{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:22px;margin:0 0 8px;letter-spacing:.02em}
.pi-sec p{margin:0 0 6px;font-size:15px}
.pi-tag{display:inline-block;background:#E8F3EC;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;margin:0 6px 6px 0}
.pi-tag.day{background:#d8f3e3}
@media(max-width:899px){h3{font-size:26px}}

.mchip{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:14px;color:var(--ink)}
.mchip i{width:12px;height:12px;border-radius:50%;background:var(--mc);display:inline-block;flex:none}
.ex-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #EEF3EF;flex-wrap:wrap}
.ex-row span{font-weight:700}
.pt-line{padding:7px 0;font-weight:800}
.pt-gap{height:8px}
.sheet-back{position:fixed;inset:0;background:rgba(15,28,20,.55);z-index:95}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px 20px 28px;z-index:96;box-shadow:0 -12px 40px rgba(0,0,0,.25)}
@media(min-width:700px){.sheet{left:50%;transform:translateX(-50%);width:620px;max-width:92vw;border-radius:22px;bottom:24px}}
@media(max-width:699px){.sheet{top:0;bottom:0;max-height:none;border-radius:0}}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:6px}
.sheet h4{font-family:'Bebas Neue','Arial Narrow',Impact,sans-serif;font-weight:400;font-size:24px;margin:18px 0 6px;letter-spacing:.02em}
.sheet p{margin:0 0 6px;font-size:16px}
.sheet ol,.sheet ul{padding-left:22px;margin:0}
.sheet li{margin:6px 0;font-size:16px}

.banner{background:#FFF6E0;border:2px solid var(--amber);color:#4a2c00;border-radius:14px;padding:13px 16px;margin-bottom:14px;font-weight:700}
.progress{height:10px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-top:14px}
.progress span{display:block;height:100%;background:var(--amber);border-radius:99px}
.ob-nav{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:4px 0 24px}
@media(max-width:699px){.ob-nav{flex-direction:column-reverse}.ob-nav button,.ob-nav .btn-ghost{width:100%}.ob-nav span{display:none}}

.ob-msg{color:var(--red);font-weight:700;margin:4px 0 12px;min-height:0}
.ob-msg:empty{display:none}
.target-row{display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.target-row:last-child{border-bottom:0}
.target-val{font-family:'Bebas Neue',Impact,sans-serif;font-size:40px;line-height:1;white-space:nowrap}
.target-val small{font-size:16px}
.wo-set{display:grid;grid-template-columns:44px 1fr 1fr auto;gap:8px;align-items:center;margin-top:6px}
.wo-set input{padding:8px 10px}
.wo-head{font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.log-ex{padding:4px 0}
.up-badge{display:inline-block;background:#d8f3e3;color:#1b5e3a;border:1px solid var(--mint);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:800;margin-left:4px}
.plans{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
/* add a meal: an action card with a segmented control and one primary button */
.add-card{border:2px solid var(--mint)}
.add-card .lede{font-size:15px;color:var(--ink);margin:0 0 12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:#EEF5F0;border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{background:transparent;color:var(--ink);font-size:14px;font-weight:700;padding:9px 6px;min-height:42px;border-radius:11px;white-space:normal;line-height:1.15}
.seg button:hover{background:#fff}
.seg button.on{background:var(--ink);color:#fff}
.seg.one{grid-template-columns:1fr}
.late{display:inline-block;background:#eef1f4;color:#3b4a57;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;margin-left:6px}
.ro-note{background:#EEF1F4;border-radius:14px;padding:12px 14px;font-size:15px;margin-bottom:12px}
.filters{display:grid;gap:10px;grid-template-columns:1fr;margin:8px 0 14px}
@media(min-width:900px){.filters{grid-template-columns:2fr 1fr 1fr 1fr}}
.filters label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cust-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.cust-note{background:#EEF5F0;border-radius:14px;padding:12px 14px;font-size:14px;margin:10px 0}
.ok-yes{color:#1b7a46;font-weight:800}.ok-no{color:var(--muted)}
.tz-flag{font-size:13px;color:var(--amber-text);background:#fff6e0;border-radius:8px;padding:4px 9px;display:inline-block;margin-top:5px}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}
/* Screenshot mode (?shot=1, used by scripts/capture-portal.js): hides the demo-only bar and toasts. Normal use is unchanged. */
body.shot #demoBar,body.shot .toast{display:none !important}
.checkin-card{border:2px solid var(--mint)}
.checkin-card h3{margin:2px 0 0}
/* Coach page additions */
.demo-bar .btn-ghost{color:var(--ink)}
.qr{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;width:200px;height:200px}
.mfa-secret{display:inline-block;font-size:15px;letter-spacing:.08em;background:#eef6ef;border-radius:8px;padding:6px 10px;word-break:break-all;user-select:all}
.badge-health{background:#FEE4E2;color:#912018;border:1px solid #F4B2AB}
.badge-await{font-size:12px}
.client-time{color:var(--green)}
#confirmBox .btn-ghost{background:#fff}
.meal-row{border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px;background:#fff}
.plan-status{line-height:1.6}
.copy-days{border-top:1px solid var(--line);margin-top:10px;padding-top:4px}
</style>
</head>
<body>
<header class="demo-bar" id="coachBar"></header>
<main class="wrap" id="app"><p class="muted">Loading...</p></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/coaching-day-card.js"></script>
<script>
/* ==========================================================================
   Beast Coach: the coach's page (/coach). Real data, through supabase-js.
   Every read and write runs with the coach's own session. The database only lets it through when the user is in
   coaching_admins AND the session is MFA-verified (aal2), see is_coach(). No service role key is used here.
   ========================================================================== */
const SUPABASE_URL = "https://jgbcgbdbmqtsozwlllfj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3AdpZhYhif9JeP3rvmY2-Q_MuhFMGiw";
// No "remember me": the session is kept for this browser tab only (sessionStorage), and ends after
// IDLE_MINUTES without activity. Closing the tab signs you out.
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
});
const IDLE_MINUTES = 30;

/* ---------------------------------------------------------------- constants (the demo's) */
const MELB = 'Australia/Melbourne';
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAYS_FULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const WEEKS = 12, PAUSE_MAX = 14;
const PLAN_NAMES = { basic: 'Basic', essential: 'Essential', core: 'Core', beast: 'The Beast' };
const CAP_TIERS = ['essential', 'core', 'beast'];
const OPEN = ['awaiting_onboarding', 'awaiting_activation', 'active', 'paused'];
const STATUS = {
  awaiting_onboarding: ['Onboarding', 'p-onboarding'], awaiting_activation: ['Awaiting activation', 'p-awaiting'],
  active: ['Active', 'p-active'], paused: ['Paused', 'p-paused'], finished: ['Finished', 'p-finished'], cancelled: ['Cancelled', 'p-finished']
};
const NUT = ['calories','protein','carbs','fat','fibre'];
const NUT_LABEL = { calories:'Calories', protein:'Protein', carbs:'Carbs', fat:'Fat', fibre:'Fibre' };
const MACRO = {
  calories: { label:'Calories', unit:'kcal', bar:'#F59E0B', over:'#B45309', ink:'#92400E' },
  protein:  { label:'Protein',  unit:'g',    bar:'#2563EB', over:'#1E3A8A', ink:'#1D4ED8' },
  carbs:    { label:'Carbs',    unit:'g',    bar:'#7C3AED', over:'#4C1D95', ink:'#6D28D9' },
  fat:      { label:'Fat',      unit:'g',    bar:'#E11D48', over:'#9F1239', ink:'#BE123C' },
  fibre:    { label:'Fibre',    unit:'g',    bar:'#0891B2', over:'#155E75', ink:'#0E7490' }
};
const FOOD_GROUPS = {
  Proteins:['Chicken','Beef','Pork','Lamb','Fish','Tuna','Salmon','Prawns','Eggs','Tofu','Tempeh','Greek yoghurt','Cottage cheese','Protein powder'],
  Carbs:['Rice','Pasta','Potato','Sweet potato','Bread','Wraps','Oats','Noodles','Quinoa','Couscous'],
  Vegetables:['Broccoli','Spinach','Salad leaves','Capsicum','Carrots','Zucchini','Green beans','Mushrooms','Tomatoes','Cauliflower'],
  Fruit:['Banana','Apple','Berries','Orange','Grapes','Mango','Kiwi'],
  Snacks:['Nuts','Cheese','Popcorn','Rice cakes','Dark chocolate','Protein bars']
};
const WEIGH_TIMES = ['05:00','05:30','06:00','06:30','07:00','07:30','08:00','08:30','09:00','09:30','10:00','10:30','11:00'];
const CHECKIN_TYPES = ['Kick-off call', 'Check-in', 'Video call'];
const CHECKIN_SLOTS = (() => { const out = []; for (let h = 6; h <= 21; h++) out.push(pad(h) + ':00', pad(h) + ':30'); return out; })();
const SOURCES = { ai: 'Beast AI', plan: 'From plan', builder: 'Meal Builder', typed: 'Typed in' };
const CLIENT_COLS = 'id,user_id,email,name,tier,status,start_date,activated_at,end_date,time_zone,whatsapp,onboarding,targets,created_at,health_flag,health_cleared_at,health_cleared_by,paused_at,pause_days_used';

/* ---------------------------------------------------------------- small helpers */
function pad(n) { return String(n).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
function ymdIn(date, zone) { return new Intl.DateTimeFormat('en-CA', { timeZone: zone, year: 'numeric', month: '2-digit', day: '2-digit' }).format(date); }
function todayMel() { return ymdIn(new Date(), MELB); }
function pd(s) { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = pd(s); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function diffDays(a, b) { return Math.round((pd(b) - pd(a)) / 86400000); }
function fmtDate(s) { return s ? pd(s).toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : 'Not set'; }
function fmtTime(t) { const h = Number(t.slice(0, 2)), m = t.slice(3, 5); return ((h % 12) || 12) + ':' + m + (h < 12 ? 'am' : 'pm'); }
function fmtSteps(n) { return Number(n).toLocaleString('en-AU'); }
function money(cents) { return '$' + (Math.round(cents) / 100).toFixed(2).replace(/\.00$/, '') + ' AUD'; }
function clampNum(v, max) { const x = Math.round(parseFloat(v)); return isFinite(x) ? Math.max(0, Math.min(max, x)) : 0; }
function sumNut(list) { const t = { calories:0, protein:0, carbs:0, fat:0, fibre:0 }; list.forEach(m => NUT.forEach(k => { t[k] += Number(m[k]) || 0; })); return t; }
function validZone(z) { if (!z) return null; try { new Intl.DateTimeFormat('en-AU', { timeZone: z }); return z; } catch (e) { return null; } }
function zoneOf(c) { return validZone(c && c.time_zone) || MELB; }
function clientToday(c) { return ymdIn(new Date(), zoneOf(c)); }
function tzOffsetMin(date, zone) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: zone, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit' }).formatToParts(date).map(x => [x.type, x.value]));
  return (Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second) - date.getTime()) / 60000;
}
// A wall-clock date and time in a zone (here, Melbourne) as an instant.
function wallToInstant(dateStr, timeStr, zone) {
  const [y, m, d] = dateStr.split('-').map(Number), [hh, mm] = timeStr.split(':').map(Number);
  const guess = Date.UTC(y, m - 1, d, hh, mm);
  let inst = guess - tzOffsetMin(new Date(guess), zone) * 60000;
  inst = guess - tzOffsetMin(new Date(inst), zone) * 60000;
  return new Date(inst);
}
function fmtInZone(inst, zone) {
  return { date: inst.toLocaleDateString('en-AU', { timeZone: zone, weekday: 'short', day: 'numeric', month: 'short' }),
           time: inst.toLocaleTimeString('en-AU', { timeZone: zone, hour: 'numeric', minute: '2-digit' }).replace(/\s/g, '').toLowerCase(),
           ymd: ymdIn(inst, zone), hm: new Intl.DateTimeFormat('en-GB', { timeZone: zone, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(inst) };
}
function splitList(s) { return String(s || '').split(',').map(x => x.trim()).filter(Boolean); }
function chipList(items) { return items.length ? items.map(i => `<span class="need" style="background:#eef6ef;color:var(--ink)">${esc(i)}</span>`).join('') : '<span class="mini">None given</span>'; }
function statusPill(s) { const [label, cls] = STATUS[s] || [s, '']; return `<span class="pill ${cls}">${esc(label)}</span>`; }
function tone(kind, val, target) {
  if (!target) return '';
  const p = val / target;
  if (kind === 'fat') return p <= 1.05 ? 'g' : p <= 1.10 ? 'a' : 'r';
  if (kind === 'protein' || kind === 'fibre') return p >= 0.95 ? 'g' : p >= 0.90 ? 'a' : 'r';
  const dev = Math.abs(p - 1);
  return dev <= 0.05 ? 'g' : dev <= 0.10 ? 'a' : 'r';
}
const TONE_TEXT = { g:'c-green', a:'c-amber', r:'c-red', '':'' };
function macroChip(k) { return `<span class="mchip" style="--mc:${MACRO[k].bar}"><i></i>${MACRO[k].label}</span>`; }
function healthOpen(c) { return !!c.health_flag && !c.health_cleared_at; }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => el.classList.remove('show'), 3800);
}
function friendly(err) {
  const msg = String((err && (err.message || err.msg)) || '');
  const code = err && err.code;
  if (code === 'P0001' && msg) return msg;
  if (code === '42501' || /row-level security|permission denied/i.test(msg)) return 'Not allowed. Sign out, then sign in again with your authenticator code.';
  if (code === '23505' || /duplicate key/i.test(msg)) return 'That already exists.';
  if (code === '23514' || /violates check constraint/i.test(msg)) return 'That value is not allowed.';
  if (code === 'coach_limit' || code === 'coach_only' || code === 'busy' || code === 'try_again') return msg;
  return 'Something went wrong. Please try again.';
}
async function q(promise) { const { data, error } = await promise; if (error) throw error; return data; }

/* ==========================================================================
   Sign in, then MFA
   ========================================================================== */
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session || !session.user) { C.screen = 'signin'; return render(); }
  C.user = session.user;
  await afterPassword();
}
async function afterPassword() {
  const { data: st, error } = await sb.rpc('coach_status');
  if (error || !st || !st.admin) { C.screen = 'notcoach'; return render(); }
  const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aal && aal.currentLevel === 'aal2') return enterApp();
  const { data: f } = await sb.auth.mfa.listFactors();
  const verified = ((f && f.totp) || []).filter(x => x.status === 'verified');
  if (verified.length) {
    C.factors = verified; C.factorId = verified[0].id; C.codeError = '';
    C.screen = 'challenge'; return render();
  }
  await startEnrol(false);
}
// Enrol a TOTP authenticator. Leftover unfinished enrolments are removed first (Supabase keeps them).
async function startEnrol(backup) {
  const { data: f } = await sb.auth.mfa.listFactors();
  const stale = ((f && f.all) || []).filter(x => x.factor_type === 'totp' && x.status !== 'verified');
  for (const x of stale) await sb.auth.mfa.unenroll({ factorId: x.id });
  const name = (backup ? 'Backup authenticator ' : 'Authenticator ') + new Date().toISOString().slice(0, 16).replace('T', ' ');
  const { data, error } = await sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: name });
  if (error || !data) { toast(friendly(error)); if (!backup) { C.screen = 'signin'; C.signinError = 'Could not start the authenticator set-up. Please try again.'; render(); } return; }
  const qr = String(data.totp.qr_code || '');
  const enrol = { factorId: data.id, qr: qr.startsWith('data:') ? qr : 'data:image/svg+xml;utf-8,' + encodeURIComponent(qr), secret: data.totp.secret };
  if (backup) { C.backup = enrol; C.codeError = ''; render(); return; }
  C.enrol = enrol; C.codeError = ''; C.screen = 'enrol'; render();
}
async function signIn() {
  const email = document.getElementById('si-email').value.trim();
  const password = document.getElementById('si-pass').value;
  if (!email || !password) { C.signinError = 'Enter your email and password.'; return render(); }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error || !data || !data.user) { C.signinError = 'That email and password did not match.'; return render(); }
  C.signinError = ''; C.user = data.user;
  await afterPassword();
}
async function submitCode(mode) {
  const box = document.getElementById('mfa-code');
  const code = String(box ? box.value : '').replace(/\s/g, '');
  if (!/^\d{6}$/.test(code)) { C.codeError = 'Enter the 6-digit code from your authenticator app.'; return render(); }
  if (mode === 'challenge') {
    const sel = document.getElementById('mfa-factor');
    const factorId = sel ? sel.value : C.factorId;
    const { data: ch, error: e1 } = await sb.auth.mfa.challenge({ factorId });
    if (e1 || !ch) { C.codeError = 'Could not check the code. Please try again.'; return render(); }
    const { error: e2 } = await sb.auth.mfa.verify({ factorId, challengeId: ch.id, code });
    if (e2) { C.codeError = 'That code did not work. Check the time on your phone and try the newest code.'; return render(); }
    C.codeError = '';
    return enterApp();
  }
  const target = mode === 'backup' ? C.backup : C.enrol;
  const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: target.factorId, code });
  if (error) { C.codeError = 'That code did not work. Check the time on your phone and try the newest code.'; return render(); }
  C.codeError = '';
  if (mode === 'backup') { C.backup = null; await loadFactors(); toast('Backup authenticator added.'); return render(); }
  C.enrol = null;
  toast('Authenticator set up. Add a backup authenticator in Settings.');
  return enterApp();
}
async function signOut(reason) {
  try { await flushSave(); } catch (e) { /* the draft is kept; sign-out continues */ }
  try { await sb.auth.signOut(); } catch (e) { /* signed out locally anyway */ }
  try { sessionStorage.clear(); } catch (e) {}
  Object.assign(C, { screen: 'signin', user: null, enrol: null, backup: null, d: null, clients: [], customers: [], page: 'clients', clientId: null, confirm: null,
    signinError: reason || '' });
  render();
}
// Signed out after IDLE_MINUTES with no clicks, keys or touches.
let lastActive = Date.now();
['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { lastActive = Date.now(); }, { passive: true }));
setInterval(() => {
  if (C.user && Date.now() - lastActive > IDLE_MINUTES * 60000) signOut(`Signed out after ${IDLE_MINUTES} minutes without activity.`);
}, 30000);

async function loadAll() {
  C.clients = (await q(sb.from('coaching_clients').select(CLIENT_COLS).order('created_at', { ascending: false }))) || [];
  C.capacity = (await q(sb.from('coaching_capacity').select('tier,place_limit'))) || [];

  const plans = (await q(sb.from('coaching_plans').select('client_id,version,is_current,plan,created_at').eq('is_current', true))) || [];
  C.currentPlans = {}; plans.forEach(p => { C.currentPlans[p.client_id] = p; });
  const since = addDays(todayMel(), -30);
  const logs = (await q(sb.from('coaching_meal_logs').select('client_id,log_date').gte('log_date', since).order('log_date', { ascending: false }))) || [];
  C.lastLog = {}; logs.forEach(l => { if (!C.lastLog[l.client_id] || l.log_date > C.lastLog[l.client_id]) C.lastLog[l.client_id] = l.log_date; });
  const st = (await q(sb.from('coaching_settings').select('coach_whatsapp').limit(1))) || [];

  await loadFactors();
}
async function loadFactors() {
  const { data: f } = await sb.auth.mfa.listFactors();
  C.factors = ((f && f.totp) || []).filter(x => x.status === 'verified');
}
function clientById(id) { return C.clients.find(c => String(c.id) === String(id)) || null; }
async function loadDetail(id) {
  const c = clientById(id);
  const d = { meals: [], workouts: [], steps: [], weighIns: [], checkins: [], note: '', plans: [] };
  if (c && c.tier !== 'basic') {
    d.meals = (await q(sb.from('coaching_meal_logs').select('id,client_id,log_date,meal_time,name,calories,protein,carbs,fat,fibre,source,edited,ai,added_late,entry_text').eq('client_id', id).order('logged_at', { ascending: true }))) || [];
    d.workouts = (await q(sb.from('coaching_workout_logs').select('id,client_id,log_date,kind,what,minutes,notes,session,added_late').eq('client_id', id))) || [];
    d.steps = (await q(sb.from('coaching_step_logs').select('client_id,log_date,steps,added_late').eq('client_id', id))) || [];
    d.weighIns = (await q(sb.from('coaching_weigh_ins').select('client_id,weigh_date,kg').eq('client_id', id).order('weigh_date', { ascending: true }))) || [];
    d.checkins = (await q(sb.from('coaching_checkins').select('id,client_id,type,scheduled_at,status').eq('client_id', id).order('scheduled_at', { ascending: true }))) || [];
    const n = (await q(sb.from('coaching_notes').select('client_id,body').eq('client_id', id))) || [];
    d.note = n[0] ? n[0].body : '';
      d.plans = (await q(sb.from('coaching_plans').select('client_id,version,is_current,plan,created_at').eq('client_id', id).order('version', { ascending: false }))) || [];
    const dr = (await q(sb.from('coaching_plan_drafts').select('client_id,draft').eq('client_id', id))) || [];
    d.draft = dr[0] ? dr[0].draft : null;
  }
  C.d = d;
  // The draft is the coach's work in progress. It is read from the database only when this client is first opened
  // in this session, so a save that is still in flight is never overwritten by an older read.
  if (C.drFor !== String(id)) {
    C.dr = d.draft && Object.keys(d.draft).length ? normDraft(d.draft) : draftFromPlan(publishedPlan(c || { id }));
    C.drFor = String(id); C.saveState = null;
  }
}

   Derived values (the demo's rules, on real rows)
   ========================================================================== */
function placesTaken(tier) { return C.clients.filter(c => c.tier === tier && OPEN.includes(c.status)).length; }
function placeLimit(tier) { const r = C.capacity.find(x => x.tier === tier); return r ? r.place_limit : 0; }
function hasPlanMeals(plan) { return !!plan && !!plan.meals && Object.values(plan.meals).some(a => Array.isArray(a) && a.length); }
function weekOf(c) {
  if (!c.activated_at || !c.start_date) return 0;
  const e = diffDays(c.start_date, clientToday(c)) - (c.pause_days_used || 0);
  if (e < 0) return 0;
  return Math.min(WEEKS, Math.floor(e / 7) + 1);
}
function weekLabel(c) {
  if (c.status === 'finished') return WEEKS + ' of ' + WEEKS;
  if (!c.activated_at || c.status === 'awaiting_onboarding' || c.status === 'awaiting_activation') return '-';
  return weekOf(c) + ' of ' + WEEKS;
}
function relDay(s) {
  if (!s) return 'Never';
  const n = diffDays(s, todayMel());
  if (n === 0) return 'Today';
  if (n === 1) return 'Yesterday';
  if (n < 0) return fmtDate(s);
  return n + ' days ago';
}
function pauseDaysNow(c) {
  const live = c.status === 'paused' && c.paused_at ? Math.max(0, diffDays(ymdIn(new Date(c.paused_at), MELB), todayMel())) : 0;
  return Math.min(PAUSE_MAX, (c.pause_days_used || 0) + live);
}
function activationMissing(c) {
  const m = [];
  const plan = C.currentPlans[c.id] && C.currentPlans[c.id].plan;
  if (!c.targets) m.push('Daily targets are not set');
  if (!hasPlanMeals(plan)) m.push('Meal plan is not published');
  if (!plan || !plan.training) m.push('Training plan is not published');
  if (healthOpen(c)) m.push('Health flag: tick "Cleared to start"');
  return m;
}
function needsYou(c) {
  const n = [];
  const plan = C.currentPlans[c.id] && C.currentPlans[c.id].plan;
  if (healthOpen(c) && OPEN.includes(c.status)) n.push('Health check');
  if (c.status === 'awaiting_activation' && !hasPlanMeals(plan)) n.push('Build plan');
  if (c.status === 'awaiting_activation' && hasPlanMeals(plan) && plan.training) n.push('Book call, activate');
  if (c.status === 'active' && c.tier !== 'basic') {
    const last = C.lastLog[c.id];
    if (!last || diffDays(last, todayMel()) >= 3) n.push('No logs 3+ days');
  }
  return n;
}
function paidFor(c) {
  const rows = C.customers.filter(x => String(x.email).toLowerCase() === String(c.email).toLowerCase() && x.tier === c.tier);
  return rows[0] || null;
}
function custStatus(email) {
  const rows = C.clients.filter(c => String(c.email).toLowerCase() === String(email).toLowerCase());
  if (!rows.length) return 'none';
  const open = rows.find(c => OPEN.includes(c.status));
  return (open || rows[0]).status;

function custOk(email) {

        <tbody id="clientRows">${rows || '<tr><td colspan="6">No clients yet.</td></tr>'}</tbody></table></div></div>`;

// Protein powder, as the client answered it. Clients who answered before the question existed show "Not asked".

  const ob = c.onboarding || {};
  if (ob.proteinPowder === 'yes') return 'Yes' + (ob.proteinBrand ? ': ' + ob.proteinBrand : ' (no brand given)');

function healthAnswers(c) {

  if (h.heart === 'yes') out.push('heart condition or high blood pressure');
  if (h.chest === 'yes') out.push('chest pain, dizziness or fainting during exercise');
  if (h.other === 'yes') out.push('another condition or medication' + (ob.healthNote ? ': ' + ob.healthNote : ''));

/* ---------------------------------------------------------------- check-ins */
function checkinTypesFor(tier) { return tier === 'essential' ? ['Kick-off call'] : tier === 'basic' ? [] : CHECKIN_TYPES; }
function checkinsHtml(c) {
  const types = checkinTypesFor(c.tier);
  const now = Date.now();
  const zone = zoneOf(c);
  const list = C.d.checkins.slice().sort((a, b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));
  const live = list.filter(x => x.status !== 'cancelled');
  const editing = list.find(x => x.id === C.ciEditId) || null;
  const blocked = c.tier === 'essential' && live.length >= 1 && !editing;
  const label = x => x.status === 'cancelled' ? 'Cancelled' : new Date(x.scheduled_at).getTime() >= now ? 'Upcoming' : 'Past';
  const rows = list.length ? list.map(x => {
    const inst = new Date(x.scheduled_at);
    const mel = fmtInZone(inst, MELB), mine = fmtInZone(inst, zone);
    const differs = zone !== MELB && (mel.date !== mine.date || mel.time !== mine.time);
    return `<div class="meal" data-checkin="${esc(x.id)}"><div style="flex:1 1 220px"><b>${esc(x.type)}</b> <span class="mini">${esc(label(x))}</span>
      <div>${esc(mel.date)}, ${esc(mel.time)} <span class="mini">Melbourne time</span></div>
      ${differs ? `<div class="mini client-time">Client: ${esc(mine.date)}, ${esc(mine.time)} (${esc(zone)})</div>` : ''}</div>
      ${x.status === 'cancelled' ? '' : `<div class="acts"><button class="btn-ghost btn-sm" data-act="editCheckin" data-id="${esc(x.id)}">Edit</button>
        <button class="btn-danger btn-sm" data-act="askCancelCheckin" data-id="${esc(x.id)}">Cancel</button></div>`}</div>`;
  }).join('') : '<p class="muted">No check-ins scheduled yet.</p>';
  const em = editing ? fmtInZone(new Date(editing.scheduled_at), MELB) : null;
  const defDate = em ? em.ymd : addDays(todayMel(), 1);
  const defTime = em ? em.hm : '18:30';
  const defType = editing ? editing.type : types[0];
  const conf = C.confirm ? `<div class="hl-amber" id="confirmBox" role="alertdialog" style="margin:12px 0"><p style="margin:0 0 10px"><b>${esc(C.confirm.text)}</b></p>
      <div class="row" style="justify-content:flex-start"><button class="btn-danger" data-act="confirmYes">${esc(C.confirm.yes)}</button><button class="btn-ghost" data-act="confirmNo">Not now</button></div></div>` : '';
  const preview = zone !== MELB ? `<p class="mini" id="ciPreview" style="margin:8px 0 0">${esc(previewText(defDate, defTime, zone))}</p>` : '';
  const form = blocked
    ? '<div class="note-box">Essential includes one kick-off call. Edit it or cancel it to change the time.</div>'
    : `<div class="grid2">
        <div class="field" style="margin:0"><label for="ci-date">Date</label><input id="ci-date" type="date" value="${esc(defDate)}" data-ch="ciPreview"></div>
        <div class="field" style="margin:0"><label for="ci-time">Time (Melbourne time)</label>
          <select id="ci-time" data-ch="ciPreview">${CHECKIN_SLOTS.concat(CHECKIN_SLOTS.includes(defTime) ? [] : [defTime]).map(t => `<option value="${t}" ${t === defTime ? 'selected' : ''}>${esc(fmtTime(t))}</option>`).join('')}</select></div></div>
      ${preview}
      <div class="field" style="margin:12px 0 0"><label for="ci-type">Type</label>
        <select id="ci-type">${types.map(t => `<option ${t === defType ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>
      <div class="row" style="justify-content:flex-start;margin-top:12px">
        <button data-act="saveCheckin">${editing ? 'Save changes' : 'Schedule check-in'}</button>
        ${editing ? '<button class="btn-ghost" data-act="stopEditCheckin">Stop editing</button>' : ''}</div>`;
  const plan = c.tier === 'essential' ? 'Essential: one kick-off call at the start.'
    : 'Check-ins and calls happen on WhatsApp, outside the portal. The client sees the next one on Today.';
  return `<div class="card"><h3>Schedule check-in</h3>
      <p class="mini" style="margin-top:0">${esc(plan)} Times are entered in Melbourne time (Australia/Melbourne). The client sees it in their own time zone (${esc(zone)}).</p>${form}</div>
    <div class="card"><h3>Check-ins</h3><p class="mini" style="margin-top:0">Upcoming and past, in date order. Cancelled ones stay here, not on the client's Today.</p>${conf}${rows}</div>`;
}
function previewText(date, time, zone) {
  const inst = wallToInstant(date, time, MELB);
  const mine = fmtInZone(inst, zone);
  return `For the client that is ${mine.date}, ${mine.time} (${zone}).`;
}

/* ---------------------------------------------------------------- plan inputs and plan editor */
/* Plan drafts. The coach edits a DRAFT (coaching_plan_drafts, coach-only). The client sees only what is published.
   Each meal row is its own row, with its own Calculate button. Nothing is shared between rows. */
function emptyRow(n) { return { label: 'Meal ' + n, text: '', calories: 0, protein: 0, carbs: 0, fat: 0, fibre: 0 }; }
function emptyDraft() { const meals = {}; for (let d = 1; d <= 7; d++) meals[d] = []; return { meals, training: '' }; }
function normDraft(dr) {
  const out = emptyDraft();
  out.training = String((dr && dr.training) || '').slice(0, 5000);
  for (let d = 1; d <= 7; d++) {
    const list = (dr && dr.meals && (dr.meals[d] || dr.meals[String(d)])) || [];
    out.meals[d] = list.map(m => ({ label: String(m.label || 'Meal').slice(0, 40), text: String(m.text || m.name || '').slice(0, 300),
      calories: clampNum(m.calories, 5000), protein: clampNum(m.protein, 500), carbs: clampNum(m.carbs, 800), fat: clampNum(m.fat, 400), fibre: clampNum(m.fibre, 200) }));
  }
  return out;
}
// The published plan, read back into draft shape.
function draftFromPlan(plan) {
  const dr = emptyDraft();
  if (plan && plan.meals) for (let d = 1; d <= 7; d++) dr.meals[d] = (plan.meals[d] || plan.meals[String(d)] || []).map(m => ({ label: m.label || 'Meal', text: m.text || m.name || '', calories: m.calories || 0, protein: m.protein || 0, carbs: m.carbs || 0, fat: m.fat || 0, fibre: m.fibre || 0 }));
  dr.training = (plan && plan.training) || '';
  return normDraft(dr);
}
// The plan JSON the client portal reads: { meals: { 1..7: [ {label, name, text, calories, protein, carbs, fat, fibre} ] }, training }
function planFromDraft(dr) {
  const meals = {};
  const norm = normDraft(dr);
  for (let d = 1; d <= 7; d++) meals[d] = norm.meals[d].map(m => ({ label: m.label, name: m.text.slice(0, 80), text: m.text,
    calories: m.calories, protein: m.protein, carbs: m.carbs, fat: m.fat, fibre: m.fibre }));
  return { meals, training: String((dr && dr.training) || '') };
}
function publishedPlan(c) { const cur = C.currentPlans[c.id]; return cur ? cur.plan : null; }
function planChanged(c) {
  return JSON.stringify(planFromDraft(C.dr)) !== JSON.stringify(planFromDraft(draftFromPlan(publishedPlan(c))));
}
function planStatusHtml(c) {
  const cur = C.currentPlans[c.id];
  const diff = planChanged(c);
  const saved = C.saveState === 'saving' ? '<span class="mini">Saving...</span>'
    : C.saveState === 'saved' ? '<span class="mini">Draft saved</span>'
    : C.saveState === 'error' ? '<span class="c-red">Draft not saved. Check your connection, then keep editing.</span>' : '';
  const pub = diff ? '<b class="c-amber">Unpublished changes</b>'
    : cur ? `<b class="c-green">Published</b> <span class="mini">version ${cur.version}, ${esc(fmtDate(ymdIn(new Date(cur.created_at), MELB)))}</span>`
    : '<span class="mini">Nothing published yet</span>';
  return `<div id="planStatus" class="plan-status">${pub}${saved ? ' · ' + saved : ''}</div>`;
}
function updatePlanStatus() {
  const el = document.getElementById('planStatus');
  const c = clientById(C.clientId);
  if (el && c) el.outerHTML = planStatusHtml(c);
}

/* ---------------------------------------------------------------- logs (from activation) */
function bestSet(e) {
  if (!e || e.skipped || !e.sets || !e.sets.length) return null;
  const weighted = e.sets.filter(s => s.kg != null);
  if (!weighted.length) { const reps = Math.max(...e.sets.map(s => s.reps || 0)); return reps > 0 ? { kg: null, reps } : null; }
  const kg = Math.max(...weighted.map(s => s.kg));
  return { kg, reps: Math.max(...weighted.filter(s => s.kg === kg).map(s => s.reps || 0)) };
}
function progressNote(w, e) {
  const cur = bestSet(e); if (!cur) return null;
  const prior = C.d.workouts.filter(x => x.session && x.log_date < w.log_date).sort((a, b) => (a.log_date < b.log_date ? 1 : -1));
  let prev = null;
  for (const x of prior) { const b = bestSet((x.session.exercises || []).find(y => y.name === e.name && !y.skipped)); if (b) { prev = b; break; } }
  if (!prev) return null;
  if (cur.kg != null && prev.kg != null) {
    if (cur.kg > prev.kg) return '+' + (Math.round((cur.kg - prev.kg) * 10) / 10) + ' kg';
    if (cur.kg === prev.kg && cur.reps > prev.reps) return '+' + (cur.reps - prev.reps) + ' reps';
    return null;
  }
  if (cur.kg == null && prev.kg == null && cur.reps > prev.reps) return '+' + (cur.reps - prev.reps) + ' reps';
  return null;
}
function sessionHtml(w) {
  const rows = (w.session.exercises || []).map(e => {
    if (e.skipped) return `<div class="log-ex"><b>${esc(e.name)}</b> <span class="mini">skipped</span></div>`;
    const sets = (e.sets || []).map(s => (s.kg != null ? (Math.round(s.kg * 10) / 10) + ' kg x ' : '') + (s.reps != null ? s.reps : '-'));
    const note = progressNote(w, e);
    return `<div class="log-ex"><b>${esc(e.name)}</b> ${note ? `<span class="up-badge">Up ${esc(note)}</span>` : ''}<div class="mini">${esc(sets.join(', ') || 'no sets')}</div></div>`;
  }).join('');
  return `<div style="margin:6px 0 10px"><div><b>${esc(w.what)}</b></div>${rows}${w.notes ? `<div class="mini">${esc(w.notes)}</div>` : ''}</div>`;
}
// The plan's training sessions, as the client portal reads them (the same parse as my-coach.html).
function planSessionsOf(p) {
  if (!p || typeof p.training !== 'string') return [];
  const out = []; let cur = null;
  const days = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 };
  p.training.split('\n').forEach(raw => {
    const line = raw.trim(); if (!line) return;
    const head = /^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\w*\s*[:\-]\s*(.+)$/i.exec(line);
    if (head) { cur = { day: days[head[1][0].toUpperCase() + head[1].slice(1, 3).toLowerCase()], title: head[2].trim(), exercises: [] }; out.push(cur); return; }
    const ex = /^[-•*]\s*(.+?)\s+(\d+)\s*[x×]\s*(\d+)/i.exec(line);
    if (ex && cur) cur.exercises.push({ name: ex[1], sets: Number(ex[2]), reps: Number(ex[3]) });
  });
  return out;
}
// What the plan said for each exercise on this date: { "Bench press": "3 × 10" }.
function plannedOn(plan, date) {
  const out = {}, dow = ((pd(date).getDay() + 6) % 7) + 1;
  planSessionsOf(plan).filter(s => s.day === dow).forEach(s => s.exercises.forEach(e => { out[e.name] = e.sets + ' × ' + e.reps; }));
  return out;
}
// Logs, newest first, grouped by week. The last 7 days are open; older days are collapsed to header and summary.
function logsHtml(c) {
  const start = c.activated_at ? ymdIn(new Date(c.activated_at), zoneOf(c)) : null;
  const today = clientToday(c);
  const plan = (C.currentPlans[c.id] || {}).plan || null;
  const days = [];
  if (start) for (let d = today; d >= start && days.length < 120; d = addDays(d, -1)) days.push(d);
  const weekOf = d => Math.min(WEEKS, Math.floor(diffDays(start, d) / 7) + 1);
  const dayData = d => {
    const st = C.d.steps.find(x => x.log_date === d), wi = C.d.weighIns.find(x => x.weigh_date === d);
    return { date: d, meals: C.d.meals.filter(m => m.log_date === d), workouts: C.d.workouts.filter(w => w.log_date === d),
      steps: st ? Number(st.steps) : null, weigh: wi ? Number(wi.kg) : null };
  };
  const groups = [];
  days.forEach((d, i) => {
    const w = weekOf(d);
    let g = groups.find(x => x.week === w);
    if (!g) { g = { week: w, items: [] }; groups.push(g); }
    g.items.push({ d, i });
  });
  const targets = c.targets || {};
  const body = groups.map(g => {
    const avg = DayCard.weekAverages(g.items.map(x => dayData(x.d)));
    return DayCard.weekHeading('Week ' + g.week + ' of ' + WEEKS, avg) +
      g.items.map(x => DayCard.render(dayData(x.d), { today, targets, open: x.i < 7, planned: plannedOn(plan, x.d) })).join('');
  }).join('');
  const before = C.d.meals.filter(m => !start || m.log_date < start);
  const baseline = before.length ? `<details class="baseline"><summary>Logged before activation (baseline) <span class="mini" style="font-weight:400">${before.length} meal${before.length === 1 ? '' : 's'}, not part of the plan</span></summary>
      <div style="padding:4px 0 6px">${before.map(m => `<div class="meal" style="padding:8px 0"><div style="flex:1 1 200px"><span class="mini">${esc(fmtDate(m.log_date))}</span> <b>${esc(m.name)}</b>
        <div class="mini">${m.calories} kcal · P ${m.protein}g · C ${m.carbs}g · F ${m.fat}g · Fibre ${m.fibre}g</div></div></div>`).join('')}</div></details>` : '';
  const intro = start
    ? `<p class="mini" style="margin-top:0">From activation on ${esc(fmtDate(start))}, newest first, in the client's own days (${esc(zoneOf(c))}). The last 7 days are open; tap a day to open it.</p>`
    : '<p class="mini" style="margin-top:0">Not activated yet. Logs start on the activation date.</p>';
  return `<section id="logsCard" style="max-width:760px" aria-label="${start ? 'Logs' : 'Logs before activation'}"><h3 style="margin:0 0 6px">${start ? 'Logs' : 'Logs before activation'}</h3>${intro}
    ${body || '<p class="muted">Nothing logged yet.</p>'}${baseline}</section>`;
}
function progressHtml(c) {
  const ob = c.onboarding || {};
  const pts = [];
  if (ob.weightKg != null && ob.weightKg !== '') pts.push({ date: ymdIn(new Date(c.created_at), MELB), kg: Number(ob.weightKg) });
  C.d.weighIns.forEach(w => pts.push({ date: w.weigh_date, kg: Number(w.kg) }));
  let stats = '<p class="muted">No weigh-ins yet.</p>';
  if (pts.length) {
    const first = pts[0].kg, last = pts[pts.length - 1].kg, prev = pts.length > 1 ? pts[pts.length - 2].kg : null, ch = last - first;
    stats = `<div class="grid3"><div class="note-box"><div class="mini">Latest weight</div><b>${last.toFixed(1)} kg</b></div>
      <div class="note-box"><div class="mini">Change since start</div><b class="${ch <= 0 ? 'c-green' : 'c-red'}">${ch.toFixed(1)} kg (${(first ? ch / first * 100 : 0).toFixed(1)}%)</b></div>
      <div class="note-box"><div class="mini">Change since last weigh-in</div><b>${prev == null ? 'n/a' : (last - prev).toFixed(1) + ' kg'}</b></div></div>
      <div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Date</th><th>Weight</th></tr></thead><tbody>${pts.slice().reverse().map(p => `<tr><td>${esc(fmtDate(p.date))}</td><td>${p.kg.toFixed(1)} kg</td></tr>`).join('')}</tbody></table></div>`;
  }
  const start = c.activated_at ? ymdIn(new Date(c.activated_at), zoneOf(c)) : null;
  const week = []; const today = clientToday(c);
  for (let i = 0; i < 7; i++) { const d = addDays(today, -i); if (start && d >= start) week.push(d); }
  const stepVals = C.d.steps.filter(s => week.includes(s.log_date)).map(s => Number(s.steps));
  const avgSteps = stepVals.length ? Math.round(stepVals.reduce((a, b) => a + b, 0) / stepVals.length) : null;
  const byDay = week.map(d => C.d.meals.filter(m => m.log_date === d)).filter(l => l.length);
  const avg = k => byDay.length ? Math.round(byDay.reduce((a, l) => a + sumNut(l)[k], 0) / byDay.length) : null;
  return `<div class="card"><h3>Weight</h3>${stats}</div>
    <div class="card"><h3>Last 7 days</h3>
      <p>Steps, average per day: <b>${avgSteps == null ? 'Nothing logged' : fmtSteps(avgSteps)}</b>${c.targets && c.targets.steps ? ` (target ${fmtSteps(c.targets.steps)})` : ''}</p>
      ${byDay.length ? NUT.map(k => `<p class="mini" style="margin:4px 0">${NUT_LABEL[k]}: <b>${avg(k)}</b>${c.targets && c.targets[k] != null ? ' of ' + c.targets[k] : ''} ${k === 'calories' ? 'kcal' : 'g'}</p>`).join('') : '<p class="muted">No meals logged in the last 7 days.</p>'}
    </div>`;
}

function customersByEmail() {
  const map = new Map();
  C.customers.forEach(x => {
    const k = String(x.email).toLowerCase();
    if (!map.has(k)) map.set(k, { email: x.email, name: x.name, country: x.country, purchases: [] });
    map.get(k).purchases.push(x);
  });
  return [...map.values()];
}

  const people = customersByEmail().sort((a, b) => String(a.name || a.email).localeCompare(String(b.name || b.email)));
  const sel = (opts, cur) => opts.map(([v, l]) => `<option value="${esc(v)}" ${cur === v ? 'selected' : ''}>${esc(l)}</option>`).join('');
  const rows = people.map(x => {
    const ok = custOk(x.email);
    const said = x.purchases.some(p => p.marketing_consent), unsub = x.purchases.find(p => p.unsubscribed_at);

function custRowMatch(row) {
  const f = C.custFilter;
  return (!f.q || row.dataset.search.includes(f.q.toLowerCase().trim())) && (!f.product || row.dataset.products.split(' ').includes(f.product))
    && (!f.status || row.dataset.status === f.status) && (!f.ok || row.dataset.ok === f.ok);
}
function applyCustFilters() {
  let shown = 0;
  document.querySelectorAll('[data-cust-row]').forEach(row => { const on = custRowMatch(row); row.hidden = !on; if (on) shown++; });
  const el = document.getElementById('custCount'); if (el) el.textContent = `${shown} shown`;
}
// The marketing list from the database, narrowed by the search and plan filters on screen.
async function marketingList() {
  const rows = (await q(sb.rpc('coach_marketing_export'))) || [];
  const f = C.custFilter;
  return rows.filter(r => (!f.q || (String(r.name || '') + ' ' + r.email).toLowerCase().includes(f.q.toLowerCase().trim()))
    && (!f.product || customersByEmail().some(x => x.email.toLowerCase() === String(r.email).toLowerCase() && x.purchases.some(p => p.tier === f.product))));
}
function csvCell(v) {
  let s = String(v == null ? '' : v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;                 // never let a spreadsheet run a cell as a formula
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

// The draft saves in the database as you type, and is flushed before a client switch, a sign-out or when the tab is hidden.
let pendingSave = null, saveTimer = null, saveQueue = Promise.resolve();
function scheduleSave(c) {
  pendingSave = { client_id: Number(c.id), draft: JSON.parse(JSON.stringify(C.dr)), updated_at: new Date().toISOString() };
  C.saveState = 'saving';
  clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, 600);
  updatePlanStatus();
}
function flushSave() {
  clearTimeout(saveTimer);
  const job = pendingSave;
  if (!job) return saveQueue;
  pendingSave = null;
  saveQueue = saveQueue.then(async () => {
    try { await q(sb.from('coaching_plan_drafts').upsert(job, { onConflict: 'client_id' })); C.saveState = 'saved'; }
    catch (err) { C.saveState = 'error'; toast(friendly(err)); }
    if (C.clientId && String(job.client_id) === String(C.clientId)) updatePlanStatus();
  });
  return saveQueue;
}
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });
// One Beast AI estimate for a list of meal lines. The server reads the client's protein answer itself.
async function aiDay(lines, clientId) {
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch('/api/coach-ai', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (session ? session.access_token : '') },
    body: JSON.stringify({ mode: 'day', text: lines.join('\n').slice(0, 2000), clientId: Number(clientId) }) });
  let data = {}; try { data = await r.json(); } catch (e) {}
  if (!r.ok || data.error) { const err = new Error(data.message || 'Beast AI could not answer that. Type the numbers in yourself.'); err.code = data.error || 'try_again'; throw err; }
  if (!Array.isArray(data.meals) || data.meals.length !== lines.length) throw Object.assign(new Error('Beast AI returned a different number of meals. Check the numbers by hand.'), { code: 'try_again' });
  return data.meals;
}

ACT.calcRow = async el => {
  const c = clientById(C.clientId);
  const i = Number(el.dataset.i), d = C.planDay;
  const row = C.dr.meals[d][i];
  if (!row) return;
  const foods = String(row.text || '').trim();
  if (!foods) { toast('Type the foods with amounts first.'); return; }
  toast('Calculating this meal...');
  try {
    const [m] = await aiDay([`${row.label}: ${foods}`], c.id);
    const target = C.dr.meals[d][i];
    if (!target) return;
    Object.assign(target, { calories: clampNum(m.calories, 5000), protein: clampNum(m.protein, 500), carbs: clampNum(m.carbs, 800), fat: clampNum(m.fat, 400), fibre: clampNum(m.fibre, 200) });
    scheduleSave(c); render(); toast('Numbers calculated for this meal. Check them before you publish.');
  } catch (err) {
    toast(friendly(err) || 'Beast AI could not answer. Type the numbers in yourself.');
  }
};

ACT.exportCsv = async () => {
  const list = await marketingList();
  if (!list.length) { toast('No customers are OK to email with these filters.'); return; }
  const lines = list.map(x => [x.email, x.name, PLAN_NAMES[x.plan] || x.plan, x.purchased_on].map(csvCell).join(','));
  const blob = new Blob([['email,name,plan,date', ...lines].join('\n') + '\n'], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `beast-coach-marketing-${todayMel()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`Exported ${list.length} customer${list.length === 1 ? '' : 's'} who are OK to email.`);
};
ACT.askUnsub = el => {
  const email = el.dataset.email;
  C.confirm = { text: `Unsubscribe ${email} from marketing emails? Only they can turn it back on, from My Coach.`, yes: 'Yes, unsubscribe', run: async () => {
    const ids = C.customers.filter(x => String(x.email).toLowerCase() === String(email).toLowerCase()).map(x => x.id);
    await q(sb.from('coaching_customers').update({ marketing_consent: false, unsubscribed_at: new Date().toISOString() }).in('id', ids));
    await loadAll(); toast('Unsubscribed.'); } };
  render();
};

/* settings */
ACT.saveWhatsapp = async () => {
  const v = document.getElementById('waNumber').value.trim();
  if (v && !/^\+?[0-9 ]{6,20}$/.test(v)) { toast('Enter the number with digits only, for example +61 400 000 000.'); return; }
  await q(sb.from('coaching_settings').upsert({ id: true, coach_whatsapp: v || null, updated_at: new Date().toISOString() }, { onConflict: 'id' }));
  C.settings = { coach_whatsapp: v }; render(); toast('WhatsApp number saved.');
};
ACT.addBackup = () => startEnrol(true);
ACT.askRemoveFactor = el => {
  const id = el.dataset.id;
  C.confirm = { text: 'Remove this authenticator? It will no longer give you codes for this page.', yes: 'Yes, remove it', run: async () => {
    const { error } = await sb.auth.mfa.unenroll({ factorId: id }); if (error) throw error; await loadFactors(); toast('Authenticator removed.'); } };
  render();
};

/* ---------------------------------------------------------------- events */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  try { await ACT[el.dataset.act](el, e); } catch (err) { toast(friendly(err)); }
});
document.addEventListener('change', async e => {
  const el = e.target.closest('[data-ch]');
  if (!el) return;
  try { await CH[el.dataset.ch](el, e); } catch (err) { toast(friendly(err)); render(); }
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-inp]');
  if (!el) return;
  try { INP[el.dataset.inp](el, e); } catch (err) { toast(friendly(err)); }
});
document.addEventListener('submit', async e => {
  const form = e.target;
  if (form.id === 'signinForm') { e.preventDefault(); try { await signIn(); } catch (err) { C.signinError = friendly(err); render(); } }
  if (form.id === 'codeForm') { e.preventDefault(); try { await submitCode(form.dataset.mode); } catch (err) { C.codeError = friendly(err); render(); } }
});
boot().catch(err => { C.screen = 'signin'; C.signinError = friendly(err); render(); });
</script>
</body>
