<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Coach | Beast Coach</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B3022;--green:#2D6A4F;--mint:#52B788;--bg:#F4F7F2;--amber:#F59E0B;--amber-hover:#FFB62E;--muted:#3B4F43;--line:#D5E0D8;--red:#b42318;--amber-text:#8a5300}
*{box-sizing:border-box}
body{margin:0;font-family:'Manrope',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
h1,h2,h3,h4{font-family:'Bebas Neue','Arial Narrow',Impact,sans-serif;font-weight:400;letter-spacing:.02em;margin:0;color:var(--ink)}
h1{font-size:clamp(44px,12vw,72px);line-height:.95}h3{font-size:28px;line-height:1.05}h4{font-size:22px}
p{margin:0 0 10px}
a{color:var(--green)}a:hover{color:var(--ink)}
:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.wrap{max-width:620px;margin:0 auto;padding:14px 16px 56px}
.muted{color:var(--muted);font-size:14px}
.mini{font-size:14px;color:var(--muted)}
.eyebrow{font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:22px 20px;margin-bottom:14px}
.hero h1{color:#fff;font-size:clamp(40px,10vw,60px)}.hero .muted{color:#D5E6DB}.hero .eyebrow{color:#8FD3B0}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.card h3{margin-bottom:10px}
.note-box{background:#EEF5F0;border-radius:14px;padding:12px 14px;font-size:15px;margin-bottom:10px}
.hl-amber{background:#fff6e0;border-left:4px solid var(--amber);padding:9px 12px;border-radius:10px;margin-bottom:10px}
.hl-red{background:#fdecea;border-left:4px solid var(--red);padding:9px 12px;border-radius:10px;margin-bottom:10px}
.banner{background:#FFF6E0;border:2px solid var(--amber);color:#4a2c00;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:700}
select,input,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid #C5D3C8;border-radius:12px;padding:10px 12px;width:100%;max-width:100%}
textarea{min-height:84px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;margin:0;accent-color:var(--green)}
label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.field{margin-bottom:12px}
.grid2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.grid3{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
@media(max-width:420px){.grid2,.grid3{grid-template-columns:1fr}}
.err{color:var(--red);font-size:13px;margin-top:4px;min-height:0}
.err:empty{display:none}
.invalid{border-color:var(--red)!important;box-shadow:0 0 0 2px #fbd4cf}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid #C5D3C8;border-radius:999px;padding:7px 12px;background:#fff;cursor:pointer;font-size:14px;font-weight:600;margin:0}
.chip:has(input:checked){background:#d8f3e3;border-color:var(--mint)}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin:0 0 10px;cursor:pointer}
.check input{margin-top:4px}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}
button,.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:13px 18px;min-height:48px;cursor:pointer;background:var(--amber);color:#1B1200;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
button:hover{background:var(--amber-hover)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:var(--ink);color:#fff}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid #C5D3C8}.btn-ghost:hover{background:#F4F7F2}
.btn-danger{background:#fff;color:var(--red);border:1px solid #f0c4c0}.btn-danger:hover{background:#fdecea}
.btn-sm{padding:7px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn-block{width:100%}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack>*+*{margin-top:10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:#fff;color:var(--ink);border:1px solid #C5D3C8;padding:9px 14px;border-radius:999px;min-height:40px;font-size:15px}
.tab:hover{background:#F4F7F2}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#EEF5F0;border-radius:14px;padding:4px;margin-bottom:12px}
.seg.one{grid-template-columns:1fr}
.seg button{background:transparent;color:var(--ink);font-size:14px;font-weight:700;padding:9px 6px;min-height:42px;border-radius:11px;white-space:normal;line-height:1.15}
.seg button:hover{background:#fff}
.seg button.on{background:var(--ink);color:#fff}
.add-card{border:2px solid var(--mint)}
.lede{font-size:15px;margin:0 0 12px}
.meal{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start;flex-wrap:wrap}
.meal:last-child{border-bottom:0}
.kcal{font-family:'Bebas Neue',Impact,sans-serif;font-size:26px;line-height:1;white-space:nowrap}
.bar{height:10px;background:#E3EBE4;border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--mint)}
.metric{margin-bottom:12px}
.metric .top{display:flex;justify-content:space-between;gap:8px;font-size:15px;margin-bottom:5px;flex-wrap:wrap}
.c-green{color:#1b7a46}.c-red{color:var(--red)}.c-amber{color:var(--amber-text)}
.late{display:inline-block;background:#eef1f4;color:#3b4a57;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;margin-left:6px}
.checkin-card{border:2px solid var(--mint)}
.wo-set{display:grid;grid-template-columns:40px 1fr 1fr auto;gap:8px;align-items:center;margin-top:6px}
.wo-set input{padding:8px 10px}
.wo-head{font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.pill{display:inline-block;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;background:#d8f3e3;color:#1b5e3a}
.pill.grey{background:#eef1f4;color:#3b4a57}
.pill.amber{background:#fff3d6;color:#8a5a00}
.ro-note{background:#EEF1F4;border-radius:14px;padding:12px 14px;font-size:15px;margin-bottom:12px}
.target-row{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.target-row:last-child{border-bottom:0}
.target-val{font-family:'Bebas Neue',Impact,sans-serif;font-size:36px;line-height:1;white-space:nowrap}
.target-val small{font-size:16px}
.tz-flag{font-size:13px;color:var(--amber-text);background:#fff6e0;border-radius:8px;padding:4px 9px}
.sheet-back{position:fixed;inset:0;background:rgba(15,28,20,.55);z-index:95}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px 20px 28px;z-index:96}
@media(min-width:700px){.sheet{left:50%;transform:translateX(-50%);width:560px;bottom:24px;border-radius:22px}}
.sheet h4{margin:16px 0 6px}
.sheet p,.sheet li{font-size:16px}
.sheet ol,.sheet ul{padding-left:22px;margin:0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 18px;border-radius:14px;z-index:99;display:none;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{display:block}
.ob-msg{color:var(--red);font-weight:700;margin:4px 0 12px}
.ob-msg:empty{display:none}
.ob-nav{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:6px 0 18px}
@media(max-width:699px){.ob-nav{flex-direction:column-reverse}.ob-nav button{width:100%}}
.progress{height:10px;background:#E3EBE4;border-radius:99px;overflow:hidden;margin-top:12px}
.progress span{display:block;height:100%;background:var(--amber);border-radius:99px}
.chart{width:100%;height:auto;display:block;margin:8px 0}
.top-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.logo{font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;letter-spacing:.1em;color:var(--ink);text-decoration:none}
.logo span{color:var(--mint)}
.tz-btn{display:block;width:100%;text-align:left;min-height:48px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;color:var(--ink,#1B3022);cursor:pointer}
.tz-panel{margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
.tz-panel input[type=search]{width:100%;min-height:44px;font-size:16px;box-sizing:border-box}
.tz-results{max-height:50vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:8px}
.tz-group{font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:14px 0 4px;color:#4c6354}
.tz-opt{display:block;width:100%;text-align:left;min-height:44px;padding:10px 8px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:inherit;cursor:pointer}
</style>
</head>

/* Validation for the current onboarding step, with the same messages as the demo. */
function obErrors(d, step, tier) {
  const e = {}, n = v => parseFloat(v);
  if (tier === 'basic') {
    if (!(n(d.age) >= 18 && n(d.age) <= 100)) e.age = n(d.age) > 0 && n(d.age) < 18 ? 'Coaching is for adults 18 and over.' : 'Enter your age (18 to 100).';
    if (!['Male', 'Female'].includes(d.sex)) e.sex = OB_CHOOSE;
    if (d.heightUnit === 'ftin') { if (!(n(d.heightFt) >= 3 && n(d.heightFt) <= 8 && n(d.heightIn) >= 0 && n(d.heightIn) <= 11)) e.heightCm = 'Enter your height: feet (3 to 8) and inches (0 to 11).'; }
    else if (!(n(d.heightCm) >= 100 && n(d.heightCm) <= 250)) e.heightCm = 'Enter your height in cm (100 to 250).';
    if (!(n(d.weight) > 0)) e.weight = 'Enter your current weight.';
    if (!BASIC_GOALS.some(([v]) => v === d.goalKind)) e.goalKind = OB_CHOOSE;
    if (!BASIC_JOBS.some(([v]) => v === d.jobMult)) e.jobMult = OB_CHOOSE;
    Object.assign(e, stepsErrs(d));
    if (!(n(d.trainingSessions) >= 0 && n(d.trainingSessions) <= 14) || d.trainingSessions === '') e.trainingSessions = 'Enter how many sessions a week (0 if none).';
    if (!BASIC_INTENSITY.some(([v]) => v === d.trainingIntensity)) e.trainingIntensity = OB_CHOOSE;
    if (!PROTEIN_CHOICES.some(([v]) => v === d.proteinPowder)) e.proteinPowder = 'Choose yes, no, or open to it.';
    if (!validZone(d.tzIana)) e.timezone = 'Choose your time zone or city.';
    if (!d.agreeNotCoach) e.agreeNotCoach = 'Please confirm you understand this is general guidance.';
    if (!d.agreeTerms) e.agreeTerms = 'Please agree to the terms and billing.';
    return e;
  }
  if (step === 1) {
    if (!(n(d.age) >= 18 && n(d.age) <= 100)) e.age = n(d.age) > 0 && n(d.age) < 18 ? 'Coaching is for adults 18 and over.' : 'Enter your age (18 to 100).';
    if (d.heightUnit === 'ftin') { if (!(n(d.heightFt) >= 3 && n(d.heightFt) <= 8 && n(d.heightIn) >= 0 && n(d.heightIn) <= 11)) e.heightCm = 'Enter your height: feet (3 to 8) and inches (0 to 11).'; }
    else if (!(n(d.heightCm) >= 100 && n(d.heightCm) <= 250)) e.heightCm = 'Enter your height in cm (100 to 250).';
    if (!(n(d.weight) > 0)) e.weight = 'Enter your current weight.';
    if (String(d.whatsapp || '').replace(/\D/g, '').length < 6) e.whatsapp = 'Enter a WhatsApp number so Stefan can reach you.';
    if (!validZone(d.tzIana)) e.timezone = 'Choose your time zone or city.';
  }
  if (step === 2) {
    if (!String(d.goal || '').trim()) e.goal = 'Tell us what you want to achieve.';
    if (!TIMEFRAMES.includes(d.timeframe)) e.timeframe = OB_CHOOSE;
    Object.assign(e, stepsErrs(d));
  }
  if (step === 3) {
    const liked = (d.likedFoods || []).length + String(d.likedOther || '').split(',').map(x => x.trim()).filter(Boolean).length;
    if (liked < 3) e.likedFoods = 'Tick at least 3 foods you like.';
    if (!PROTEIN_CHOICES.some(([v]) => v === d.proteinPowder)) e.proteinPowder = 'Choose yes, no, or open to it.';
  }
  if (step === 4) {
    if (!DIETS.includes(d.diet)) e.diet = 'Choose one. Pick No restrictions if none applies.';
    if (!MEALS_PER_DAY.includes(d.mealsPerDay)) e.mealsPerDay = OB_CHOOSE;
    if (!COOK_TIMES.includes(d.cookTime)) e.cookTime = OB_CHOOSE;
    if (!WHO_COOKS.includes(d.whoCooks)) e.whoCooks = OB_CHOOSE;
  }
  if (step === 5) {
    if (!(d.trainingDays || []).length) e.trainingDays = 'Tick at least one training day.';
    if (!TIME_OF_DAY.includes(d.timeOfDay)) e.timeOfDay = OB_CHOOSE;
    if (!SESSIONS.includes(d.sessionLength)) e.sessionLength = OB_CHOOSE;
    if (!PLACES.includes(d.place)) e.place = OB_CHOOSE;
    if (!EXPERIENCE.includes(d.experience)) e.experience = OB_CHOOSE;
  }
  if (step === 6) {
    const h = d.health || {};
    if (!['heart', 'chest', 'other'].every(k => h[k] === 'yes' || h[k] === 'no')) e.health = 'Answer all three health questions.';
    if (['heart', 'chest', 'other'].some(k => h[k] === 'yes') && !d.healthClearance) e.healthClearance = 'Tick this to confirm your doctor has cleared you.';
    if (!DAYS.includes(d.weighInDay)) e.weighInDay = OB_CHOOSE;
    if (!d.agreeTerms) e.agreeTerms = 'Please agree to the terms.';
    if (!d.agreeNotCoach) e.agreeNotCoach = 'Please confirm you understand this is coaching, not medical advice.';
    if (!d.agreeConsent) e.agreeConsent = 'Please agree so Stefan can see your logs.';
  }
  return e;
}
function stepsErrs(d) {
  const e = {}, every = parseFloat(d.stepsEveryday), real = parseFloat(d.stepsRealistic);
  if (!(every >= 0 && every <= 60000)) e.stepsEveryday = 'Enter a number from 0 to 60,000. An estimate is fine.';
  if (!(real >= 3000 && real <= 20000)) e.stepsRealistic = 'Enter a target from 3,000 to 20,000.';
  return e;
}
function fmtTimeP(t) { const [h, m] = t.split(':').map(Number); return ((h + 11) % 12 + 1) + ':' + pad(m) + (h < 12 ? 'am' : 'pm'); }
function showErrors(errs) {
  document.querySelectorAll('#onboardForm .err').forEach(el => { el.textContent = ''; });
  document.querySelectorAll('#onboardForm .invalid').forEach(el => el.classList.remove('invalid'));
  Object.keys(errs).forEach(k => {
    const box = document.getElementById('err-' + k);
    if (box) box.textContent = errs[k];
    document.querySelectorAll(`[data-f="${k}"]`).forEach(el => { if (el.type !== 'radio') el.classList.add('invalid'); });
  });
  const firstBad = document.querySelector('#onboardForm .invalid'); if (firstBad) firstBad.scrollIntoView({ block: 'center' });
  const msg = document.getElementById('obMsg');
  if (msg) msg.textContent = Object.keys(errs).length ? 'Please answer the questions marked in red.' : '';
}

/* Answers as the database expects them (the same keys as the demo's onboarding answers). */
function answersFrom(d, tier) {
  const heightCm = d.heightUnit === 'ftin' ? (parseFloat(d.heightFt) * 12 + parseFloat(d.heightIn)) * 2.54 : parseFloat(d.heightCm);
  const weightKg = d.weightUnit === 'kg' ? parseFloat(d.weight) : parseFloat(d.weight) / 2.20462;
  const base = { timezone: String(d.timezone || '').trim(), timeZoneIana: validZone(d.tzIana) || MELB, age: parseFloat(d.age), sex: d.sex, heightCm: Math.round(heightCm * 10) / 10,
    weightKg: Math.round(weightKg * 10) / 10, stepsEveryday: parseFloat(d.stepsEveryday), stepsRealistic: parseFloat(d.stepsRealistic),
    weighInDay: d.weighInDay || 'Mon', weighInTime: d.weighInTime || '07:00', agreeTerms: !!d.agreeTerms, agreeNotCoach: !!d.agreeNotCoach,
    proteinPowder: d.proteinPowder || '', proteinBrand: d.proteinPowder === 'yes' ? String(d.proteinBrand || '').trim().slice(0, 80) : '' };
  if (tier === 'basic') {
    return Object.assign(base, { goalKind: d.goalKind, jobMult: d.jobMult, trainingSessions: parseFloat(d.trainingSessions), trainingIntensity: d.trainingIntensity, whatsapp: d.whatsapp || '' });
  }
  return Object.assign(base, {
    whatsapp: d.whatsapp || '', goal: d.goal, timeframe: d.timeframe, goalWhy: d.goalWhy || '', job: d.job || '', activity: d.activity || '',
    likedFoods: d.likedFoods || [], likedOther: d.likedOther || '', avoid: d.avoid || '', allergies: d.allergies || '',
    diet: d.diet, mealsPerDay: d.mealsPerDay, cookTime: d.cookTime, whoCooks: d.whoCooks, eatsOut: d.eatsOut || '0', alcohol: d.alcohol || '0',
    typicalDay: d.typicalDay || '', trainingDays: d.trainingDays || [], timeOfDay: d.timeOfDay, sessionLength: d.sessionLength, place: d.place,
    equipment: d.equipment || [], experience: d.experience, enjoys: d.enjoys || '', hates: d.hates || '', injuries: d.injuries || '',
    worked: d.worked || '', didnt: d.didnt || '', health: d.health || {}, healthNote: d.healthNote || '', healthClearance: !!d.healthClearance,
    agreeConsent: !!d.agreeConsent
  });
}

function weekStartOf(day) { const d = pd(day); const iso = (d.getDay() + 6) % 7; d.setDate(d.getDate() - iso); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

/* Plans: the coach's plan is stored as JSON: { meals: { 1..7: [ {label,name,text,calories,protein,carbs,fat,fibre} ] }, training: "Mon: Full body A\n- Squat 3x8" } */
function planSessions(p) {
  if (!p || !p.plan || typeof p.plan.training !== 'string') return [];
  const out = []; let cur = null;
  const days = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 };
  p.plan.training.split('\n').forEach(raw => {
    const line = raw.trim(); if (!line) return;
    const head = /^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\w*\s*[:\-]\s*(.+)$/i.exec(line);
    if (head) { cur = { day: days[head[1][0].toUpperCase() + head[1].slice(1, 3).toLowerCase()], title: head[2].trim(), exercises: [] }; out.push(cur); return; }
    const ex = /^[-•*]\s*(.+?)\s+(\d+)\s*[x×]\s*(\d+)/i.exec(line);
    if (ex && cur) cur.exercises.push({ name: ex[1], sets: Number(ex[2]), reps: Number(ex[3]), planned: ex[2] + 'x' + ex[3] });
  });
  return out;
}

/* Progress: the demo's Progress tab on real data. Each plan is its own block. The current plan has the 7-day views. */
const STEPS_COLOUR = '#2FA36B';
const MACRO_OVER = { calories: '#B45309', protein: '#1E3A8A', carbs: '#4C1D95', fat: '#9F1239', fibre: '#155E75' };
function unitVal(kg) { return S.unit === 'lb' ? kg * 2.20462 : kg; }
function fmtSteps(n) { return Number(n).toLocaleString('en-AU'); }
function fmtShortDate(s) { return pd(s).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }); }
function sumNut(list) { const t = { calories: 0, protein: 0, carbs: 0, fat: 0, fibre: 0 }; list.forEach(m => NUT.forEach(k => { t[k] += Number(m[k]) || 0; })); return t; }
// One nutrient line, as the demo draws it: "x of y, z left" or "over".
function nutRow(k, val, target) {
  const over = !!target && val > target;
  const unit = k === 'calories' ? 'kcal' : 'g';
  const pct = target ? Math.min(100, Math.round(val / target * 100)) : 0;
  const status = !target ? `${val} ${unit}` : over ? `${val} of ${target} ${unit}, <b>${val - target} ${unit} over</b>` : `${val} of ${target} ${unit}, ${target - val} ${unit} left`;
  return `<div class="metric"><div class="top"><span><b style="color:${MACRO_BAR[k]}">${NUT_LABEL[k]}</b></span><span style="color:${over ? MACRO_OVER[k] : 'inherit'}">${status}</span></div>
    ${target ? `<div class="bar"><span style="width:${pct}%;background:${over ? MACRO_OVER[k] : MACRO_BAR[k]}"></span></div>` : ''}</div>`;
}
function isCurrentRow(r) { return !!(S.cur && r.id === S.cur.id); }
// Days counted for a plan: the current plan's last 7 days (from activation), or the whole of an earlier plan.
function progressDays(r, current) {
  const start = activatedDay(r) || r.start_date || null;
  if (!start) return [];
  const today = clientToday(r);
  const out = [];
  if (current) { for (let i = 0; i < 7; i++) { const d = addDays(today, -i); if (d >= start) out.push(d); } return out; }
  const end = r.end_date && r.end_date < today ? r.end_date : today;
  for (let d = start; d <= end && out.length < 400; d = addDays(d, 1)) out.push(d);
  return out;
}
// Starting weight (from onboarding) first, then the weekly weigh-ins, oldest first.
function weighPointsFor(r) {
  const pts = [];
  const startKg = r.onboarding && r.onboarding.weightKg;
  if (startKg != null && startKg !== '') pts.push({ date: r.created_at ? ymdIn(new Date(r.created_at), zoneFor(r)) : (r.start_date || ''), kg: Number(startKg) });
  S.weighIns.filter(w => w.client_id === r.id).sort((a, b) => a.weigh_date.localeCompare(b.weigh_date))
    .forEach(w => pts.push({ date: w.weigh_date, kg: Number(w.kg) }));
  return pts;
}
function weighTrend(pts) {
  if (pts.length < 2) return '<p class="muted">Add a second weigh-in to see the trend line.</p>';
  const W = 320, H = 150, P = 22;
  const vals = pts.map(p => unitVal(p.kg));
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const xy = vals.map((v, i) => [P + i * (W - 2 * P) / (vals.length - 1), H - P - (v - min) / span * (H - 2 * P)]);
  const path = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const dots = xy.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="#2D6A4F"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weigh-in trend">
    <line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" stroke="#e2e9e0"/>
    <path d="${path}" fill="none" stroke="#52B788" stroke-width="3" stroke-linejoin="round"/>${dots}
    <text x="${P}" y="${H - 4}" font-size="11" fill="#5b6b60">${esc(fmtShortDate(pts[0].date))}</text>
    <text x="${W - P}" y="${H - 4}" font-size="11" fill="#5b6b60" text-anchor="end">${esc(fmtShortDate(pts[pts.length - 1].date))}</text>
    <text x="${P}" y="12" font-size="11" fill="#5b6b60">High ${max.toFixed(1)} ${S.unit}</text>
    <text x="${W - P}" y="12" font-size="11" fill="#5b6b60" text-anchor="end">Low ${min.toFixed(1)} ${S.unit}</text></svg>`;
}
function weightCardHtml(pts) {

function progressBlock(r, current) {

// Past days, newest first, from activation. The last 7 days are open. The same day card as the coach sees.
function pastDaysHtml() {
  const r = S.cur;
  const start = r ? activatedDay(r) : null;
  if (!r || !start) return '';
  const today = clientToday(r);
  const plan = S.plans[r.id] || null;
  const days = [];
  for (let d = today; d >= start && days.length < 120; d = addDays(d, -1)) days.push(d);
  const weekOf = d => Math.min(12, Math.floor(diffDays(start, d) / 7) + 1);
  const dayData = d => {
    const st = S.steps.find(x => x.client_id === r.id && x.log_date === d), wi = S.weighIns.find(x => x.client_id === r.id && x.weigh_date === d);
    return { date: d, meals: S.mealsAll.filter(x => x.client_id === r.id && x.log_date === d), workouts: S.workoutsAll.filter(x => x.client_id === r.id && x.log_date === d),
      steps: st ? Number(st.steps) : null, weigh: wi ? Number(wi.kg) : null };
  };
  const planned = d => { const out = {}; const dow = dowNum(d); planSessions(plan).filter(x => x.day === dow).forEach(x => x.exercises.forEach(e => { out[e.name] = e.sets + ' × ' + e.reps; })); return out; };
  const groups = [];
  days.forEach((d, i) => {
    const w = weekOf(d);
    let g = groups.find(x => x.week === w);
    if (!g) { g = { week: w, items: [] }; groups.push(g); }
    g.items.push({ d, i });
  });

    const avg = DayCard.weekAverages(g.items.map(x => dayData(x.d)));
    return DayCard.weekHeading('Week ' + g.week + ' of 12', avg) +
      g.items.map(x => DayCard.render(dayData(x.d), { today, targets: r.targets || {}, open: x.i < 7, planned: planned(x.d) })).join('');
  }).join('');

    <p class="mini" style="margin-top:0">From your activation, newest first, in your own days. The last 7 days are open; tap a day to open it.</p>${body || '<p class="muted">Nothing logged yet.</p>'}</section>`;
}

/* ==========================================================================
   Beast AI (through the server only): /api/coach-ai with the signed-in user's token
   ========================================================================== */
async function callAi(body) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error('sign_in');
  const r = await fetch('/api/coach-ai', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
    body: JSON.stringify(body)
  });
  let data = {};
  try { data = await r.json(); } catch (e) { data = {}; }
  if (!r.ok || data.error) {
    const err = new Error(data.message || 'Beast AI could not answer that. Please try again, or enter the numbers yourself.');
    err.code = data.error;
    throw err;
  }
  return data;
}

function resizePhoto(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1024, scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({ type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.8).split(',')[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That photo could not be read. Try another.')); };
    img.src = url;
  });
}

/* "How to do it": the library first, then Beast AI for anything not in it. */
function keyOf(x) { return String(x || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(Boolean).map(w => (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) ? w.slice(0, -1) : w).join(' '); }
function findLibrary(name) {
  const k = keyOf(name);
  return EXERCISES.find(x => keyOf(x.n) === k || (x.a || []).some(a => keyOf(a) === k)) || null;
}
function sheetHtml(title, inner) {
  return `<div class="sheet-back" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="row" style="align-items:flex-start"><div><div class="eyebrow">How to do it</div><h3>${esc(title)}</h3></div><button class="btn-ghost btn-sm" data-act="closeSheet">Close</button></div>${inner}</div>`;
}
function guideHtml(d, name) {
  const list = (arr, tag) => (arr && arr.length) ? `<${tag}>${arr.map(x => `<li>${esc(x)}</li>`).join('')}</${tag}>` : '<p class="mini">Not listed.</p>';
  const title = name || d.n || d.name || '';
  return `<h4>What it works</h4><p>${esc(d.w || d.works || 'Not listed.')}</p>
    <h4>Step by step</h4>${list(d.s || d.steps, 'ol')}
    <h4>Form tips</h4>${list(d.t || d.tips, 'ul')}
    <h4>Common mistakes</h4>${list(d.m || d.mistakes, 'ul')}
    <h4>Easier version</h4><p>${esc(d.e || d.easier || 'Not listed.')}</p>
    <p style="margin-top:18px"><a class="btn btn-ghost" href="https://www.youtube.com/results?search_query=${encodeURIComponent(title + ' how to do it')}" target="_blank" rel="noopener">Watch a video</a></p>`;
}
async function openExercise(name) {
  const lib = findLibrary(name);
  if (lib) { document.getElementById('sheetRoot').innerHTML = sheetHtml(lib.n, guideHtml(lib, lib.n)); return; }
  document.getElementById('sheetRoot').innerHTML = sheetHtml(name, '<p class="muted">Writing the guide…</p>');
  try {
    const g = await callAi({ mode: 'exercise', name });
    document.getElementById('sheetRoot').innerHTML = sheetHtml(g.name || name, '<div class="note-box mini" style="margin-bottom:10px">Written by Beast AI. Check it against what Stefan has told you.</div>' + guideHtml(g, g.name || name));
  } catch (err) {
    const where = S.cur && S.cur.tier === 'beast' ? 'Ask Stefan on WhatsApp.' : 'Ask Stefan at your next check-in.';
    document.getElementById('sheetRoot').innerHTML = sheetHtml(name, `<p>${esc(friendly(err))}</p><p class="muted">No guide for this one yet. ${where}</p>`);
  }
}

  try {
    await sb.rpc('claim_coaching');
  } catch (e) { /* the claim is also done on the dashboard; a failure here is not fatal */ }
  try {
    await loadAll();
  } catch (err) {
    document.getElementById('app').innerHTML = `<div class="card"><p>${esc(friendly(err))}</p></div>`;
    return;
  }
  await loadMarketing();
  await loadCoachWhatsapp();
  S.day = clientToday(S.cur);
  await loadDay();
  render();
}
boot();
</script>
