<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coaching demo | Beast Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B3022;--green:#2D6A4F;--mint:#52B788;--bg:#F4F7F2;--amber:#F59E0B;--amber-hover:#FFB62E;--muted:#3B4F43;--line:#D5E0D8;--red:#b42318;--amber-text:#8a5300}
*{box-sizing:border-box}
body{margin:0;font-family:'Manrope',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
h1,h2,h3,.disp{font-family:'Bebas Neue','Arial Narrow',Impact,sans-serif;font-weight:400;letter-spacing:.02em;margin:0;color:var(--ink)}
h1{font-size:clamp(48px,7vw,80px);line-height:.95}h2{font-size:clamp(36px,5vw,52px);line-height:1}h3{font-size:30px;line-height:1.05}
p{margin:0 0 10px}
a{color:var(--green)}a:hover{color:var(--ink)}
:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:18px 20px}
.muted{color:var(--muted);font-size:14px}
.eyebrow{font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
.card h3{margin-bottom:12px}
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:26px 24px;margin-bottom:16px}
.hero h1{color:#fff}.hero .muted{color:#D5E6DB}
.hero .eyebrow{color:#8FD3B0}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}
.grid3{display:grid;gap:14px;grid-template-columns:1fr}
.grid5{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}.grid5{grid-template-columns:repeat(5,1fr)}}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack>*+*{margin-top:10px}
.hidden,[hidden]{display:none !important}
/* demo bar */
.demo-bar{background:var(--ink);color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
@media(min-width:900px){.demo-bar{position:sticky;top:0;z-index:50}}
.logo{font-family:'Bebas Neue',Impact,sans-serif;font-size:24px;letter-spacing:.1em;color:#fff}
.logo span{color:var(--mint)}
.tag{background:var(--amber);color:#1B1200;font-weight:800;border-radius:6px;padding:3px 9px;font-size:12px;letter-spacing:1px}
.demo-bar select{width:auto;min-width:230px;max-width:100%}
.demo-bar .note{font-size:13px;color:#D5E6DB;flex:1 1 260px}
.ai{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px}
.ai.on{background:#d8f3e3;color:#1b5e3a}.ai.off{background:#fde7c2;color:#7a4a00}
/* form controls */
select,input,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid #C5D3C8;border-radius:12px;padding:10px 12px;width:100%;max-width:100%}
select option{color:var(--ink);background:#fff}
textarea{min-height:92px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;margin:0;accent-color:var(--green)}
label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.field{margin-bottom:12px}
.field.inline label{display:inline}
.err{color:var(--red);font-size:13px;margin-top:4px;min-height:0}
.err:empty{display:none}
.invalid{border-color:var(--red)!important;box-shadow:0 0 0 2px #fbd4cf}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid #C5D3C8;border-radius:999px;padding:7px 13px;background:#fff;cursor:pointer;font-size:14px;font-weight:600;margin:0}
.chip:has(input:checked){background:#d8f3e3;border-color:var(--mint)}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin:0 0 10px;cursor:pointer}
.check input{margin-top:4px}
.hl-red{background:#fdecea;border-left:4px solid var(--red);padding:9px 12px;border-radius:10px}
.hl-amber{background:#fff6e0;border-left:4px solid var(--amber);padding:9px 12px;border-radius:10px}
.note-box{background:#EEF5F0;border-radius:14px;padding:12px 14px;font-size:15px}
/* buttons: amber is the primary action, as on the sales page */
button,.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:13px 20px;min-height:48px;cursor:pointer;background:var(--amber);color:#1B1200;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
button:hover{background:var(--amber-hover)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:var(--ink);color:#fff}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid #C5D3C8}.btn-ghost:hover{background:#F4F7F2}
.btn-danger{background:#fff;color:var(--red);border:1px solid #f0c4c0}.btn-danger:hover{background:#fdecea}
.btn-sm{padding:7px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn-link{background:none;color:var(--green);padding:0;min-height:0;text-decoration:underline;font-weight:800}.btn-link:hover{background:none;color:var(--ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{background:#fff;color:var(--ink);border:1px solid #C5D3C8;padding:9px 16px;border-radius:999px;min-height:40px}
.tab:hover{background:#F4F7F2}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill{display:inline-block;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;white-space:nowrap}
.p-onboarding{background:#eef1f4;color:#3b4a57}.p-awaiting{background:#fff3d6;color:#8a5a00}.p-active{background:#d8f3e3;color:#1b5e3a}.p-paused{background:#e6ecff;color:#2c3e9a}.p-finished{background:#ececec;color:#444}.p-selflog{background:#f3e8ff;color:#6b2ca8}
.need{display:inline-block;background:#fde7c2;color:#7a4a00;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:800;margin:2px 4px 2px 0}
.bar{height:10px;background:#E3EBE4;border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--mint)}
.bar>span.g{background:#2fa36b}.bar>span.a{background:var(--amber)}.bar>span.r{background:var(--red)}
.c-green{color:#1b7a46}.c-amber{color:var(--amber-text)}.c-red{color:var(--red)}
.metric{margin-bottom:14px}
.metric .top{display:flex;justify-content:space-between;gap:8px;font-size:15px;margin-bottom:5px;flex-wrap:wrap}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td input,td select{padding:7px 9px;font-size:14px}
td.num input{width:76px}
.meal{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start;flex-wrap:wrap}
.meal:last-child{border-bottom:0}
.meal .kcal{font-family:'Bebas Neue',Impact,sans-serif;font-size:28px;line-height:1;white-space:nowrap}
.meal .acts{display:flex;gap:6px}
.meal-edit{display:grid;gap:8px;grid-template-columns:repeat(2,1fr);width:100%}
.meal-edit .wide{grid-column:1/-1}
@media(min-width:700px){.meal-edit{grid-template-columns:repeat(6,1fr)}.meal-edit .wide{grid-column:span 2}}
.mini{font-size:14px;color:var(--muted)}
.edited{font-size:13px;color:var(--amber-text);background:#fff6e0;border-radius:8px;padding:4px 9px;display:inline-block;margin-top:5px}
.dl{display:grid;grid-template-columns:1fr;gap:2px 14px}
.dl dt{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:10px}
.dl dd{margin:0 0 4px;font-size:15px}
@media(min-width:700px){.dl{grid-template-columns:200px 1fr}.dl dt{margin-top:9px}}
.cap-nums{display:flex;gap:24px;margin:6px 0 14px}
.cap-nums b{font-family:'Bebas Neue',Impact,sans-serif;font-size:44px;line-height:1;display:block}
.cap-nums span{font-size:14px;color:var(--muted)}
.plans{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.plans{grid-template-columns:repeat(3,1fr)}}
.plan-card{display:flex;flex-direction:column;gap:8px}
.price{font-family:'Bebas Neue',Impact,sans-serif;font-size:52px;line-height:1}
.chart{width:100%;height:auto;display:block;margin:10px 0}
details{margin-bottom:10px}
summary{cursor:pointer;font-weight:800;padding:8px 0;list-style:none}
summary::-webkit-details-marker{display:none}
.day-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.day-row button{padding:8px 13px;border-radius:999px;font-size:14px;min-height:38px}
.day-row button.on{background:var(--ink);color:#fff}
.day-row button.dot::after{content:" \2022";color:var(--mint)}
.pre{white-space:pre-wrap;font-family:inherit;margin:0;font-size:15px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 18px;border-radius:14px;z-index:99;display:none;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{display:block}
.status-line{font-weight:700;font-size:17px;color:#fff}
.fine{font-size:13px;color:var(--muted)}
.list-clean{margin:6px 0 0;padding-left:18px}
.sr{position:absolute;left:-9999px}
.plan-inputs{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
.pi-grid{display:grid;gap:18px 26px;grid-template-columns:1fr;margin-top:14px}
@media(min-width:760px){.pi-grid{grid-template-columns:repeat(3,1fr)}}
.pi-sec h4{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:22px;margin:0 0 8px;letter-spacing:.02em}
.pi-sec p{margin:0 0 6px;font-size:15px}
.pi-tag{display:inline-block;background:#E8F3EC;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;margin:0 6px 6px 0}
.pi-tag.day{background:#d8f3e3}
@media(max-width:899px){h3{font-size:26px}}
</style>
</head>
<body>
<header class="demo-bar" id="demoBar"></header>
<main class="wrap" id="app"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* ==========================================================================
   Constants
   ========================================================================== */
const DB_KEY = 'bc_demo_v1';
const UI_KEY = 'bc_demo_ui';
const DEMO_KEY_NAME = 'bc_demo_key';
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAYS_FULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const WEEKS = 12;
const PAUSE_MAX = 14;
const CAP_TIERS = ['core','beast'];
const TIERS = {
  essential: { name:'Essential', price:110, short:'$110 one-off', recur:false,
    desc:'A plan built from your onboarding answers, delivered once. Meals, training and a check-in.' },
  core: { name:'Core', price:299, short:'$299 for 12 weeks', recur:true,
    desc:'12 weeks of coaching with your meal and training plans, weekly weigh-ins and check-ins.' },
  beast: { name:'The Beast', price:699, short:'$699 for 12 weeks', recur:true,
    desc:'12 weeks of close, hands-on coaching in our smallest group. Our most supported option.' }
};
const STATUS = {
  onboarding:['Onboarding','p-onboarding'], awaiting:['Awaiting activation','p-awaiting'],
  active:['Active','p-active'], paused:['Paused','p-paused'],
  finished:['Finished','p-finished'], selflog:['Self-logging','p-selflog']
};
const SOURCES = { ai:'Beast AI', plan:'From plan', builder:'Meal Builder', typed:'Typed in' };
const FOOD_GROUPS = {
  Proteins:['Chicken','Beef','Pork','Lamb','Fish','Tuna','Salmon','Prawns','Eggs','Tofu','Tempeh','Greek yoghurt','Cottage cheese','Protein powder'],
  Carbs:['Rice','Pasta','Potato','Sweet potato','Bread','Wraps','Oats','Noodles','Quinoa','Couscous'],
  Vegetables:['Broccoli','Spinach','Salad leaves','Capsicum','Carrots','Zucchini','Green beans','Mushrooms','Tomatoes','Cauliflower'],
  Fruit:['Banana','Apple','Berries','Orange','Grapes','Mango','Kiwi'],
  Snacks:['Nuts','Cheese','Popcorn','Rice cakes','Dark chocolate','Protein bars']
};
const EQUIPMENT = ['Full gym','Dumbbells','Barbell','Kettlebells','Resistance bands','Pull-up bar','Bench','Treadmill or bike','None'];
const DIETS = ['No restrictions','Vegetarian','Vegan','Pescatarian','Halal','Kosher','Dairy free','Gluten free','Other'];
const MEALS_PER_DAY = ['2','3','3 plus snacks','4 or more'];
const COOK_TIMES = ['5 min','15 min','30 min','I like cooking'];
const WHO_COOKS = ['Me','Someone else','Shared'];
const ACTIVITY = ['Mostly sitting','Mixed','On my feet','Physical work'];
const TIME_OF_DAY = ['Morning','Lunchtime','Evening','Varies'];
const SESSIONS = ['30','45','60','90'];
const PLACES = ['Home','Gym','Both'];
const EXPERIENCE = ['Beginner','Some','Experienced'];
const MEAL_SLOTS = ['Breakfast','Lunch','Snack','Dinner'];
const EFFORTS = ['5 minutes','15 minutes',"I'll properly cook"];

/* Seed plan building blocks: [short name, foods with amounts, kcal, protein, carbs, fat, fibre] */
const SLOT_OPTIONS = {
  Breakfast: [
    ['Oats with Greek yoghurt and berries','60g oats, 150g Greek yoghurt, 80g berries, 1 banana',470,34,62,11,9],
    ['Scrambled eggs on toast','3 eggs with a handful of spinach, 2 slices wholegrain toast',480,30,34,20,6],
    ['Protein smoothie','1 scoop whey, 1 banana, 250ml milk, 30g oats',490,40,66,9,6]
  ],
  Lunch: [
    ['Chicken and rice bowl','150g chicken breast, 150g cooked rice, 100g broccoli, 1 tsp soy sauce',560,45,62,12,9],
    ['Tuna wrap','1 wholemeal wrap, 130g tuna in springwater, salad leaves, tomato',540,42,55,14,9],
    ['Beef and quinoa salad','120g lean beef mince, 120g cooked quinoa, mixed greens, capsicum',570,46,52,19,10]
  ],
  Snack: [
    ['Greek yoghurt and almonds','200g Greek yoghurt, 20g almonds',240,22,12,11,3],
    ['Apple, cheese and rice cakes','1 apple, 30g cheddar, 2 rice cakes',250,9,30,10,4],
    ['Protein bar','1 protein bar (about 60g)',230,20,25,7,3]
  ],
  Dinner: [
    ['Salmon with potato','150g salmon, 250g potato, 150g green beans, 1 tsp olive oil',700,42,60,30,10],
    ['Lean beef with sweet potato','150g lean beef steak, 180g sweet potato, spinach and mushrooms',720,44,58,31,9],
    ['Chicken thigh pasta','150g skinless chicken thigh, 200g wholemeal pasta, tomato sauce, zucchini',740,40,74,28,10]
  ]
};
const SAM_TRAIN = 'Mon: Full body A. Squat, row, bench press, plank. 3 sets of 8 to 10.\nWed: Intervals. 20 min easy warm up, 6 x 1 min hard on the bike, 2 min easy between.\nFri: Full body B. Deadlift, split squat, lat pulldown, dead bug.\nSat: Long walk to 8,000 steps. 15 min mobility.';
const JORDAN_TRAIN = 'Mon: Lower body, squat focus.\nTue: Upper body, push.\nThu: Lower body, deadlift focus.\nFri: Upper body, pull.\nSat: Full body conditioning, 20 min.';

/* ==========================================================================
   Storage module: the only place that reads or writes saved data.
   Later this is swapped for Supabase calls with the same shapes.
   ========================================================================== */
const Store = {
  load() {
    try {
      const raw = localStorage.getItem(DB_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && d.version === 1 && Array.isArray(d.clients)) return d;
      }
    } catch (e) { /* fall through to seed */ }
    return seedDb();
  },
  save(d) {
    try { localStorage.setItem(DB_KEY, JSON.stringify(d)); }
    catch (e) { toast('Browser storage is full. Use Reset demo to clear it.'); }
  },
  loadUi() {
    try { return JSON.parse(localStorage.getItem(UI_KEY)) || {}; } catch (e) { return {}; }
  },
  saveUi(u) { try { localStorage.setItem(UI_KEY, JSON.stringify(u)); } catch (e) {} }
};
let db = null;
function persist() { Store.save(db); }

/* ==========================================================================
   Dates and numbers
   ========================================================================== */
const pad = n => String(n).padStart(2, '0');
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayS() { return ymd(new Date()); }
function pd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); }
function diffDays(a, b) { return Math.round((pd(b) - pd(a)) / 86400000); }
function dowNum(s) { return (pd(s).getDay() + 6) % 7 + 1; }          // 1 = Mon ... 7 = Sun
function fmtDate(s) { return s ? pd(s).toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short', year:'numeric' }) : 'Not set'; }
function relDay(s) {
  if (!s) return 'Never';
  const n = diffDays(s, todayS());
  if (n === 0) return 'Today';
  if (n === 1) return 'Yesterday';
  if (n < 0) return fmtDate(s);
  return n + ' days ago';
}
function uid() { return 'id' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36); }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const clampNum = (v, max) => { const x = Math.round(parseFloat(v)); return isFinite(x) ? Math.max(0, Math.min(max, x)) : 0; };
const kgToLb = k => k * 2.20462;
const lbToKg = l => l / 2.20462;
const money = v => '$' + (Math.round(v * 100) / 100).toFixed(2).replace(/\.00$/, '');
const NUT = ['calories','protein','carbs','fat','fibre'];
const NUT_LABEL = { calories:'Calories', protein:'Protein', carbs:'Carbs', fat:'Fat', fibre:'Fibre' };
function nutFrom(v) {
  return { calories: clampNum(v.calories, 5000), protein: clampNum(v.protein, 500), carbs: clampNum(v.carbs, 800),
           fat: clampNum(v.fat, 400), fibre: clampNum(v.fibre, 200) };
}
function sumNut(list) {
  const t = { calories:0, protein:0, carbs:0, fat:0, fibre:0 };
  list.forEach(m => NUT.forEach(k => { t[k] += Number(m[k]) || 0; }));
  return t;
}
/* Colour rules: calories, carbs ±5% green, ±10% amber, beyond red.
   Protein and fibre: 95% or more green, 90% or more amber. Fat: 105% or less green, 110% or less amber. */
function tone(kind, val, target) {
  if (!target) return '';
  const p = val / target;
  if (kind === 'fat') return p <= 1.05 ? 'g' : p <= 1.10 ? 'a' : 'r';
  if (kind === 'protein' || kind === 'fibre') return p >= 0.95 ? 'g' : p >= 0.90 ? 'a' : 'r';
  const dev = Math.abs(p - 1);
  return dev <= 0.05 ? 'g' : dev <= 0.10 ? 'a' : 'r';
}
const TONE_TEXT = { g:'c-green', a:'c-amber', r:'c-red', '':'' };

/* ==========================================================================
   Seed data (test data only, relative to today)
   ========================================================================== */
function buildPlan(factor) {
  const f = v => Math.round(v * factor);
  const plan = {};
  for (let d = 0; d < 7; d++) {
    plan[d + 1] = [
      mealOf('Breakfast', SLOT_OPTIONS.Breakfast[d % 3], f),
      mealOf('Lunch', SLOT_OPTIONS.Lunch[(d + 1) % 3], f),
      mealOf('Snack', SLOT_OPTIONS.Snack[(d + 2) % 3], f),
      mealOf('Dinner', SLOT_OPTIONS.Dinner[d % 3], f)
    ];
  }
  return plan;
}
function mealOf(label, o, f) {
  return { label, name: o[0], text: o[1], calories: f(o[2]), protein: f(o[3]), carbs: f(o[4]), fat: f(o[5]), fibre: f(o[6]) };
}
function draftFromPlan(plan) {
  const out = {};
  for (let d = 1; d <= 7; d++) {
    out[d] = { lines: plan[d].map(m => m.label + ': ' + m.text).join('\n'), meals: plan[d] };
  }
  return out;
}
function emptyDraft() {
  const out = {};
  for (let d = 1; d <= 7; d++) out[d] = { lines: '', meals: [] };
  return out;
}
function emptyPublished() {
  const out = {};
  for (let d = 1; d <= 7; d++) out[d] = [];
  return out;
}
function blankOb(extra) {
  return Object.assign({
    age:'', sex:'', heightCm:'', weight:'', weightUnit:'kg', weightKg:null, whatsapp:'',
    timezone: (Intl.DateTimeFormat().resolvedOptions().timeZone || 'Australia/Melbourne'),
    goal:'', goalBy:'', goalWhy:'',
    job:'', activity:'', steps:'',
    likedFoods:[], likedOther:'', avoid:'', allergies:'', diet:'No restrictions',
    mealsPerDay:'3', cookTime:'15 min', whoCooks:'Me', eatsOut:'', alcohol:'', typicalDay:'',
    trainingDays:[], timeOfDay:'Varies', sessionLength:'45', place:'Gym', equipment:[], experience:'Beginner',
    enjoys:'', hates:'', injuries:'', worked:'', didnt:'', weighInDay:'Mon',
    health:{ heart:null, chest:null, other:null }, healthNote:'', healthClearance:false,
    agreeTerms:false, agreeNotCoach:false, agreeConsent:false, submittedAt:null
  }, extra || {});
}
function mkClient(o) {
  return Object.assign({
    id: uid(), name:'', email:'', tier:'essential', status:'onboarding', paid:null, createdAt: new Date().toISOString(),
    startDate:null, pauseUsed:0, pauseStart:null, healthFlag:false, ob: blankOb(),
    weighIns:[], workouts:[], targets:null,
    plan:{ mealDraft: emptyDraft(), mealPublished: null, trainDraft:'', trainPublished: null, publishedAt: null },
    logs:{}, notes:''
  }, o);
}
function seedDb() {
  const t = todayS();

(function captureDemoKey() {

  }
})();

async function askAI(body) {
  const key = localStorage.getItem(DEMO_KEY_NAME);
  if (!key) return { ok:false, code:'no_key' };
  let r, data = {};
  try {
    r = await fetch('/api/demo-ai', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-demo-key': key },
      body: JSON.stringify(body)
    });
    try { data = await r.json(); } catch (e) { data = {}; }
  } catch (e) {
    aiOk = false;
    return { ok:false, code:'network' };
  }
  if (r.ok) { aiOk = true; return { ok:true, data }; }

  return { ok:false, code: data.error || ('http_' + r.status) };
}

function clientById(id) { return db.clients.find(c => c.id === id); }
function activeCount(tier) { return db.clients.filter(c => c.tier === tier && (c.status === 'active' || c.status === 'paused')).length; }
function spotsLeft(tier) { return db.capacity[tier] - activeCount(tier); }
function pauseTotal(c) {
  return c.pauseUsed + (c.status === 'paused' && c.pauseStart ? Math.max(0, diffDays(c.pauseStart, todayS())) : 0);
}
function weekOf(c) {
  if (!c.startDate) return 0;
  const e = diffDays(c.startDate, todayS()) - pauseTotal(c);
  if (e < 0) return 0;
  return Math.min(WEEKS, Math.floor(e / 7) + 1);
}
function endDateOf(c) { return c.startDate ? addDays(c.startDate, WEEKS * 7 + pauseTotal(c)) : null; }
function lastLogDate(c) {
  const keys = Object.keys(c.logs).filter(k => (c.logs[k] || []).length).sort();
  return keys.length ? keys[keys.length - 1] : null;
}
function hasPlanMeals(pub) { return !!pub && Object.values(pub).some(a => a && a.length); }
function draftMeals(c) {
  const out = {};
  for (let d = 1; d <= 7; d++) out[d] = c.plan.mealDraft[d].meals;
  return out;
}
function plansChanged(c) {
  const mealsDiff = JSON.stringify(draftMeals(c)) !== JSON.stringify(c.plan.mealPublished || emptyPublished());
  const trainDiff = (c.plan.trainDraft || '') !== (c.plan.trainPublished || '');
  return mealsDiff || trainDiff;
}
function activationMissing(c) {
  const m = [];
  if (!c.targets) m.push('Daily targets are not set');
  if (!hasPlanMeals(c.plan.mealPublished)) m.push('Meal plan is not published');
  if (!c.plan.trainPublished) m.push('Training plan is not published');
  if (c.healthFlag && !c.ob.healthClearance) m.push('Client has not confirmed doctor clearance');
  if (c.tier !== 'essential' && spotsLeft(c.tier) <= 0) m.push('No spot is free in ' + TIERS[c.tier].name);
  return m;
}
function needsYou(c) {
  const n = [];
  if (c.status === 'awaiting' && !hasPlanMeals(c.plan.mealPublished)) n.push('Build plan');
  if (c.status === 'awaiting' && hasPlanMeals(c.plan.mealPublished) && c.plan.trainPublished) n.push('Book call, activate');
  if (c.status === 'active') {
    const last = lastLogDate(c);
    if (!last || diffDays(last, todayS()) >= 3) n.push('No logs 3+ days');

}

function weekLabel(c) {

  if (c.status === 'finished') return WEEKS + ' of ' + WEEKS;

function weighChart(wi, unit) {
  if (wi.length < 2) return '<p class="muted">Add a second weigh-in to see the trend line.</p>';
  const W = 320, H = 150, P = 22;
  const vals = wi.map(w => unit === 'kg' ? w.kg : kgToLb(w.kg));
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1;
  const pts = vals.map((v, i) => [P + i * (W - 2 * P) / (vals.length - 1), H - P - (v - min) / span * (H - 2 * P)]);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const dots = pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="#2D6A4F"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weigh-in trend">
    <line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" stroke="#e2e9e0"/>
    <path d="${path}" fill="none" stroke="#52B788" stroke-width="3" stroke-linejoin="round"/>${dots}
    <text x="${P}" y="${H - 4}" font-size="11" fill="#5b6b60">${esc(fmtShort(wi[0].date))}</text>
    <text x="${W - P}" y="${H - 4}" font-size="11" fill="#5b6b60" text-anchor="end">${esc(fmtShort(wi[wi.length - 1].date))}</text>
    <text x="${P}" y="12" font-size="11" fill="#5b6b60">High ${max.toFixed(1)} ${unit}</text>
    <text x="${W - P}" y="12" font-size="11" fill="#5b6b60" text-anchor="end">Low ${min.toFixed(1)} ${unit}</text>
  </svg>`;
}

function barHtml(label, val, target, unit) {

  if (!target) {
    return `<div class="metric"><div class="top"><span>${NUT_LABEL[label]}</span><span>${val} ${unit}</span></div></div>`;

function clearObErr(key) {
  const e = document.getElementById('err-' + key);
  if (e) e.textContent = '';
  document.querySelectorAll(`[data-ob="${key}"]`).forEach(el => el.classList.remove('invalid'));
}
function validateOb(c) {
  const ob = c.ob;
  const errs = {};
  const num = v => parseFloat(v);
  if (!(num(ob.age) >= 10 && num(ob.age) <= 100)) errs.age = 'Enter your age (10 to 100).';
  if (!(num(ob.heightCm) >= 100 && num(ob.heightCm) <= 250)) errs.heightCm = 'Enter your height in cm (100 to 250).';
  if (!(num(ob.weight) > 0)) errs.weight = 'Enter your current weight.';
  if (!ob.goal.trim()) errs.goal = 'Tell us what you want to achieve.';
  if (ob.whatsapp.replace(/\D/g, '').length < 6) errs.whatsapp = 'Enter a WhatsApp number so Stefan can reach you.';
  if (!ob.trainingDays.length) errs.trainingDays = 'Tick at least one training day.';
  const liked = ob.likedFoods.length + ob.likedOther.split(',').map(s => s.trim()).filter(Boolean).length;
  if (liked < 3) errs.likedFoods = 'Tick at least 3 foods you like.';
  const answers = Object.values(ob.health);
  if (answers.some(v => v === null)) errs.health = 'Answer all three health questions.';
  if (answers.includes('yes') && !ob.healthClearance) errs.healthClearance = 'Tick this to confirm your doctor has cleared you.';
  if (!ob.agreeTerms) errs.agreeTerms = 'Please agree to the terms.';
  if (!ob.agreeNotCoach) errs.agreeNotCoach = 'Please confirm you understand this is coaching, not medical advice.';
  if (!ob.agreeConsent) errs.agreeConsent = 'Please agree so Stefan can see your logs.';
  return errs;
}

    return hasPlanMeals(c.plan.mealPublished)
      ? 'Your plan is ready to read. Message Stefan on WhatsApp to book your call and pick a start date.'
      : 'Stefan is building your plan. It will be ready within 3 business days. You can start logging meals now.';

  if (s === 'active') {
    if (c.tier === 'essential') return 'Your plan is active. Weigh-in day: ' + (DAYS_FULL[DAYS.indexOf(c.ob.weighInDay)] || c.ob.weighInDay) + '.';

/* Progress: shared by client and coach */
function renderProgress(c, coach) {
  const wi = sortedWeighIns(c);
  const unit = ui.unit;
  const unitBtns = `<div class="tabs" style="margin:0"><button class="tab ${unit === 'kg' ? 'on' : ''}" data-act="unit" data-u="kg">kg</button><button class="tab ${unit === 'lb' ? 'on' : ''}" data-act="unit" data-u="lb">lb</button></div>`;
  let stats = '<p class="muted">No weigh-ins yet.</p>';
  if (wi.length) {
    const first = wi[0].kg, last = wi[wi.length - 1].kg;
    const prev = wi.length > 1 ? wi[wi.length - 2].kg : null;
    const change = last - first;
    const pct = first ? (change / first * 100) : 0;
    const dUnit = unit === 'kg' ? 'kg' : 'lb';
    const conv = v => unit === 'kg' ? v : kgToLb(v);
    stats = `<div class="grid3">
      <div class="note-box"><div class="mini">Latest weight</div><b style="font-family:'Bebas Neue',Impact,sans-serif;font-size:32px">${weightText(last, unit)}</b></div>
      <div class="note-box"><div class="mini">Change since start</div><b class="${change <= 0 ? 'c-green' : 'c-red'}" style="font-family:'Bebas Neue',Impact,sans-serif;font-size:32px">${(conv(change)).toFixed(1)} ${dUnit} (${pct.toFixed(1)}%)</b></div>
      <div class="note-box"><div class="mini">Change since last weigh-in</div><b style="font-family:'Bebas Neue',Impact,sans-serif;font-size:32px">${prev == null ? 'n/a' : conv(last - prev).toFixed(1) + ' ' + dUnit}</b></div>
    </div>`;
  }
  const weekAgo = addDays(todayS(), -6);
  const wos = (c.workouts || []).filter(w => w.date >= weekAgo).sort((a, b) => a.date < b.date ? 1 : -1);
  const woList = wos.length ? wos.map(w => `<div class="meal"><div><b>${esc(w.what)}</b><div class="mini">${fmtDate(w.date)} · ${w.minutes} min${w.notes ? ' · ' + esc(w.notes) : ''}</div></div></div>`).join('')
    : '<p class="muted">No workouts in the last 7 days.</p>';
  return `<div class="card"><div class="row"><h3 style="margin:0">Weight</h3>${unitBtns}</div>
      <div style="margin-top:12px">${stats}</div>${weighChart(wi, unit)}</div>
    <div class="card"><h3>Workouts in the last 7 days</h3>${woList}</div>`;
}

      const summary = `<summary><span>${fmtDate(date)}</span>
        <span class="mini" style="font-weight:400;margin-left:8px">${meals.length ? `<span class="${TONE_TEXT[calT]}">${tot.calories} kcal</span> · <span class="${TONE_TEXT[proT]}">P ${tot.protein}g</span> · ${meals.length} meal${meals.length === 1 ? '' : 's'}` : 'No meals logged'}
        · ${wo.length ? 'Workout' : 'No workout'} · ${wi ? weightText(wi.kg, 'kg') : 'No weigh-in'}</span></summary>`;
      const body = meals.length ? meals.map(m => `<div class="meal" style="padding:8px 0">
          <div style="flex:1 1 200px"><span class="mini">${esc(m.time || '')}</span> <b>${esc(m.name)}</b> <span class="mini">${esc(sourceLabel(m))}</span>
          <div class="mini">${m.calories} kcal · P ${m.protein}g · C ${m.carbs}g · F ${m.fat}g · Fibre ${m.fibre}g</div>
          ${m.edited && m.ai ? `<div class="edited">Changed by client. Beast AI said ${m.ai.calories} kcal, P ${m.ai.protein}g.</div>` : ''}</div></div>`).join('')
        : '<p class="mini">No meals logged.</p>';
      const woTxt = wo.length ? '<div class="mini">Workout: ' + wo.map(w => esc(w.what) + ' (' + w.minutes + ' min)').join(', ') + '</div>' : '';
      return `<details ${idx === 0 ? 'open' : ''}>${summary}<div style="padding:4px 0 6px">${body}${woTxt}</div></details>`;
    }).join('')}
  </div>`;
}

function resizeToJpeg(file, max) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * s); canvas.height = Math.round(img.height * s);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}
ACT.build = async () => {
  const c = clientById(ui.clientId);
  const fileEl = document.getElementById('fridgeFile');
  const file = fileEl && fileEl.files && fileEl.files[0];
  let have = (ui.bText || '').trim();
  if (file) {
    if (file.size > 12 * 1024 * 1024) { toast('That photo is too large. Try a smaller one.'); return; }
    toast('Looking in your fridge...');
    try {
      const b64 = await resizeToJpeg(file, 1280);
      if (b64.length > 2800000) { toast('That photo is too large after resizing.'); return; }
      const res = await askAI({ mode: 'fridge', image: { type: 'image/jpeg', data: b64 } });
      if (res.ok) {
        const items = (res.data.items || []).map(i => typeof i === 'string' ? i : (i && i.name) || '').filter(Boolean);
        have = [items.join(', '), have].filter(Boolean).join(', ');
        ui.bText = have;
      } else { aiFail(res); }
    } catch (e) { toast('That photo could not be read. Type what you have instead.'); }
  }
  if (!have) { toast('Add a photo or type what you have.'); return; }
  const t = c.targets;
  const eaten = totalsFor(c, ui.clientDay > todayS() ? todayS() : ui.clientDay);
  const body = { mode: 'create', have: have.slice(0, 600), meal: ui.bMeal, effort: ui.bEffort };
  if (t) body.targets = {
    calories: Math.min(900, Math.max(0, t.calories - eaten.calories)),
    protein: Math.min(60, Math.max(0, t.protein - eaten.protein)),
    fibre: Math.max(0, t.fibre - eaten.fibre)
  };
  toast('Thinking up meals...');
  const res = await askAI(body);
  if (!res.ok) { aiFail(res); ui.buildResults = null; saveUi(); render(); return; }
  const list = (res.data.meals || []).map(m => ({
    name: String(m.name || 'Meal').slice(0, 80),
    text: [].concat(m.uses || [], m.pantry || []).join(', '),
    steps: Array.isArray(m.steps) ? m.steps.slice(0, 8) : [],
    tip: String(m.tip || '').slice(0, 200),
    offTarget: !!m.offTarget,
    calories: clampNum(m.calories, 5000), protein: clampNum(m.protein, 500), carbs: clampNum(m.carbs, 800),
    fat: clampNum(m.fat, 400), fibre: clampNum(m.fibre, 200)
  }));
  ui.buildResults = list.length ? list : null;
  if (!list.length) toast('No meals came back. Try again or enter the numbers yourself.');
  saveUi(); render();
};

function parseLines(text) {
  return text.split('\n').map(s => s.trim()).filter(Boolean).map((line, i) => {
    const idx = line.indexOf(':');
    if (idx > 0) return { label: line.slice(0, idx).trim().slice(0, 40), text: line.slice(idx + 1).trim().slice(0, 300) };
    return { label: 'Meal ' + (i + 1), text: line.slice(0, 300) };
  });
}

    c.plan.mealDraft[d] = { lines: c.plan.mealDraft[d].lines, meals };
    persist(); render(); toast('Numbers calculated. Check them before you publish.');
    return;
  }
  if (!res.ok) aiFail(res); else toast('Beast AI returned a different number of meals. Check the numbers by hand.');
  c.plan.mealDraft[d] = { lines: c.plan.mealDraft[d].lines, meals: parseLines(lines.join('\n')).map(zeroMeal) };

ACT.publish = () => {
  const c = clientById(ui.coachClientId);
  c.plan.mealPublished = JSON.parse(JSON.stringify(draftMeals(c)));
  c.plan.trainPublished = c.plan.trainDraft;
  c.plan.publishedAt = new Date().toISOString();
  persist(); render(); toast('Published to the client.');
};

/* ==========================================================================
   Event wiring (one delegated listener each)
   ========================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
const OB_SEL = '#onboardForm [data-ob], #onboardForm [data-obgrp], #onboardForm [data-health]';
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.ch === 'viewAs') {
    const v = el.value;
    if (v === 'coach') { ui.view = 'coach'; ui.coachClientId = null; }
    else if (v === 'new') { ui.view = 'new'; ui.newStep = 'plans'; }
    else if (v.startsWith('client:')) { ui.view = 'client'; ui.clientId = v.slice(7); ui.clientTab = 'today'; ui.clientDay = todayS(); ui.editId = null; }
    saveUi(); render(); window.scrollTo(0, 0);
    return;
  }
  if (el.dataset && el.dataset.ch && CH[el.dataset.ch]) { CH[el.dataset.ch](el, e); return; }
  if (el.dataset && el.dataset.ui) { ui[el.dataset.ui] = el.value; saveUi(); return; }
  if (el.matches && el.matches(OB_SEL)) handleObInput(el);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.ui) { ui[el.dataset.ui] = el.value; saveUi(); return; }
  if (el.dataset && el.dataset.inp && INP[el.dataset.inp]) { INP[el.dataset.inp](el, e); return; }
  if (el.matches && el.matches(OB_SEL)) handleObInput(el);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('#nc-name, #nc-email')) {
    const btn = document.querySelector('[data-act="pay"]');
    if (btn) btn.click();
  }
});

function handleObInput(el) {
  const c = clientById(ui.clientId);
  if (!c) return;
  const ob = c.ob;
  if (el.dataset.health) {
    ob.health[el.dataset.health] = el.value;
    const anyYes = Object.values(ob.health).some(v => v === 'yes');
    document.getElementById('clearWrap').hidden = !anyYes;
    document.getElementById('otherWrap').hidden = ob.health.other !== 'yes';
    clearObErr('health');
    persist();
    return;
  }
  if (el.dataset.obgrp) {
    const k = el.dataset.obgrp;
    const set = new Set(ob[k]);
    if (el.checked) set.add(el.value); else set.delete(el.value);
    ob[k] = Array.from(set);
    clearObErr(k);
    persist();
    return;
  }
  const k = el.dataset.ob;
  if (el.type === 'checkbox') ob[k] = el.checked;
  else if (el.type === 'radio') { if (el.checked) ob[k] = el.value; }
  else ob[k] = el.value;
  if (k === 'healthClearance') { clearObErr('healthClearance'); }
  else clearObErr(k);
  if (k === 'weightUnit' || k === 'weight') clearObErr('weight');
  persist();
}

/* ==========================================================================
   Boot
   ========================================================================== */
db = Store.load();
initUi();
if (ui.view === 'client' && !clientById(ui.clientId)) { ui.view = 'coach'; ui.clientId = null; }
ui.clientDay = ui.clientDay > todayS() ? todayS() : ui.clientDay;
saveUi();
render();
</script>
</body>
