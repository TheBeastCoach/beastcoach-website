<!doctype html>
<!--
  REAL SITE NOTE (no change in the demo):
  In the real site, a "My Coach" tile appears on the logged-in Dashboard only for accounts with
  a coaching plan, and it opens this client screen. In this demo, the "View as" menu stands in
  for that tile: pick Coach (Stefan), a client, or New client.
-->
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coaching demo | Beast Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B3022;--green:#2D6A4F;--mint:#52B788;--bg:#F4F7F2;--amber:#F59E0B;--amber-hover:#FFB62E;--muted:#3B4F43;--line:#D5E0D8;--red:#b42318;--amber-text:#8a5300}
*{box-sizing:border-box}
body{margin:0;font-family:'Manrope',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
h1,h2,h3,.disp{font-family:'Bebas Neue','Arial Narrow',Impact,sans-serif;font-weight:400;letter-spacing:.02em;margin:0;color:var(--ink)}
h1{font-size:clamp(48px,7vw,80px);line-height:.95}h2{font-size:clamp(36px,5vw,52px);line-height:1}h3{font-size:30px;line-height:1.05}
p{margin:0 0 10px}
a{color:var(--green)}a:hover{color:var(--ink)}
:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:18px 20px}
.muted{color:var(--muted);font-size:14px}
.eyebrow{font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
.card h3{margin-bottom:12px}
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:26px 24px;margin-bottom:16px}
.hero h1{color:#fff}.hero .muted{color:#D5E6DB}
.hero .eyebrow{color:#8FD3B0}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}
.grid3{display:grid;gap:14px;grid-template-columns:1fr}
.grid5{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}.grid5{grid-template-columns:repeat(5,1fr)}}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack>*+*{margin-top:10px}
.hidden,[hidden]{display:none !important}
/* demo bar */
.demo-bar{background:var(--ink);color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
@media(min-width:900px){.demo-bar{position:sticky;top:0;z-index:50}}
.logo{font-family:'Bebas Neue',Impact,sans-serif;font-size:24px;letter-spacing:.1em;color:#fff}
.logo span{color:var(--mint)}
.tag{background:var(--amber);color:#1B1200;font-weight:800;border-radius:6px;padding:3px 9px;font-size:12px;letter-spacing:1px}
.demo-bar select{width:auto;min-width:230px;max-width:100%}
.demo-bar .note{font-size:13px;color:#D5E6DB;flex:1 1 260px}
.ai{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px}
.ai.on{background:#d8f3e3;color:#1b5e3a}.ai.off{background:#fde7c2;color:#7a4a00}
/* form controls */
select,input,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid #C5D3C8;border-radius:12px;padding:10px 12px;width:100%;max-width:100%}
select option{color:var(--ink);background:#fff}
textarea{min-height:92px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;margin:0;accent-color:var(--green)}
label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.field{margin-bottom:12px}
.field.inline label{display:inline}
.err{color:var(--red);font-size:13px;margin-top:4px;min-height:0}
.err:empty{display:none}
.invalid{border-color:var(--red)!important;box-shadow:0 0 0 2px #fbd4cf}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid #C5D3C8;border-radius:999px;padding:7px 13px;background:#fff;cursor:pointer;font-size:14px;font-weight:600;margin:0}
.chip:has(input:checked){background:#d8f3e3;border-color:var(--mint)}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin:0 0 10px;cursor:pointer}
.check input{margin-top:4px}
.hl-red{background:#fdecea;border-left:4px solid var(--red);padding:9px 12px;border-radius:10px}
.hl-amber{background:#fff6e0;border-left:4px solid var(--amber);padding:9px 12px;border-radius:10px}
.note-box{background:#EEF5F0;border-radius:14px;padding:12px 14px;font-size:15px}
/* buttons: amber is the primary action, as on the sales page */
button,.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:13px 20px;min-height:48px;cursor:pointer;background:var(--amber);color:#1B1200;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;text-align:center}
button:hover{background:var(--amber-hover)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:var(--ink);color:#fff}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid #C5D3C8}.btn-ghost:hover{background:#F4F7F2}
.btn-danger{background:#fff;color:var(--red);border:1px solid #f0c4c0}.btn-danger:hover{background:#fdecea}
.btn-sm{padding:7px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn-link{background:none;color:var(--green);padding:0;min-height:0;text-decoration:underline;font-weight:800}.btn-link:hover{background:none;color:var(--ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{background:#fff;color:var(--ink);border:1px solid #C5D3C8;padding:9px 16px;border-radius:999px;min-height:40px}
.tab:hover{background:#F4F7F2}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill{display:inline-block;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;white-space:nowrap}
.p-onboarding{background:#eef1f4;color:#3b4a57}.p-awaiting{background:#fff3d6;color:#8a5a00}.p-active{background:#d8f3e3;color:#1b5e3a}.p-paused{background:#e6ecff;color:#2c3e9a}.p-finished{background:#ececec;color:#444}
.need{display:inline-block;background:#fde7c2;color:#7a4a00;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:800;margin:2px 4px 2px 0}
.bar{height:10px;background:#E3EBE4;border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--mint)}
.bar>span.g{background:#2fa36b}.bar>span.a{background:var(--amber)}.bar>span.r{background:var(--red)}
.c-green{color:#1b7a46}.c-amber{color:var(--amber-text)}.c-red{color:var(--red)}
.metric{margin-bottom:14px}
.metric .top{display:flex;justify-content:space-between;gap:8px;font-size:15px;margin-bottom:5px;flex-wrap:wrap}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td input,td select{padding:7px 9px;font-size:14px}
td.num input{width:76px}
.meal{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start;flex-wrap:wrap}
.meal:last-child{border-bottom:0}
.meal .kcal{font-family:'Bebas Neue',Impact,sans-serif;font-size:28px;line-height:1;white-space:nowrap}
.meal .acts{display:flex;gap:6px}
.meal-edit{display:grid;gap:8px;grid-template-columns:repeat(2,1fr);width:100%}
.meal-edit .wide{grid-column:1/-1}
@media(min-width:700px){.meal-edit{grid-template-columns:repeat(6,1fr)}.meal-edit .wide{grid-column:span 2}}
.mini{font-size:14px;color:var(--muted)}
.edited{font-size:13px;color:var(--amber-text);background:#fff6e0;border-radius:8px;padding:4px 9px;display:inline-block;margin-top:5px}
.dl{display:grid;grid-template-columns:1fr;gap:2px 14px}
.dl dt{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:10px}
.dl dd{margin:0 0 4px;font-size:15px}
@media(min-width:700px){.dl{grid-template-columns:200px 1fr}.dl dt{margin-top:9px}}
.cap-nums{display:flex;gap:24px;margin:6px 0 14px}
.cap-nums b{font-family:'Bebas Neue',Impact,sans-serif;font-size:44px;line-height:1;display:block}
.cap-nums span{font-size:14px;color:var(--muted)}
.plans{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.plans{grid-template-columns:repeat(3,1fr)}}
.plan-card{display:flex;flex-direction:column;gap:8px}
.price{font-family:'Bebas Neue',Impact,sans-serif;font-size:52px;line-height:1}
.chart{width:100%;height:auto;display:block;margin:10px 0}
details{margin-bottom:10px}
summary{cursor:pointer;font-weight:800;padding:8px 0;list-style:none}
summary::-webkit-details-marker{display:none}
.day-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.day-row button{padding:8px 13px;border-radius:999px;font-size:14px;min-height:38px}
.day-row button.on{background:var(--ink);color:#fff}
.day-row button.dot::after{content:" \2022";color:var(--mint)}
.pre{white-space:pre-wrap;font-family:inherit;margin:0;font-size:15px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 18px;border-radius:14px;z-index:99;display:none;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{display:block}
.status-line{font-weight:700;font-size:17px;color:#fff}
.fine{font-size:13px;color:var(--muted)}
.list-clean{margin:6px 0 0;padding-left:18px}
.sr{position:absolute;left:-9999px}
.plan-inputs{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
.pi-grid{display:grid;gap:18px 26px;grid-template-columns:1fr;margin-top:14px}
@media(min-width:760px){.pi-grid{grid-template-columns:repeat(3,1fr)}}
.pi-sec h4{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:22px;margin:0 0 8px;letter-spacing:.02em}
.pi-sec p{margin:0 0 6px;font-size:15px}
.pi-tag{display:inline-block;background:#E8F3EC;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;margin:0 6px 6px 0}
.pi-tag.day{background:#d8f3e3}
@media(max-width:899px){h3{font-size:26px}}

.mchip{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:14px;color:var(--ink)}
.mchip i{width:12px;height:12px;border-radius:50%;background:var(--mc);display:inline-block;flex:none}
.ex-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #EEF3EF;flex-wrap:wrap}
.ex-row span{font-weight:700}
.pt-line{padding:7px 0;font-weight:800}
.pt-gap{height:8px}
.sheet-back{position:fixed;inset:0;background:rgba(15,28,20,.55);z-index:95}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px 20px 28px;z-index:96;box-shadow:0 -12px 40px rgba(0,0,0,.25)}
@media(min-width:700px){.sheet{left:50%;transform:translateX(-50%);width:620px;max-width:92vw;border-radius:22px;bottom:24px}}
@media(max-width:699px){.sheet{top:0;bottom:0;max-height:none;border-radius:0}}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:6px}
.sheet h4{font-family:'Bebas Neue','Arial Narrow',Impact,sans-serif;font-weight:400;font-size:24px;margin:18px 0 6px;letter-spacing:.02em}
.sheet p{margin:0 0 6px;font-size:16px}
.sheet ol,.sheet ul{padding-left:22px;margin:0}
.sheet li{margin:6px 0;font-size:16px}

.banner{background:#FFF6E0;border:2px solid var(--amber);color:#4a2c00;border-radius:14px;padding:13px 16px;margin-bottom:14px;font-weight:700}
.progress{height:10px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-top:14px}
.progress span{display:block;height:100%;background:var(--amber);border-radius:99px}
.ob-nav{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:4px 0 24px}
@media(max-width:699px){.ob-nav{flex-direction:column-reverse}.ob-nav button,.ob-nav .btn-ghost{width:100%}.ob-nav span{display:none}}

.ob-msg{color:var(--red);font-weight:700;margin:4px 0 12px;min-height:0}
.ob-msg:empty{display:none}
.target-row{display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.target-row:last-child{border-bottom:0}
.target-val{font-family:'Bebas Neue',Impact,sans-serif;font-size:40px;line-height:1;white-space:nowrap}
.target-val small{font-size:16px}
.wo-set{display:grid;grid-template-columns:44px 1fr 1fr auto;gap:8px;align-items:center;margin-top:6px}
.wo-set input{padding:8px 10px}
.wo-head{font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.log-ex{padding:4px 0}
.up-badge{display:inline-block;background:#d8f3e3;color:#1b5e3a;border:1px solid var(--mint);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:800;margin-left:4px}
.plans{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
</style>
</head>
<body>
<header class="demo-bar" id="demoBar"></header>
<main class="wrap" id="app"></main>
<div id="sheetRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/basic-targets.js"></script>
<script>
'use strict';

/* ==========================================================================
   Constants
   ========================================================================== */
const DB_KEY = 'bc_demo_v2';
const UI_KEY = 'bc_demo_ui';
const DEMO_KEY_NAME = 'bc_demo_key';
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAYS_FULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const WEEKS = 12;
const PAUSE_MAX = 14;
const CAP_TIERS = ['essential','core','beast'];          // capped: coach places
const COACHED = ['essential','core','beast'];              // 12-week coaching plans
const TIERS = {

  beast: { name:'The Beast', price:699, big:'$699', bigNote:'for 12 weeks', short:'$699 for 12 weeks', recur:true,
    desc:'12 weeks of close, hands-on coaching in our smallest group. Our most supported option.' }
};
const STATUS = {
  onboarding:['Onboarding','p-onboarding'], awaiting:['Awaiting activation','p-awaiting'],
  active:['Active','p-active'], paused:['Paused','p-paused'], finished:['Finished','p-finished']
};
const SOURCES = { ai:'Beast AI', plan:'From plan', builder:'Meal Builder', typed:'Typed in' };
const FOOD_GROUPS = {
  Proteins:['Chicken','Beef','Pork','Lamb','Fish','Tuna','Salmon','Prawns','Eggs','Tofu','Tempeh','Greek yoghurt','Cottage cheese','Protein powder'],
  Carbs:['Rice','Pasta','Potato','Sweet potato','Bread','Wraps','Oats','Noodles','Quinoa','Couscous'],
  Vegetables:['Broccoli','Spinach','Salad leaves','Capsicum','Carrots','Zucchini','Green beans','Mushrooms','Tomatoes','Cauliflower'],
  Fruit:['Banana','Apple','Berries','Orange','Grapes','Mango','Kiwi'],
  Snacks:['Nuts','Cheese','Popcorn','Rice cakes','Dark chocolate','Protein bars']
};
const MACRO = {
  calories: { label:'Calories', unit:'kcal', bar:'#F59E0B', over:'#B45309', ink:'#92400E' },
  protein:  { label:'Protein',  unit:'g',    bar:'#2563EB', over:'#1E3A8A', ink:'#1D4ED8' },
  carbs:    { label:'Carbs',    unit:'g',    bar:'#7C3AED', over:'#4C1D95', ink:'#6D28D9' },
  fat:      { label:'Fat',      unit:'g',    bar:'#E11D48', over:'#9F1239', ink:'#BE123C' },
  fibre:    { label:'Fibre',    unit:'g',    bar:'#0891B2', over:'#155E75', ink:'#0E7490' }
};
const WEIGH_TIMES = ['05:00','05:30','06:00','06:30','07:00','07:30','08:00','08:30','09:00','09:30','10:00','10:30','11:00'];
function fmtTime(t) {
  const h = Number(t.slice(0, 2)), m = t.slice(3, 5);
  return ((h % 12) || 12) + ':' + m + (h < 12 ? 'am' : 'pm');
}
// Exercise library for "How to do it". Written for someone who has never trained.
// n = name, a = other names people use, w = what it works, s = steps, t = form tips, m = common mistakes, e = easier version.
const EXERCISES = [
  { n:'Bench press', a:['bench'], w:'Chest, the front of the shoulders and the backs of the arms.',
    s:['Lie on a flat bench with your eyes under the bar.','Grip the bar a little wider than your shoulders.','Unrack the bar and hold it above your chest with straight arms.','Lower the bar slowly to the middle of your chest.','Push it back up until your arms are straight.'],
    t:['Keep your feet flat on the floor and your bottom on the bench.','Keep your wrists straight, above your elbows.'],
    m:['Bouncing the bar off your chest.','Letting your elbows flare out wide.'],
    e:'Do push-ups on a bench or kitchen counter, or use dumbbells lighter than the bar.' },
  { n:'Dumbbell press', a:['dumbbell bench press','db press','db bench press'], w:'Chest, shoulders and triceps, with each arm working on its own.',

    e:'Use lighter dumbbells, or press with your back on a stable chair.' },
  { n:'Incline dumbbell press', a:['incline press','incline db press','incline dumbbell bench press'], w:'The upper part of the chest.',

    m:['Setting the bench too steep.','Dropping the weights too low.'],
    e:'Use a lower incline, or do push-ups with your hands on a raised surface.' },
  { n:'Push-up', a:['push up','pushup','push ups','pushups','press up'], w:'Chest, shoulders, triceps and the core.',
    s:['Start in a plank with your hands just outside your shoulders.','Keep your body in one straight line from head to heels.','Lower your chest towards the floor, elbows at about 45 degrees.','Push the floor away until your arms are straight.'],
    t:['Squeeze your glutes and brace your stomach.','Look at the floor just in front of your hands.'],
    m:['Hips sagging or bottom raised in the air.','Flaring your elbows straight out to the sides.'],
    e:'Push up with your hands on a bench or kitchen counter, or with your knees on the floor.' },
  { n:'Shoulder press', a:['overhead press','military press','db shoulder press','dumbbell shoulder press','shoulder press dumbbell'], w:'Shoulders and triceps.',
    s:['Sit on a bench with back support, dumbbells at shoulder height, palms facing forward.','Press the weights straight up until your arms are almost straight.','Lower them slowly back to shoulder height.','Keep your core tight the whole time.'],
    t:['Keep your back against the bench, not arched.','Move the dumbbells in a straight line over your shoulders.'],
    m:['Arching your lower back to lift the weight.','Pressing the dumbbells together in front of your face.'],
    e:'Use lighter weights, or press with a resistance band under your feet.' },
  { n:'Lateral raise', a:['side raise','lateral raises','side lateral raise','side raises'], w:'The side of the shoulders.',
    s:['Stand tall with a light dumbbell in each hand at your sides.','Keep a soft bend in your elbows.','Raise your arms out to the sides until they are level with your shoulders.','Lower slowly, taking about 3 seconds.'],
    t:['Lead with your elbows, not your hands.','Use light weights. This muscle is small.'],
    m:['Swinging the weights up with momentum.','Raising your arms above shoulder height.'],
    e:'Do it with no weights, or with a water bottle in each hand.' },
  { n:'Seated row', a:['cable row','seated cable row','row machine','seated cable rows'], w:'The upper back and the lats (the big muscles down your sides).',
    s:['Sit tall at the cable row with your feet on the platform and knees slightly bent.','Hold the handle with your arms straight.','Pull the handle to your belly button by squeezing your shoulder blades back.','Let your arms straighten again slowly, without rounding your back.'],
    t:['Keep your chest up and your back flat.','Pause for a second when the handle reaches your body.'],
    m:['Rocking your body backwards and forwards.','Shrugging your shoulders up towards your ears.'],
    e:'Use a lighter weight, or a resistance band anchored at waist height.' },
  { n:'Lat pulldown', a:['pulldown','lat pull down','lat pull','lat pulldowns'], w:'The lats and the biceps.',
    s:['Sit at the machine and hook your thighs under the pads.','Hold the bar a little wider than your shoulders.','Pull the bar down to your upper chest, leading with your elbows.','Let the bar rise slowly until your arms are straight.'],
    t:['Lean back slightly, about 10 to 15 degrees.','Think of pulling your elbows into your back pockets.'],

  load() {
    try {

          d.capacity = Object.assign({ essential: 100, core: 25, beast: 4 }, d.capacity);

          return d;

      }
    } catch (e) { /* fall through to seed */ }

    try { localStorage.setItem(DB_KEY, JSON.stringify(d)); }

/* ==========================================================================
   Dates and numbers
   ========================================================================== */
const pad = n => String(n).padStart(2, '0');
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayS() { return ymd(new Date()); }
function pd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); }
function diffDays(a, b) { return Math.round((pd(b) - pd(a)) / 86400000); }
function dowNum(s) { return (pd(s).getDay() + 6) % 7 + 1; }          // 1 = Mon ... 7 = Sun
function fmtDate(s) { return s ? pd(s).toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short', year:'numeric' }) : 'Not set'; }
function relDay(s) {
  if (!s) return 'Never';
  const n = diffDays(s, todayS());
  if (n === 0) return 'Today';
  if (n === 1) return 'Yesterday';
  if (n < 0) return fmtDate(s);
  return n + ' days ago';
}
function uid() { return 'id' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36); }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const clampNum = (v, max) => { const x = Math.round(parseFloat(v)); return isFinite(x) ? Math.max(0, Math.min(max, x)) : 0; };
const kgToLb = k => k * 2.20462;
const lbToKg = l => l / 2.20462;
const money = v => '$' + (Math.round(v * 100) / 100).toFixed(2).replace(/\.00$/, '');
const NUT = ['calories','protein','carbs','fat','fibre'];
const NUT_LABEL = { calories:'Calories', protein:'Protein', carbs:'Carbs', fat:'Fat', fibre:'Fibre' };
function nutFrom(v) {
  return { calories: clampNum(v.calories, 5000), protein: clampNum(v.protein, 500), carbs: clampNum(v.carbs, 800),
           fat: clampNum(v.fat, 400), fibre: clampNum(v.fibre, 200) };
}
function sumNut(list) {
  const t = { calories:0, protein:0, carbs:0, fat:0, fibre:0 };
  list.forEach(m => NUT.forEach(k => { t[k] += Number(m[k]) || 0; }));
  return t;
}
/* Colour rules: calories, carbs ±5% green, ±10% amber, beyond red.
   Protein and fibre: 95% or more green, 90% or more amber. Fat: 105% or less green, 110% or less amber. */
function tone(kind, val, target) {
  if (!target) return '';
  const p = val / target;
  if (kind === 'fat') return p <= 1.05 ? 'g' : p <= 1.10 ? 'a' : 'r';
  if (kind === 'protein' || kind === 'fibre') return p >= 0.95 ? 'g' : p >= 0.90 ? 'a' : 'r';
  const dev = Math.abs(p - 1);
  return dev <= 0.05 ? 'g' : dev <= 0.10 ? 'a' : 'r';
}
const TONE_TEXT = { g:'c-green', a:'c-amber', r:'c-red', '':'' };

    const day = schedule[DAYS[dowNum(date) - 1]];
    if (!day) continue;
    const recent = back <= 7;
    const exercises = day.ex.map((e, i) => {
      const [name, sets, reps, kg, unit] = e;

      return {

        sets: Array.from({ length: sets }, (_, j) => ({
          kg: kg == null ? null : (up ? kg + 2.5 : kg),
          reps: (!recent && j === sets - 1) ? reps - 1 : reps

  if (!key) return { ok:false, code:'no_key' };
  let r, data = {};
  try {
    r = await fetch('/api/demo-ai', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-demo-key': key },
      body: JSON.stringify(body)

    try { data = await r.json(); } catch (e) { data = {}; }

  const dots = pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="#2D6A4F"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weigh-in trend">
    <line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" stroke="#e2e9e0"/>
    <path d="${path}" fill="none" stroke="#52B788" stroke-width="3" stroke-linejoin="round"/>${dots}
    <text x="${P}" y="${H - 4}" font-size="11" fill="#5b6b60">${esc(fmtShort(wi[0].date))}</text>
    <text x="${W - P}" y="${H - 4}" font-size="11" fill="#5b6b60" text-anchor="end">${esc(fmtShort(wi[wi.length - 1].date))}</text>
    <text x="${P}" y="12" font-size="11" fill="#5b6b60">High ${max.toFixed(1)} ${unit}</text>

function keyOf(x) {
  return String(x || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(Boolean)
    .map(w => (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) ? w.slice(0, -1) : w).join(' ');
}
// "- Bench press 4x8 (heavy)" -> "Bench press"
function exerciseName(line) {
  return String(line || '').replace(/^\s*-\s*/, '')
    .replace(/\([^)]*\)|\[[^\]]*\]/g, ' ')
    .replace(/\b\d+\s*[x×]\s*\d+(\s*-\s*\d+)?\b/gi, ' ')
    .replace(/\b\d+(\s*-\s*\d+)?\s*(sets?|reps?|mins?|minutes?|secs?|seconds?|m|kg|lb|x)?\b/gi, ' ')
    .replace(/@\s*[\d.]+\s*(kg|lb)?/gi, ' ')
    .replace(/\s+/g, ' ').trim();
}
function findLibrary(line) {
  const lineKey = ' ' + keyOf(exerciseName(line)) + ' ';
  let best = null, bestLen = 0;
  EXERCISES.forEach(ex => [ex.n].concat(ex.a || []).forEach(alias => {
    const k = ' ' + keyOf(alias) + ' ';
    if (k.trim() && lineKey.includes(k) && k.length > bestLen) { best = ex; bestLen = k.length; }
  }));
  return best;
}

  if (c.tier === 'basic' && s === 'active') return `Basic. $2.50 a week, billed every 12 weeks. Next billing: ${fmtDate(c.nextBilling)}.`;

    return `Week ${weekOf(c)} of ${WEEKS}. Ends ${fmtDate(endDateOf(c))}. Weigh-in day: ${DAYS_FULL[DAYS.indexOf(c.ob.weighInDay)] || c.ob.weighInDay}.`;

function renderProgress(c, coach) {
  const wi = weighPoints(c);
  const unit = ui.unit;
  const unitBtns = `<div class="tabs" style="margin:0"><button class="tab ${unit === 'kg' ? 'on' : ''}" data-act="unit" data-u="kg">kg</button><button class="tab ${unit === 'lb' ? 'on' : ''}" data-act="unit" data-u="lb">lb</button></div>`;
  let stats = '<p class="muted">No weigh-ins yet.</p>';
  if (wi.length) {
    const first = wi[0].kg, last = wi[wi.length - 1].kg;
    const prev = wi.length > 1 ? wi[wi.length - 2].kg : null;
    const change = last - first;
    const pct = first ? (change / first * 100) : 0;
    const conv = v => unit === 'kg' ? v : kgToLb(v);
    const big = "font-family:'Bebas Neue',Impact,sans-serif;font-size:32px";
    stats = `<div class="grid3">
      <div class="note-box"><div class="mini">Latest weight</div><b style="${big}">${weightText(last, unit)}</b></div>
      <div class="note-box"><div class="mini">Change since start</div><b class="${change <= 0 ? 'c-green' : 'c-red'}" style="${big}">${conv(change).toFixed(1)} ${unit} (${pct.toFixed(1)}%)</b></div>
      <div class="note-box"><div class="mini">Change since last weigh-in</div><b style="${big}">${prev == null ? 'n/a' : conv(last - prev).toFixed(1) + ' ' + unit}</b></div>
    </div>`;
  }
  const logged = [];
  for (let i = 0; i < 7; i++) { const d = addDays(todayS(), -i); if (c.steps[d]) logged.push(c.steps[d]); }
  const stepsAvg = logged.length ? Math.round(logged.reduce((x, y) => x + y, 0) / logged.length) : null;
  const stepsCardHtml = `<div class="card"><h3>Steps</h3>
    <div class="metric"><div class="top"><span>Average per day, last 7 days</span><span><b>${stepsAvg == null ? 'Nothing logged yet' : fmtSteps(stepsAvg) + ' steps'}</b></span></div>
    ${c.targets && c.targets.steps && stepsAvg != null ? `<div class="bar"><span style="width:${Math.min(100, Math.round(stepsAvg / c.targets.steps * 100))}%;background:${STEPS_COLOUR}"></span></div><p class="mini" style="margin:6px 0 0">Target ${fmtSteps(c.targets.steps)} steps a day, based on ${logged.length} logged day${logged.length === 1 ? '' : 's'}.</p>` : ''}</div></div>`;
  const logDays = [];
  for (let i = 0; i < 7; i++) { const d = addDays(todayS(), -i); if ((c.logs[d] || []).length) logDays.push(sumNut(c.logs[d])); }
  const macroCard = logDays.length ? `<div class="card"><h3>Average per day, last 7 days</h3>
    <p class="mini" style="margin-top:0">Based on ${logDays.length} logged day${logDays.length === 1 ? '' : 's'}.</p>
    ${NUT.map(k => barHtml(k, Math.round(logDays.reduce((x, t) => x + t[k], 0) / logDays.length), c.targets ? c.targets[k] : null)).join('')}</div>` : '';
  const updateBtn = !coach && c.tier === 'basic'
    ? '<button class="btn-ghost btn-sm" data-act="updateTargets">Update my targets</button>' : '';
  let workoutsCard = '';
  if (c.tier !== 'basic') {
    const weekAgo = addDays(todayS(), -6);
    const wos = (c.workouts || []).filter(w => w.date >= weekAgo).sort((a, b) => a.date < b.date ? 1 : -1);
    const woList = wos.length ? wos.map(w => `<div class="meal"><div style="flex:1 1 220px"><b>${esc(w.what)}</b><div class="mini">${fmtDate(w.date)}${w.minutes ? ' · ' + w.minutes + ' min' : ''}${w.notes ? ' · ' + esc(w.notes) : ''}</div>${sessionSummary(w)}</div></div>`).join('')
      : '<p class="muted">No workouts in the last 7 days.</p>';
    workoutsCard = `<div class="card"><h3>Workouts in the last 7 days</h3>${woList}</div>`;
  }
  return `<div class="card"><div class="row"><h3 style="margin:0">Weight</h3>${unitBtns}</div>
      <div style="margin-top:12px">${stats}</div>${weighChart(wi, unit)}
      <div style="margin-top:10px">${updateBtn}</div></div>
    ${stepsCardHtml}
    ${macroCard}
    ${workoutsCard}`;
}

  const tabs = [['overview','Overview'],['onboarding','Onboarding'],['plan','Targets and plan'],['logs','Logs'],['progress','Progress'],['notes','Notes']];
  let body = '';
  if (ui.coachTab === 'overview') body = overviewHtml(c);
  else if (ui.coachTab === 'onboarding') body = onboardingAnswersHtml(c);
  else if (ui.coachTab === 'plan') body = planEditorHtml(c);
  else if (ui.coachTab === 'logs') body = logsHtml(c);
  else if (ui.coachTab === 'progress') body = renderProgress(c, true);
  else body = `<div class="card"><h3>Private notes</h3><p class="mini">Only you see these. Saved as you type.</p>
    <textarea data-inp="notes" style="min-height:160px">${esc(c.notes)}</textarea></div>`;
  return `<div class="row" style="margin-bottom:10px"><button class="btn-ghost btn-sm" data-act="backClients">‹ All clients</button></div>
    <section class="hero"><div class="row"><div>
      <h1>${esc(c.name)}</h1>
      <div class="muted">${esc(c.email)} · ${esc(c.ob.whatsapp || 'No WhatsApp')} · ${TIERS[c.tier].name}</div>
    </div><div>${statusPill(c.status)}</div></div></section>
    <nav class="tabs">${tabs.map(t => `<button class="tab ${ui.coachTab === t[0] ? 'on' : ''}" data-act="coachTab" data-tab="${t[0]}">${t[1]}</button>`).join('')}</nav>
    ${body}`;
}

/* ==========================================================================
   Coach: logs. Sessions with sets and reps, and highlights when weight or reps went up.
   ========================================================================== */
// Best set for an exercise: the heaviest set (most reps at that weight), or the most reps if no weight.
function bestSet(e) {
  if (!e || e.skipped || !e.sets || !e.sets.length) return null;
  const weighted = e.sets.filter(s => s.kg != null);
  if (!weighted.length) {
    const reps = Math.max(...e.sets.map(s => s.reps || 0));
    return reps > 0 ? { kg: null, reps } : null;
  }
  const kg = Math.max(...weighted.map(s => s.kg));
  const reps = Math.max(...weighted.filter(s => s.kg === kg).map(s => s.reps || 0));
  return { kg, reps };
}
// The last time this exercise was logged before the given date.
function previousBest(c, name, date) {
  const prior = (c.workouts || []).filter(w => w.session && w.date < date).sort((a, b) => a.date < b.date ? 1 : -1);
  for (const w of prior) {
    const e = w.session.exercises.find(x => x.name === name && !x.skipped);
    const b = bestSet(e);
    if (b) return b;
  }
  return null;
}
// Returns "+2.5 kg" or "+1 rep" when the exercise went up since it was last logged, otherwise null.
function progressNote(c, w, e) {
  const cur = bestSet(e);
  if (!cur) return null;
  const prev = previousBest(c, e.name, w.date);
  if (!prev) return null;
  if (cur.kg != null && prev.kg != null) {
    if (cur.kg > prev.kg) return '+' + (Math.round((cur.kg - prev.kg) * 10) / 10) + ' kg';
    if (cur.kg === prev.kg && cur.reps > prev.reps) return '+' + (cur.reps - prev.reps) + ' reps';
    return null;
  }
  if (cur.kg == null && prev.kg == null && cur.reps > prev.reps) return '+' + (cur.reps - prev.reps) + ' reps';
  return null;
}
function coachSessionHtml(c, w) {
  const rows = w.session.exercises.map(e => {
    if (e.skipped) return `<div class="log-ex"><b>${esc(e.name)}</b> <span class="mini">skipped</span></div>`;
    const sets = e.sets.map(s => {
      const kg = s.kg != null ? (ui.unit === 'kg' ? (Math.round(s.kg * 10) / 10) + ' kg' : (Math.round(kgToLb(s.kg) * 10) / 10) + ' lb') + ' x ' : '';
      return kg + (s.reps != null ? s.reps + (e.unit === 'sec' ? ' sec' : '') : '-');
    });
    const note = progressNote(c, w, e);
    return `<div class="log-ex"><b>${esc(e.name)}</b> ${note ? `<span class="up-badge">Up ${esc(note)}</span>` : ''}
      <div class="mini">${esc(sets.join(', ') || 'no sets')}</div></div>`;
  }).join('');
  return `<div style="margin:6px 0 10px"><div><b>${esc(w.what)}</b></div>${rows}${w.notes ? `<div class="mini">${esc(w.notes)}</div>` : ''}</div>`;
}
function logsHtml(c) {
  const t = c.targets;
  const days = [];
  for (let i = 0; i < 21; i++) days.push(addDays(todayS(), -i));
  return `<div class="card"><h3>Last 21 days</h3><p class="mini" style="margin-top:0">Newest first. Tap a day to open it. <span class="up-badge">Up</span> marks a lift that went up since it was last logged.</p>
    ${days.map((date, idx) => {
      const meals = c.logs[date] || [];
      const tot = sumNut(meals);
      const wos = (c.workouts || []).filter(w => w.date === date);
      const wi = c.weighIns.find(w => w.date === date);
      const steps = c.steps[date];
      const calOver = t && tot.calories > t.calories, proOver = t && tot.protein > t.protein;
      const summary = `<summary><span>${fmtDate(date)}</span>
        <span class="mini" style="font-weight:400;margin-left:8px">${meals.length ? `<span style="color:${macroInk('calories', tot.calories, t && t.calories)}">${tot.calories} kcal${calOver ? ' (over)' : ''}</span> · <span style="color:${macroInk('protein', tot.protein, t && t.protein)}">P ${tot.protein}g${proOver ? ' (over)' : ''}</span> · ${meals.length} meal${meals.length === 1 ? '' : 's'}` : 'No meals logged'}
        · ${steps ? fmtSteps(steps) + ' steps' : 'No steps'} · ${wos.length ? wos.length + ' workout' + (wos.length === 1 ? '' : 's') : 'No workout'} · ${wi ? weightText(wi.kg, 'kg') : 'No weigh-in'}</span></summary>`;
      const body = meals.length ? meals.map(m => `<div class="meal" style="padding:8px 0">
          <div style="flex:1 1 200px"><span class="mini">${esc(m.time || '')}</span> <b>${esc(m.name)}</b> <span class="mini">${esc(sourceLabel(m))}</span>
          <div class="mini">${m.calories} kcal · P ${m.protein}g · C ${m.carbs}g · F ${m.fat}g · Fibre ${m.fibre}g</div>
          ${m.edited && m.ai ? `<div class="edited">Changed by client. Beast AI said ${m.ai.calories} kcal, P ${m.ai.protein}g.</div>` : ''}</div></div>`).join('')
        : '<p class="mini">No meals logged.</p>';
      const woTxt = wos.map(w => w.session ? coachSessionHtml(c, w)
        : `<div class="mini">Other activity: ${esc(w.what)}${w.minutes ? ' (' + w.minutes + ' min)' : ''}${w.notes ? ' · ' + esc(w.notes) : ''}</div>`).join('');
      return `<details ${idx === 0 ? 'open' : ''}>${summary}<div style="padding:4px 0 6px">${body}${woTxt}</div></details>`;
    }).join('')}
  </div>`;
}

/* --- Meal Builder --- */
function resizeToJpeg(file, max) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * s); canvas.height = Math.round(img.height * s);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}
ACT.build = async () => {
  const c = clientById(ui.clientId);
  const fileEl = document.getElementById('fridgeFile');
  const file = fileEl && fileEl.files && fileEl.files[0];
  let have = (ui.bText || '').trim();
  if (file) {
    if (file.size > 12 * 1024 * 1024) { toast('That photo is too large. Try a smaller one.'); return; }
    toast('Looking in your fridge...');
    try {
      const b64 = await resizeToJpeg(file, 1280);
      if (b64.length > 2800000) { toast('That photo is too large after resizing.'); return; }
      const res = await askAI({ mode: 'fridge', image: { type: 'image/jpeg', data: b64 } });
      if (res.ok) {
        const items = (res.data.items || []).map(i => typeof i === 'string' ? i : (i && i.name) || '').filter(Boolean);
        have = [items.join(', '), have].filter(Boolean).join(', ');
        ui.bText = have;
      } else { aiFail(res); }
    } catch (e) { toast('That photo could not be read. Type what you have instead.'); }
  }
  if (!have) { toast('Add a photo or type what you have.'); return; }
  const t = c.targets;
  const eaten = totalsFor(c, ui.clientDay > todayS() ? todayS() : ui.clientDay);
  const body = { mode: 'create', have: have.slice(0, 600), meal: ui.bMeal, effort: ui.bEffort };
  if (t) body.targets = {
    calories: Math.min(900, Math.max(0, t.calories - eaten.calories)),
    protein: Math.min(60, Math.max(0, t.protein - eaten.protein)),
    fibre: Math.max(0, t.fibre - eaten.fibre)
  };
  toast('Thinking up meals...');
  const res = await askAI(body);
  if (!res.ok) { aiFail(res); ui.buildResults = null; saveUi(); render(); return; }
  const list = (res.data.meals || []).map(m => ({
    name: String(m.name || 'Meal').slice(0, 80),
    text: [].concat(m.uses || [], m.pantry || []).join(', '),
    steps: Array.isArray(m.steps) ? m.steps.slice(0, 8) : [],
    tip: String(m.tip || '').slice(0, 200),
    offTarget: !!m.offTarget,
    calories: clampNum(m.calories, 5000), protein: clampNum(m.protein, 500), carbs: clampNum(m.carbs, 800),
    fat: clampNum(m.fat, 400), fibre: clampNum(m.fibre, 200)
  }));
  ui.buildResults = list.length ? list : null;
  if (!list.length) toast('No meals came back. Try again or enter the numbers yourself.');
  saveUi(); render();
};

function parseLines(text) {
  return text.split('\n').map(s => s.trim()).filter(Boolean).map((line, i) => {
    const idx = line.indexOf(':');
    if (idx > 0) return { label: line.slice(0, idx).trim().slice(0, 40), text: line.slice(idx + 1).trim().slice(0, 300) };
    return { label: 'Meal ' + (i + 1), text: line.slice(0, 300) };
  });
}
function zeroMeal(p) { return Object.assign({ label: p.label, text: p.text }, { calories:0, protein:0, carbs:0, fat:0, fibre:0 }); }
ACT.calcDay = async el => {
  const c = clientById(ui.coachClientId);
  const d = Number(el.dataset.d);
  const lines = c.plan.mealDraft[d].lines.split('\n').map(s => s.trim()).filter(Boolean);
  if (!lines.length) { toast('Type the meals first, one per line.'); return; }
  toast('Calculating...');
  const res = await askAI({ mode: 'day', text: lines.join('\n').slice(0, 2000) });
  if (res.ok && Array.isArray(res.data.meals) && res.data.meals.length === lines.length) {
    const meals = res.data.meals.map((m, i) => Object.assign({ label: String(m.label || parseLines(lines[i])[0].label), text: String(m.text || parseLines(lines[i])[0].text) },
      nutFrom(m)));
    c.plan.mealDraft[d] = { lines: c.plan.mealDraft[d].lines, meals };
    persist(); render(); toast('Numbers calculated. Check them before you publish.');
    return;
  }
  if (!res.ok) aiFail(res); else toast('Beast AI returned a different number of meals. Check the numbers by hand.');
  c.plan.mealDraft[d] = { lines: c.plan.mealDraft[d].lines, meals: parseLines(lines.join('\n')).map(zeroMeal) };
  persist(); render();
};
ACT.addRow = el => {
  const c = clientById(ui.coachClientId);
  const d = Number(el.dataset.d);
  c.plan.mealDraft[d].meals.push({ label: 'Meal', text: '', calories:0, protein:0, carbs:0, fat:0, fibre:0 });
  persist(); render();
};
ACT.delRow = el => {
  const c = clientById(ui.coachClientId);
  const d = ui.coachPlanDay;
  c.plan.mealDraft[d].meals.splice(Number(el.dataset.i), 1);
  persist(); render();
};
CH.row = el => {
  const c = clientById(ui.coachClientId);
  const d = ui.coachPlanDay;
  const meal = c.plan.mealDraft[d].meals[Number(el.dataset.i)];
  if (!meal) return;
  const f = el.dataset.f;
  if (f === 'label' || f === 'text') meal[f] = el.value.slice(0, f === 'label' ? 40 : 300);
  else meal[f] = clampNum(el.value, f === 'calories' ? 5000 : 500);
  c.plan.mealDraft[d].lines = c.plan.mealDraft[d].meals.map(m => m.label + ': ' + m.text).join('\n');
  persist(); render();
};
ACT.copyDay = el => {
  const c = clientById(ui.coachClientId);
  const from = Number(el.dataset.d);
  const to = document.getElementById('copyTo').value;
  const targets = to === 'all' ? DAYS.map((x, i) => i + 1).filter(n => n !== from) : [Number(to)];
  const source = c.plan.mealDraft[from];
  const overwrite = targets.some(n => c.plan.mealDraft[n].meals.length);
  if (overwrite && !confirm('This replaces the meals already on the chosen day(s). Continue?')) return;
  targets.forEach(n => {
    c.plan.mealDraft[n] = { lines: source.lines, meals: JSON.parse(JSON.stringify(source.meals)) };
  });
  persist(); render(); toast('Copied.');
};
ACT.trainStart = () => {
  const c = clientById(ui.coachClientId);
  const lines = c.plan.trainDraft ? c.plan.trainDraft.split('\n') : [];
  DAYS.forEach((d, i) => {
    if (!c.ob.trainingDays.includes(d)) return;
    if (!lines.some(l => l.trim().startsWith(d))) lines.push(d + ': ');
  });
  c.plan.trainDraft = lines.filter((l, i, arr) => l.trim() !== '' || i < arr.length - 1).join('\n');
  persist(); render();
};
ACT.publish = () => {
  const c = clientById(ui.coachClientId);
  c.plan.mealPublished = JSON.parse(JSON.stringify(draftMeals(c)));
  c.plan.trainPublished = c.plan.trainDraft;
  c.plan.publishedAt = new Date().toISOString();
  persist(); render(); toast('Published to the client.');
};

/* ==========================================================================
   Event wiring (one delegated listener each)
   ========================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
const OB_SEL = '#onboardForm [data-ob], #onboardForm [data-obgrp], #onboardForm [data-health]';
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.woskip !== undefined) {
    ui.wo.ex[Number(el.dataset.woskip)].skipped = el.checked; saveUi(); render(); return;
  }
  if (el.dataset && el.dataset.ch === 'viewAs') {
    const v = el.value;
    if (v === 'coach') { ui.view = 'coach'; ui.coachClientId = null; }
    else if (v === 'new') { ui.view = 'new'; ui.newStep = 'plans'; }
    else if (v.startsWith('client:')) { ui.view = 'client'; ui.clientId = v.slice(7); ui.clientTab = 'today'; ui.clientDay = todayS(); ui.editId = null; }
    saveUi(); render(); window.scrollTo(0, 0);
    return;
  }
  if (el.dataset && el.dataset.ch && CH[el.dataset.ch]) { CH[el.dataset.ch](el, e); return; }
  if (el.dataset && el.dataset.ui) { ui[el.dataset.ui] = el.value; saveUi(); return; }
  if (el.matches && el.matches(OB_SEL)) handleObInput(el);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.wo) { woInput(el); return; }
  if (el.dataset && el.dataset.ui) { ui[el.dataset.ui] = el.value; saveUi(); return; }
  if (el.dataset && el.dataset.inp && INP[el.dataset.inp]) { INP[el.dataset.inp](el, e); return; }
  if (el.matches && el.matches(OB_SEL)) handleObInput(el);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('#nc-name, #nc-email')) {
    const btn = document.querySelector('[data-act="pay"]');
    if (btn) btn.click();
  }
});

function handleObInput(el) {
  const c = clientById(ui.clientId);
  if (!c) return;
  const ob = c.ob;
  if (el.dataset.health) {
    ob.health[el.dataset.health] = el.value;
    const anyYes = Object.values(ob.health).some(v => v === 'yes');
    document.getElementById('clearWrap').hidden = !anyYes;
    document.getElementById('otherWrap').hidden = ob.health.other !== 'yes';
    clearObErr('health');
    persist();
    return;
  }
  if (el.dataset.obgrp) {
    const k = el.dataset.obgrp;
    const set = new Set(ob[k]);
    if (el.checked) set.add(el.value); else set.delete(el.value);
    ob[k] = Array.from(set);
    clearObErr(k);
    persist();
    return;
  }
  const k = el.dataset.ob;
  if (el.type === 'checkbox') ob[k] = el.checked;
  else if (el.type === 'radio') { if (el.checked) ob[k] = el.value; }
  else ob[k] = el.value;
  persist();
  if (k === 'heightUnit') { render(); return; }            // swaps the height inputs; answers are kept
  if (k === 'heightFt' || k === 'heightIn') { clearObErr('heightCm'); return; }
  if (k === 'weightUnit' || k === 'weight') { clearObErr('weight'); return; }
  clearObErr(k);
}

/* ==========================================================================
   Boot
   ========================================================================== */
db = Store.load();
initUi();
if (ui.view === 'client' && !clientById(ui.clientId)) { ui.view = 'coach'; ui.clientId = null; }
ui.clientDay = ui.clientDay > todayS() ? todayS() : ui.clientDay;
saveUi();
render();
</script>
</body>
</html>
