<!doctype html>
<!--
  REAL SITE NOTE (no change in the demo):
  In the real site, a "My Coach" tile appears on the logged-in Dashboard only for accounts with
  a coaching plan, and it opens this client screen. In this demo, the "View as" menu stands in
  for that tile: pick Coach (Stefan), a client, or New client.
-->
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coaching demo | Beast Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/brand.css">
<style>
/* Coaching demo: the client portal, in the brand look. Tokens and the logged-in classes come from /brand.css (docs/BRAND.md, "Logged-in side"). */
body{margin:0;padding-top:0;background:var(--ground);color:var(--ink-soft);font-family:var(--body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
h1,h2,h3,.disp{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:0;color:var(--ink);margin:0;line-height:.92}
h1{font-size:clamp(40px,11vw,56px)}
h2{font-size:clamp(36px,5vw,52px);line-height:1}
h3{font-size:26px;line-height:1;margin-bottom:12px}
h4{font-family:var(--body);font-weight:700;text-transform:none;font-size:18px;line-height:1.3;margin:18px 0 6px;color:var(--ink)}
p{margin:0 0 10px;overflow-wrap:anywhere}
a{color:var(--lime)}a:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:24px 24px 64px;box-sizing:border-box}
.muted{color:var(--muted)}
.mini{font-size:15px;color:var(--muted);overflow-wrap:anywhere}
.fine{font-size:15px;color:var(--muted)}
.eyebrow{font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--lime);margin:0 0 8px}
.lede{font-size:16px;color:var(--ink-soft);margin:0 0 12px}
.grid2{display:grid;gap:12px;grid-template-columns:1fr}
.grid3{display:grid;gap:12px;grid-template-columns:1fr}
.grid5{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}.grid5{grid-template-columns:repeat(5,1fr)}}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack>*+*{margin-top:10px}
.hidden,[hidden]{display:none !important}
/* Header: the ring logo and wordmark, then the demo's own controls (View as, Beast AI, Reset demo) */
.demo-bar{background:var(--ground);border-bottom:1px solid var(--line);color:var(--ink-soft);padding:14px 24px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
@media(min-width:900px){.demo-bar{position:sticky;top:0;z-index:50}}
.demo-bar .brand-mark{min-height:44px}
.demo-bar .brand-word{font-size:22px}
.tag{display:inline-flex;align-items:center;min-height:28px;padding:4px 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface-raised);color:var(--lime);font:700 12px/1 var(--body);letter-spacing:2px;text-transform:uppercase}
.demo-bar select{width:auto;min-width:230px;max-width:100%;min-height:48px}
.demo-bar .note{font-size:15px;color:var(--muted);flex:1 1 260px}
.ai{font-size:15px;font-weight:700;border-radius:999px;padding:4px 12px;border:1px solid var(--line-strong);background:var(--surface-raised);color:var(--ink-soft);white-space:nowrap;line-height:1.2}
.ai.on{border-color:var(--lime);color:var(--lime)}
.ai.off{border-color:var(--amber);color:var(--ink)}
/* Form controls: raised surface, line-strong border, lime focus ring */
select,input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface-raised);border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px;width:100%;max-width:100%;min-height:48px;box-sizing:border-box}
select option{color:var(--ink);background:var(--surface-raised)}
select:focus,input:focus,textarea:focus{outline:2px solid var(--lime);outline-offset:1px;border-color:var(--lime)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
textarea{min-height:92px;resize:vertical}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;margin:0;padding:0;flex:none;accent-color:var(--lime)}
label{display:block;font-weight:700;font-size:15px;color:var(--ink);margin-bottom:8px}
.field{margin-bottom:14px}
.field.inline label{display:inline}
/* Errors: the message text stays ink, with a small error-coloured "!" in front. A field in error gets a 1px error border. */
.err,.ob-msg,.error-text,.msg{color:var(--ink);font-size:15px;margin-top:6px}
.err:empty,.ob-msg:empty{display:none}
.err:not(:empty)::before,.ob-msg:not(:empty)::before,.error-text::before,.hl-red::before{content:"!";display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--error);color:var(--ground);font:800 13px/18px var(--body);text-align:center;margin-right:8px;vertical-align:1px}
.ob-msg{font-weight:700;margin:4px 0 12px}
.invalid,.field-error{border-color:var(--error) !important}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;border:2px solid var(--line-strong);border-radius:999px;padding:8px 16px;background:var(--surface-raised);cursor:pointer;font-size:15px;font-weight:600;color:var(--ink);margin:0}
.chip:has(input:checked){border-color:var(--lime);color:var(--ink)}
.check{display:flex;gap:12px;align-items:flex-start;font-weight:600;font-size:15px;color:var(--ink-soft);margin:0 0 10px;cursor:pointer;min-height:44px}
.check input{margin-top:3px}
.check a{padding:12px 2px}
.hint{font-size:15px;color:var(--muted);margin:6px 0 0}
/* Buttons: pills, 44px and taller. Primary is lime, ghost and danger are outline, the link is text. */
button,.btn{font:inherit;font-size:16px;font-weight:700;line-height:1.2;min-height:52px;padding:14px 26px;border:2px solid var(--lime);border-radius:999px;background:var(--lime);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center;white-space:normal;cursor:pointer;box-sizing:border-box;max-width:100%}
button:hover:not(:disabled),.btn:hover{filter:brightness(1.06)}
button:disabled{opacity:.5;cursor:not-allowed}
.btn-amber,.btn-green{background:var(--lime);border-color:var(--lime);color:var(--on-accent)}
.btn-ghost,.btn-danger{background:transparent;color:var(--ink);border:2px solid var(--line-strong)}
.btn-ghost:hover,.btn-danger:hover{background:transparent;color:var(--lime);border-color:var(--lime);filter:none}
.btn-sm{min-height:44px;padding:10px 18px;font-size:15px}
.btn-link{background:none;border:0;color:var(--lime);padding:0 4px;min-height:44px;text-decoration:underline;font-weight:700;font-size:16px;text-align:left}
.btn-link:hover{background:none;color:var(--ink);filter:none}
/* Tabs: lime underline on the active tab */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto}
.tab{flex:none;min-height:48px;padding:0 12px;background:none;border:0;border-bottom:3px solid transparent;border-radius:0;margin-bottom:-1px;color:var(--muted);font:700 15px/1 var(--body);white-space:nowrap;cursor:pointer;filter:none}
.tab:hover{color:var(--ink);background:none;filter:none}
.tab.on,.tab.is-active,.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lime)}
.tab.dot::after{content:" \2022";color:var(--lime)}
.day-row{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
.day-row .tab{padding:0 10px}
/* Segmented choices (the same look as my-coach) */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-raised);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:14px}
.seg.one{grid-template-columns:1fr}
.seg button{background:transparent;border:0;color:var(--ink-soft);font-size:15px;font-weight:700;padding:8px 6px;min-height:44px;border-radius:999px;white-space:normal;line-height:1.15;filter:none}
.seg button:hover{background:var(--surface);color:var(--ink);filter:none}
.seg button.on{background:var(--ink);color:var(--on-accent)}
/* Cards and panels: surface, 1px line, 20px radius (panels 28px). No drop shadows. */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px;margin-bottom:14px}
.card h3{margin-bottom:12px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:26px 22px;margin-bottom:14px}
.hero h1{color:var(--ink)}
.hero .muted{color:var(--muted)}
.hero .eyebrow{color:var(--lime)}
.hero .progress{margin-top:14px}
.checkin-card,.add-card{border:2px solid var(--lime)}
.checkin-card h3{margin:2px 0 0}
.plan-card{display:flex;flex-direction:column;gap:8px}
.plans{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.price{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:52px;line-height:1;color:var(--ink)}
.add-card .lede{margin:0 0 12px}
.plan-inputs{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px 20px;margin-bottom:16px}
.pi-grid{display:grid;gap:18px 26px;grid-template-columns:1fr;margin-top:14px}
@media(min-width:760px){.pi-grid{grid-template-columns:repeat(3,1fr)}}
.pi-sec h4{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:24px;line-height:1;margin:0 0 8px;color:var(--ink)}
.pi-sec p{margin:0 0 6px;font-size:15px}
/* Notes and highlights: raised surface with a 1px line, 20px radius */
.note-box,.ro-note,.cust-note{background:var(--surface-raised);border:1px solid var(--line);border-radius:20px;padding:14px 16px;font-size:15px;color:var(--ink-soft);margin-bottom:10px}
.hl-amber{background:var(--surface-raised);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:20px;padding:14px 16px;margin-bottom:10px;color:var(--ink-soft)}
.hl-red{background:var(--surface-raised);border:1px solid var(--line-strong);border-radius:20px;padding:14px 16px;margin-bottom:10px;color:var(--ink)}
.banner{background:var(--surface-raised);border:1px solid var(--line);border-left:4px solid var(--lime);border-radius:20px;padding:14px 16px;margin-bottom:14px;font-weight:700;color:var(--ink)}
/* Tags and status pills */
.pill,.late{display:inline-block;align-items:center;min-height:32px;padding:4px 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface-raised);color:var(--ink-soft);font-size:15px;font-weight:700;line-height:1.1;white-space:nowrap}
.pill.p-active{border-color:var(--lime);color:var(--lime)}
.pill.p-awaiting{border-color:var(--amber);color:var(--ink)}
.late{margin-left:8px;border-color:var(--amber);color:var(--ink);min-height:28px;padding:2px 12px}
.need{display:inline-flex;align-items:center;min-height:32px;padding:4px 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface-raised);color:var(--ink);font-size:15px;font-weight:700;line-height:1.1;margin:2px 6px 2px 0}
.need--urgent{border-color:var(--amber)}
.pi-tag{display:inline-flex;align-items:center;min-height:32px;padding:4px 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface-raised);color:var(--ink-soft);font-size:15px;font-weight:700;margin:0 6px 6px 0}
.pi-tag.day{border-color:var(--lime);color:var(--lime)}
.edited,.tz-flag{font-size:15px;color:var(--ink);background:var(--surface-raised);border:1px solid var(--line-strong);border-radius:999px;padding:4px 12px;display:inline-block;margin-top:5px}
.up-badge{display:inline-block;background:var(--lime);color:var(--on-accent);border:1px solid var(--lime);border-radius:999px;padding:2px 10px;font-size:15px;font-weight:700;margin-left:4px}
.mchip{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--ink)}
.mchip i{width:12px;height:12px;border-radius:50%;background:var(--mc);display:inline-block;flex:none}
.ok-yes{color:var(--lime);font-weight:700}
.ok-no{color:var(--muted)}
.c-green{color:var(--lime)}
.c-amber,.c-red{color:var(--amber)}
.status-line{font-weight:700;font-size:17px;color:var(--ink)}
/* Progress bars: lime when on target, amber (is-off) when well over or under */
.progress,.bar{height:10px;border-radius:999px;background:var(--surface-raised);overflow:hidden;margin-top:10px}
.progress>span,.bar>span,.progress__fill{display:block;height:100%;border-radius:999px;background:var(--lime)}
.progress__fill.is-off,.progress>span.is-off,.bar>span.is-off,.bar>span.a,.bar>span.r{background:var(--amber)}
.metric{margin-bottom:14px}
.metric .top{display:flex;justify-content:space-between;gap:8px;font-size:15px;margin-bottom:4px;flex-wrap:wrap;color:var(--ink-soft)}
.metric .top b{color:var(--ink)}
.cap-nums{display:flex;gap:24px;margin:6px 0 14px}
.cap-nums b{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:44px;line-height:1;display:block;color:var(--ink)}
.cap-nums span{font-size:15px;color:var(--muted)}
.target-row{display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.target-row:last-child{border-bottom:0}
.target-row b{color:var(--ink)}
.target-val{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:40px;line-height:1;white-space:nowrap;color:var(--ink)}
.target-val small{font-family:var(--body);font-size:16px;font-weight:700;text-transform:none;color:var(--muted)}
/* Tables and lists */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--lime);background:var(--surface-raised)}
td input,td select{padding:9px 10px;font-size:16px}
td.num input{width:84px}
/* Tables scroll sideways inside their card on phones instead of squeezing their cells */
.table-wrap table{min-width:560px}
.table-wrap .tag-pill,.table-wrap .pill{white-space:nowrap}
.meal{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start;flex-wrap:wrap}
.meal:last-child{border-bottom:0}
.meal b{color:var(--ink)}
.meal .kcal{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:28px;line-height:1;white-space:nowrap;color:var(--ink)}
.kcal{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:28px;line-height:1;white-space:nowrap;color:var(--ink)}
.meal .acts,.acts{display:flex;gap:6px;flex-wrap:wrap}
.meal-edit{display:grid;gap:8px;grid-template-columns:repeat(2,1fr);width:100%}
.meal-edit .wide{grid-column:1/-1}
@media(min-width:700px){.meal-edit{grid-template-columns:repeat(6,1fr)}.meal-edit .wide{grid-column:span 2}}
.dl{display:grid;grid-template-columns:1fr;gap:2px 14px}
.dl dt{font-size:15px;font-weight:700;color:var(--muted);margin-top:10px}
.dl dd{margin:0 0 4px;font-size:15px;color:var(--ink-soft)}
@media(min-width:700px){.dl{grid-template-columns:200px 1fr}.dl dt{margin-top:9px}}
.list-clean{margin:6px 0 0;padding-left:18px}
.ex-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:44px}
.ex-row span{font-weight:700;color:var(--ink)}
.pt-line{padding:7px 0;font-weight:700;color:var(--ink)}
.pt-gap{height:8px}
.wo-set{display:grid;grid-template-columns:40px 1fr 1fr auto;gap:8px;align-items:center;margin-top:6px}
.wo-set input{padding:8px 10px}
.wo-head{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--lime)}
.log-ex{padding:4px 0}
.filters{display:grid;gap:10px;grid-template-columns:1fr;margin:8px 0 14px}
@media(min-width:900px){.filters{grid-template-columns:2fr 1fr 1fr 1fr}}
.filters label{font-size:15px;color:var(--ink);margin-bottom:8px}
.cust-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.ob-nav{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:4px 0 24px}
@media(max-width:699px){.ob-nav{flex-direction:column-reverse}.ob-nav button,.ob-nav .btn-ghost{width:100%}.ob-nav span{display:none}}
.add-card .seg{margin-top:4px}
/* Chart and details */
.chart{width:100%;max-width:440px;height:auto;display:block;margin:10px 0}
.chart text{fill:var(--muted);font-family:var(--body)}
.chart line{stroke:var(--line)}
details{margin-bottom:10px}
summary{cursor:pointer;font-weight:700;padding:8px 0;min-height:44px;display:flex;align-items:center;color:var(--ink);list-style:none}
summary::-webkit-details-marker{display:none}
.sr{position:absolute;left:-9999px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--surface-raised);color:var(--ink);border:1px solid var(--line-strong);padding:14px 20px;border-radius:20px;z-index:99;display:none;max-width:92vw;font-size:15px;font-weight:600;text-align:center}
.toast.show{display:block}
body.shot #demoBar,body.shot .toast{display:none !important}
/* Sheet: the exercise guide */
.sheet-back{position:fixed;inset:0;background:rgba(11,12,10,.72);z-index:95}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:22px 20px 28px;z-index:96;color:var(--ink-soft)}
@media(min-width:700px){.sheet{left:50%;transform:translateX(-50%);width:620px;max-width:92vw;border-radius:28px;bottom:24px}}
@media(max-width:699px){.sheet{top:0;bottom:0;max-height:none;border-radius:0}}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:6px}
.sheet h4{font-family:var(--body);font-weight:700;text-transform:none;font-size:18px;margin:18px 0 6px;color:var(--ink);letter-spacing:0}
.sheet p{margin:0 0 6px;font-size:16px}
.sheet ol,.sheet ul{padding-left:22px;margin:0}
.sheet li{margin:6px 0;font-size:16px}
</style>

<body>
<header class="demo-bar" id="demoBar"></header>
<main class="wrap" id="app"></main>
<div id="sheetRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<datalist id="tzList"></datalist>

<script src="/basic-targets.js"></script>
<script>
'use strict';

/* ==========================================================================
   Constants
   ========================================================================== */
// Bumped with the customer records, so older saved demo data is replaced by the new seeds.
const DB_KEY = 'bc_demo_v5';
const UI_KEY = 'bc_demo_ui2';
const DEMO_KEY_NAME = 'bc_demo_key';
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAYS_FULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const WEEKS = 12;
const PAUSE_MAX = 14;
const CAP_TIERS = ['essential','core','beast'];          // capped: coach places
const COACHED = ['essential','core','beast'];              // 12-week coaching plans
const TIERS = {
  basic: { name:'Basic', price:30, big:'$2.50', bigNote:'a week', short:'$2.50 a week, $30 billed every 12 weeks', recur:true, unlimited:true,
    desc:'Self-run. Beast AI meal logging, daily steps, your weekly weigh-in and targets worked out for you. No coach, no plans, no calls.' },
  essential: { name:'Essential', price:110, big:'$110', bigNote:'for 12 weeks', short:'$110 for 12 weeks', recur:true,
    desc:'A meal and training plan built from your onboarding answers, with a coach behind it.' },
  core: { name:'Core', price:299, big:'$299', bigNote:'for 12 weeks', short:'$299 for 12 weeks', recur:true,
    desc:'12 weeks of coaching with your meal and training plans, weekly check-ins, and Stefan reviews the sets and reps you log.' },
  beast: { name:'The Beast', price:699, big:'$699', bigNote:'for 12 weeks', short:'$699 for 12 weeks', recur:true,
    desc:'12 weeks of close, hands-on coaching in our smallest group. Our most supported option.' }
};

/* Time zones. The client types a city or a zone. A known one sets their "today" and weigh-in day.
   Anything else falls back to Australia/Melbourne and is flagged in the coach view. */
const DEFAULT_TZ = 'Australia/Melbourne';
const TZ_CITIES = [
  ['Melbourne','Australia/Melbourne'], ['Sydney','Australia/Sydney'], ['Brisbane','Australia/Brisbane'],
  ['Adelaide','Australia/Adelaide'], ['Perth','Australia/Perth'], ['Hobart','Australia/Hobart'], ['Darwin','Australia/Darwin'],
  ['Auckland','Pacific/Auckland'], ['London','Europe/London'], ['Dublin','Europe/Dublin'], ['Paris','Europe/Paris'],
  ['Berlin','Europe/Berlin'], ['Johannesburg','Africa/Johannesburg'], ['Dubai','Asia/Dubai'], ['Singapore','Asia/Singapore'],

});

// Returns the zone for what the client typed, or null if it is not a known zone or city.
function resolveTimeZone(text) {
  const key = String(text || '').trim().toLowerCase().replace(/\s+/g, ' ');
  if (!key) return null;
  const first = key.split(',')[0].trim();                      // "Melbourne, Australia" -> "melbourne"
  return TZ_BY_NAME[key] || TZ_BY_NAME[first] || TZ_BY_NAME[first.replace(/ /g, '_')] || null;
}

function zoneFor(c) { return (c && c.ob && resolveTimeZone(c.ob.timezone)) || DEFAULT_TZ; }

function weighsOn(start, dayName, kgs) {

  let d = start;
  while (d < t && out.length < kgs.length) {
    if (DAYS[dowNum(d) - 1] === dayName) out.push(d);
    d = addDays(d, 1);
  }
  return out.map((date, i) => ({ date, kg: kgs[i] }));

function weighsBack(today, start, dayName, kgs) {
  const days = [];
  let d = addDays(today, -1);
  while (d >= start && days.length < kgs.length) {
    if (DAYS[dowNum(d) - 1] === dayName) days.push(d);
    d = addDays(d, -1);
  }
  return days.reverse().map((date, i) => ({ date, kg: kgs[kgs.length - days.length + i] }));
}

function seedWorkouts(t, schedule) {
  const out = [];

    const date = addDays(t, -back);
    const day = schedule[DAYS[dowNum(date) - 1]];
    if (!day) continue;
    const recent = back <= 7;
    const exercises = day.ex.map((e, i) => {
      const [name, sets, reps, kg, unit] = e;
      const up = recent && i % 2 === 0 && kg != null;
      return {
        name, planned: sets + 'x' + reps + (unit ? ' ' + unit : ''), skipped: false,
        sets: Array.from({ length: sets }, (_, j) => ({
          kg: kg == null ? null : (up ? kg + 2.5 : kg),
          reps: (!recent && j === sets - 1) ? reps - 1 : reps
        }))

function keyOf(x) {
  return String(x || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(Boolean)
    .map(w => (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) ? w.slice(0, -1) : w).join(' ');
}
// "- Bench press 4x8 (heavy)" -> "Bench press"
function exerciseName(line) {
  return String(line || '').replace(/^\s*-\s*/, '')
    .replace(/\([^)]*\)|\[[^\]]*\]/g, ' ')
    .replace(/\b\d+\s*[x×]\s*\d+(\s*-\s*\d+)?\b/gi, ' ')
    .replace(/\b\d+(\s*-\s*\d+)?\s*(sets?|reps?|mins?|minutes?|secs?|seconds?|m|kg|lb|x)?\b/gi, ' ')
    .replace(/@\s*[\d.]+\s*(kg|lb)?/gi, ' ')
    .replace(/\s+/g, ' ').trim();
}
function findLibrary(line) {
  const lineKey = ' ' + keyOf(exerciseName(line)) + ' ';
  let best = null, bestLen = 0;
  EXERCISES.forEach(ex => [ex.n].concat(ex.a || []).forEach(alias => {
    const k = ' ' + keyOf(alias) + ' ';
    if (k.trim() && lineKey.includes(k) && k.length > bestLen) { best = ex; bestLen = k.length; }
  }));
  return best;
}
function cleanGuide(d, name) {
  const list = (x, n, len) => Array.isArray(x) ? x.map(i => String(i).trim().slice(0, len)).filter(Boolean).slice(0, n) : [];
  return { n: String(d.name || name).slice(0, 80), w: String(d.works || '').slice(0, 300), s: list(d.steps, 5, 200),
    t: list(d.tips, 3, 200), m: list(d.mistakes, 3, 200), e: String(d.easier || '').slice(0, 300), ai: true };
}

async function openExercise(line) {
  const name = exerciseName(line) || String(line || '').trim();
  const lib = findLibrary(line);
  if (lib) return showSheet(lib);
  const key = keyOf(name);
  if (db.exercises[key]) return showSheet(db.exercises[key]);
  if (!localStorage.getItem(DEMO_KEY_NAME)) return showNoGuide(name, noGuideText());
  toast('Getting the guide...');
  const res = await askAI({ mode: 'exercise', name: name.slice(0, 80) });
  if (!res.ok) { aiFail(res); return showNoGuide(name, noGuideText()); }
  const ex = cleanGuide(res.data, name);
  db.exercises[key] = ex; persist();
  showSheet(ex);
}

function planSessions(c) {
  const out = [];
  let cur = null;
  (c.plan.trainPublished || '').split('\n').forEach(raw => {
    const h = raw.match(/^\s*(Mon|Tue|Wed|Thu|Fri|Sat|Sun)[a-z]*\s*:\s*(.*)$/i);
    if (h) {
      cur = { day: DAYS.findIndex(d => d.toLowerCase() === h[1].slice(0, 3).toLowerCase()) + 1, title: h[2].trim() || h[1], exercises: [] };
      out.push(cur);
      return;
    }
    const m = raw.match(/^\s*-\s+(.*)$/);
    if (m && cur) {
      const line = m[1];
      const sr = line.match(/(\d+)\s*[x×]\s*(\d+)/);
      cur.exercises.push({
        name: exerciseName(line) || line.trim(), planned: line.trim(),
        sets: sr ? parseInt(sr[1], 10) : 1, reps: sr ? parseInt(sr[2], 10) : null,
        unit: /\bsec/i.test(line) ? 'sec' : ''

  });

}

function renderProgress(c, coach) {
  const wi = weighPoints(c);
  const unit = ui.unit;
  const unitBtns = `<div class="tabs" style="margin:0"><button class="tab ${unit === 'kg' ? 'on' : ''}" data-act="unit" data-u="kg">kg</button><button class="tab ${unit === 'lb' ? 'on' : ''}" data-act="unit" data-u="lb">lb</button></div>`;
  let stats = '<p class="muted">No weigh-ins yet.</p>';
  if (wi.length) {
    const first = wi[0].kg, last = wi[wi.length - 1].kg;
    const prev = wi.length > 1 ? wi[wi.length - 2].kg : null;
    const change = last - first;
    const pct = first ? (change / first * 100) : 0;
    const conv = v => unit === 'kg' ? v : kgToLb(v);
    const big = "font-family:var(--display);font-size:32px";
    stats = `<div class="grid3">
      <div class="note-box"><div class="mini">Latest weight</div><b style="${big}">${weightText(last, unit)}</b></div>
      <div class="note-box"><div class="mini">Change since start</div><b class="${change <= 0 ? 'c-green' : 'c-red'}" style="${big}">${conv(change).toFixed(1)} ${unit} (${pct.toFixed(1)}%)</b></div>
      <div class="note-box"><div class="mini">Change since last weigh-in</div><b style="${big}">${prev == null ? 'n/a' : conv(last - prev).toFixed(1) + ' ' + unit}</b></div>
    </div>`;
  }
  const logged = [];
  for (let i = 0; i < 7; i++) { const d = addDays(todayS(), -i); if (countable(c, d) && c.steps[d]) logged.push(c.steps[d]); }
  const stepsAvg = logged.length ? Math.round(logged.reduce((x, y) => x + y, 0) / logged.length) : null;
  const stepsCardHtml = `<div class="card"><h3>Steps</h3>
    <div class="metric"><div class="top"><span>Average per day, last 7 days</span><span><b>${stepsAvg == null ? 'Nothing logged yet' : fmtSteps(stepsAvg) + ' steps'}</b></span></div>
    ${c.targets && c.targets.steps && stepsAvg != null ? `<div class="bar progress"><span class="progress__fill" style="width:${Math.min(100, Math.round(stepsAvg / c.targets.steps * 100))}%"></span></div><p class="mini" style="margin:6px 0 0">Target ${fmtSteps(c.targets.steps)} steps a day, based on ${logged.length} logged day${logged.length === 1 ? '' : 's'}.</p>` : ''}</div></div>`;
  const logDays = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(todayS(), -i);
    if (countable(c, d) && (c.logs[d] || []).some(m => !m.waiting)) logDays.push(sumNut((c.logs[d] || []).filter(m => !m.waiting)));
  }
  const macroCard = logDays.length ? `<div class="card"><h3>Average per day, last 7 days</h3>
    <p class="mini" style="margin-top:0">Based on ${logDays.length} logged day${logDays.length === 1 ? '' : 's'}.</p>
    ${NUT.map(k => barHtml(k, Math.round(logDays.reduce((x, t) => x + t[k], 0) / logDays.length), c.targets ? c.targets[k] : null)).join('')}</div>` : '';
  const updateBtn = !coach && c.tier === 'basic'
    ? '<button class="btn-ghost btn-sm" data-act="updateTargets">Update my targets</button>' : '';
  let workoutsCard = '';
  if (c.tier !== 'basic') {
    const weekAgo = addDays(todayS(), -6);
    const wos = (c.workouts || []).filter(w => w.date >= weekAgo && countable(c, w.date)).sort((a, b) => a.date < b.date ? 1 : -1);
    const woList = wos.length ? wos.map(w => `<div class="meal"><div style="flex:1 1 220px"><b>${esc(w.what)}</b><div class="mini">${fmtDate(w.date)}${w.minutes ? ' · ' + w.minutes + ' min' : ''}${w.notes ? ' · ' + esc(w.notes) : ''}</div>${sessionSummary(w)}</div></div>`).join('')
      : '<p class="muted">No workouts in the last 7 days.</p>';
    workoutsCard = `<div class="card"><h3>Workouts in the last 7 days</h3>${woList}</div>`;
  }
  return `<div class="card"><div class="row"><h3 style="margin:0">Weight</h3>${unitBtns}</div>
      <div style="margin-top:12px">${stats}</div>${weighChart(wi, unit)}
      <div style="margin-top:10px">${updateBtn}</div></div>
    ${stepsCardHtml}
    ${macroCard}
    ${workoutsCard}`;
}

   customer, joined with the existing Discipline Path purchases), readable only by the coach role.

const isEmailOk = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
function customerByEmail(email) { const e = String(email).trim().toLowerCase(); return db.customers.find(x => x.email.toLowerCase() === e) || null; }
function custOk(x) { return !!x.marketingConsent && !x.unsubscribed; }             // OK to email: said yes and not unsubscribed
function custLastPurchase(x) { return x.purchases.map(p => p.date).sort().slice(-1)[0] || ''; }
function custProducts(x) { return [...new Set(x.purchases.map(p => p.product))]; }
function matchCustomer(x, f) {
  f = f || {};
  if (f.product && !custProducts(x).includes(f.product)) return false;
  if (f.status && x.status !== f.status) return false;
  if (f.ok === 'yes' && !custOk(x)) return false;
  if (f.ok === 'no' && custOk(x)) return false;
  const q = String(f.q || '').trim().toLowerCase();
  if (q && !(x.name + ' ' + x.email).toLowerCase().includes(q)) return false;
  return true;
}
// Keeps each customer's status in step with their client. Basic is Basic; a finished client is Finished.
function syncCustomerStatuses() {
  db.customers.forEach(x => {
    if (!x.clientId) return;
    const c = clientById(x.clientId);
    if (!c) return;
    x.status = c.tier === 'basic' ? 'basic' : c.status === 'finished' ? 'finished' : 'active';
  });
}
// Records a purchase against a customer, creating the customer if needed. The news answer is stored with its date.
function recordPurchase(c, { name, email, country, product, price, news }) {
  let x = customerByEmail(email);
  if (!x) {
    x = { id: uid(), name, email, country, purchases: [], status: 'active', marketingConsent: false, marketingDate: null,
      unsubscribed: false, unsubscribedDate: null, dataDeleted: false, dataDeletedDate: null, clientId: null };
    db.customers.push(x);
  }
  x.name = name; x.country = country; x.clientId = c.id; x.dataDeleted = false; x.dataDeletedDate = null;
  x.purchases.push({ product, date: todayS(), price });
  x.marketingConsent = !!news; x.marketingDate = todayS();
  if (news) { x.unsubscribed = false; x.unsubscribedDate = null; }   // a fresh, ticked yes is a new opt-in
  return x;
}
function custSummary(f) {
  const rows = db.customers.filter(x => matchCustomer(x, f));
  const ok = rows.filter(custOk);
  return { shown: rows.length, ok: ok.length, notConsented: rows.filter(x => !x.marketingConsent).length,
           unsubscribed: rows.filter(x => x.marketingConsent && x.unsubscribed).length, rows };
}
function custNoteHtml(f) {
  const s = custSummary(f);
  const left = s.shown - s.ok;
  return `Only customers who said yes to news and have not unsubscribed are included in the copy and the CSV.
    ${left ? `${left} shown ${left === 1 ? 'is' : 'are'} left out: ${s.notConsented} did not say yes at checkout, and ${s.unsubscribed} unsubscribed.` : 'Everyone shown is OK to email.'}`;
}

// Filters update the rows in place (no re-render, so typing keeps focus).
function applyCustFilters() {
  const f = ui.custFilter || {};
  let shown = 0;
  document.querySelectorAll('[data-cust-row]').forEach(row => {
    const x = db.customers.find(y => y.id === row.dataset.id);
    const on = !!x && matchCustomer(x, f);
    row.hidden = !on;
    if (on) shown++;
  });
  const count = document.getElementById('custCount');
  if (count) count.textContent = `${shown} shown`;

// Copy emails: OK-to-email customers only. Falls back to a box to copy from if the clipboard is blocked.
async function copyEmailsAction() {
  const list = emailList();
  if (!list.length) { toast('No customers are OK to email with these filters.'); return; }
  const text = list.map(x => x.email).join(', ');
  try {
    await navigator.clipboard.writeText(text);
    toast(`Copied ${list.length} email${list.length === 1 ? '' : 's'}. Only customers who are OK to email.`);
  } catch (e) {
    const box = document.getElementById('emailBox');
    box.hidden = false; box.value = text; box.select();
    toast('Copy is blocked here. The emails are in the box below.');
  }
}
function csvCell(v) { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function downloadCsvAction() {
  const list = emailList();
  if (!list.length) { toast('No customers are OK to email with these filters.'); return; }
  const head = ['name', 'email', 'country', 'products', 'last_purchase', 'status', 'ok_to_email', 'data_deleted'];
  const lines = list.map(x => [x.name, x.email, x.country, custProducts(x).join('; '), custLastPurchase(x), CUSTOMER_STATUS[x.status] || x.status,
    custOk(x) ? 'yes' : 'no', x.dataDeleted ? 'yes' : 'no'].map(csvCell).join(','));
  const blob = new Blob([[head.join(','), ...lines].join('\n') + '\n'], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `beast-coach-customers-ok-to-email-${todayS()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`Downloaded ${list.length} customer${list.length === 1 ? '' : 's'} who are OK to email.`);
}

const CHECKIN_TYPES = ['Kick-off call', 'Check-in', 'Video call'];

// Essential: one kick-off call. Core and The Beast: any of the three types. Basic: none.
function checkinTypesFor(tier) { return tier === 'essential' ? ['Kick-off call'] : tier === 'basic' ? [] : CHECKIN_TYPES; }
// Offset of a zone from UTC in minutes, at a moment in time.
function tzOffsetMin(date, zone) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: zone, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit' }).formatToParts(date).map(x => [x.type, x.value]));
  const asUtc = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second);
  return Math.round((asUtc - date.getTime()) / 60000);
}
// A wall-clock date and time in a zone, as a real moment in time.
function wallToInstant(dateStr, timeStr, zone) {
  const [y, m, d] = dateStr.split('-').map(Number), [hh, mm] = timeStr.split(':').map(Number);
  const local = Date.UTC(y, m - 1, d, hh, mm);
  const once = local - tzOffsetMin(new Date(local), zone) * 60000;
  return new Date(local - tzOffsetMin(new Date(once), zone) * 60000);
}
// How a moment reads in a zone: "Tue 2 Dec" and "6:30pm".
function fmtInZone(instant, zone) {

    hour: 'numeric', minute: '2-digit', hour12: true }).formatToParts(instant);
  const g = t => ((parts.find(p => p.type === t) || {}).value || '');
  return { date: `${g('weekday')} ${g('day')} ${g('month')}`, time: `${g('hour')}:${g('minute')}${g('dayPeriod').toLowerCase().replace(/\./g, '')}` };
}
function checkinInstant(ci) { return wallToInstant(ci.date, ci.time, DEFAULT_TZ); }

function upcomingCheckin(c) {
  const now = Date.now();
  return (c.checkins || []).filter(x => x.status === 'scheduled' && checkinInstant(x).getTime() >= now)
    .sort((a, b) => checkinInstant(a) - checkinInstant(b))[0] || null;

/* ==========================================================================
   Coach: logs. Sessions with sets and reps, and highlights when weight or reps went up.
   ========================================================================== */
// Best set for an exercise: the heaviest set (most reps at that weight), or the most reps if no weight.
function bestSet(e) {
  if (!e || e.skipped || !e.sets || !e.sets.length) return null;
  const weighted = e.sets.filter(s => s.kg != null);
  if (!weighted.length) {
    const reps = Math.max(...e.sets.map(s => s.reps || 0));
    return reps > 0 ? { kg: null, reps } : null;
  }
  const kg = Math.max(...weighted.map(s => s.kg));
  const reps = Math.max(...weighted.filter(s => s.kg === kg).map(s => s.reps || 0));
  return { kg, reps };
}
// The last time this exercise was logged before the given date.
function previousBest(c, name, date) {
  const prior = (c.workouts || []).filter(w => w.session && w.date < date).sort((a, b) => a.date < b.date ? 1 : -1);
  for (const w of prior) {
    const e = w.session.exercises.find(x => x.name === name && !x.skipped);
    const b = bestSet(e);
    if (b) return b;
  }
  return null;
}
// Returns "+2.5 kg" or "+1 rep" when the exercise went up since it was last logged, otherwise null.
function progressNote(c, w, e) {
  const cur = bestSet(e);
  if (!cur) return null;
  const prev = previousBest(c, e.name, w.date);
  if (!prev) return null;
  if (cur.kg != null && prev.kg != null) {
    if (cur.kg > prev.kg) return '+' + (Math.round((cur.kg - prev.kg) * 10) / 10) + ' kg';
    if (cur.kg === prev.kg && cur.reps > prev.reps) return '+' + (cur.reps - prev.reps) + ' reps';
    return null;
  }
  if (cur.kg == null && prev.kg == null && cur.reps > prev.reps) return '+' + (cur.reps - prev.reps) + ' reps';
  return null;
}
function coachSessionHtml(c, w) {
  const rows = w.session.exercises.map(e => {
    if (e.skipped) return `<div class="log-ex"><b>${esc(e.name)}</b> <span class="mini">skipped</span></div>`;
    const sets = e.sets.map(s => {
      const kg = s.kg != null ? (ui.unit === 'kg' ? (Math.round(s.kg * 10) / 10) + ' kg' : (Math.round(kgToLb(s.kg) * 10) / 10) + ' lb') + ' x ' : '';
      return kg + (s.reps != null ? s.reps + (e.unit === 'sec' ? ' sec' : '') : '-');
    });
    const note = progressNote(c, w, e);
    return `<div class="log-ex"><b>${esc(e.name)}</b> ${note ? `<span class="up-badge">Up ${esc(note)}</span>` : ''}
      <div class="mini">${esc(sets.join(', ') || 'no sets')}</div></div>`;
  }).join('');
  return `<div style="margin:6px 0 10px"><div><b>${esc(w.what)}</b></div>${rows}${w.notes ? `<div class="mini">${esc(w.notes)}</div>` : ''}</div>`;
}
function logsHtml(c) {
  const t = c.targets;
  const start = c.startDate;                    // null until activation
  // Day list: from the activation date to today, newest first. No days before activation.
  const days = [];
  for (let i = 0; i < 21; i++) {
    const d = addDays(todayS(), -i);
    if (!start || d < start) break;
    days.push(d);
  }
  // Meals logged while waiting for activation, or dated before it: one collapsed group at the bottom.
  const baseline = [];
  Object.keys(c.logs).sort().forEach(d => (c.logs[d] || []).forEach(m => {
    if (m.waiting || !start || d < start) baseline.push({ date: d, m });
  }));
  const baselineHtml = baseline.length ? `<details class="baseline"><summary>Logged before activation (baseline) <span class="mini" style="font-weight:400">${baseline.length} meal${baseline.length === 1 ? '' : 's'}, not part of the plan</span></summary>
      <div style="padding:4px 0 6px">${baseline.map(({ date, m }) => `<div class="meal" style="padding:8px 0">
        <div style="flex:1 1 200px"><span class="mini">${fmtDate(date)}${m.time ? ' · ' + esc(m.time) : ''}</span> <b>${esc(m.name)}</b> <span class="mini">${esc(sourceLabel(m))}</span>
        <div class="mini">${m.calories} kcal · P ${m.protein}g · C ${m.carbs}g · F ${m.fat}g · Fibre ${m.fibre}g</div></div></div>`).join('')}</div></details>` : '';
  const intro = start
    ? `<p class="mini" style="margin-top:0">From activation on ${esc(fmtDate(start))}, newest first. Tap a day to open it. <span class="up-badge">Up</span> marks a lift that went up since it was last logged.</p>`
    : '<p class="mini" style="margin-top:0">Not activated yet. Logs start on the activation date. Anything logged before then is in the baseline group below.</p>';
  return `<div class="card"><h3>${start ? 'Logs' : 'Logs before activation'}</h3>${intro}
    ${days.map((date, idx) => {
      const meals = (c.logs[date] || []).filter(m => !m.waiting);
      const tot = sumNut(meals);
      const wos = (c.workouts || []).filter(w => w.date === date);
      const wi = c.weighIns.find(w => w.date === date);
      const steps = c.steps[date];
      const late = v => v ? '<span class="late">added later</span>' : '';
      const calOver = t && tot.calories > t.calories, proOver = t && tot.protein > t.protein;
      const summary = `<summary><span>${fmtDate(date)}</span>
        <span class="mini" style="font-weight:400;margin-left:8px">${meals.length ? `<span style="color:${macroInk('calories', tot.calories, t && t.calories)}">${tot.calories} kcal${calOver ? ' (over)' : ''}</span> · <span style="color:${macroInk('protein', tot.protein, t && t.protein)}">P ${tot.protein}g${proOver ? ' (over)' : ''}</span> · ${meals.length} meal${meals.length === 1 ? '' : 's'}` : 'No meals logged'}
        · ${steps ? fmtSteps(steps) + ' steps' + late(c.stepsLate && c.stepsLate[date]) : 'No steps'} · ${wos.length ? wos.length + ' workout' + (wos.length === 1 ? '' : 's') : 'No workout'} · ${wi ? weightText(wi.kg, 'kg') : 'No weigh-in'}</span></summary>`;
      const body = meals.length ? meals.map(m => `<div class="meal" style="padding:8px 0">
          <div style="flex:1 1 200px"><span class="mini">${esc(m.time || '')}</span> <b>${esc(m.name)}</b> <span class="mini">${esc(sourceLabel(m))}</span>${late(m.addedLate)}
          <div class="mini">${m.calories} kcal · P ${m.protein}g · C ${m.carbs}g · F ${m.fat}g · Fibre ${m.fibre}g</div>
          ${m.edited && m.ai ? `<div class="edited">Changed by client. Beast AI said ${m.ai.calories} kcal, P ${m.ai.protein}g.</div>` : ''}</div></div>`).join('')
        : '<p class="mini">No meals logged.</p>';
      const woTxt = wos.map(w => (w.session ? `${late(w.addedLate)}${coachSessionHtml(c, w)}`
        : `<div class="mini">Other activity: ${esc(w.what)}${w.minutes ? ' (' + w.minutes + ' min)' : ''}${w.notes ? ' · ' + esc(w.notes) : ''}${late(w.addedLate)}</div>`)).join('');
      return `<details ${idx === 0 ? 'open' : ''}>${summary}<div style="padding:4px 0 6px">${body}${woTxt}</div></details>`;
    }).join('')}
    ${baselineHtml}
  </div>`;
}

function resizeToJpeg(file, max) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * s); canvas.height = Math.round(img.height * s);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}
ACT.build = async () => {
  const c = clientById(ui.clientId);
  const fileEl = document.getElementById('fridgeFile');
  const file = fileEl && fileEl.files && fileEl.files[0];
  let have = (ui.bText || '').trim();
  if (file) {
    if (file.size > 12 * 1024 * 1024) { toast('That photo is too large. Try a smaller one.'); return; }
    toast('Looking in your fridge...');
    try {
      const b64 = await resizeToJpeg(file, 1280);
      if (b64.length > 2800000) { toast('That photo is too large after resizing.'); return; }
      const res = await askAI({ mode: 'fridge', image: { type: 'image/jpeg', data: b64 } });
      if (res.ok) {
        const items = (res.data.items || []).map(i => typeof i === 'string' ? i : (i && i.name) || '').filter(Boolean);
        have = [items.join(', '), have].filter(Boolean).join(', ');
        ui.bText = have;
      } else { aiFail(res); }
    } catch (e) { toast('That photo could not be read. Type what you have instead.'); }
  }
  if (!have) { toast('Add a photo or type what you have.'); return; }
  const t = c.targets;
  const eaten = totalsFor(c, logDay());
  const body = { mode: 'create', have: have.slice(0, 600), meal: ui.bMeal, effort: ui.bEffort };
  if (t) body.targets = {
    calories: Math.min(900, Math.max(0, t.calories - eaten.calories)),
    protein: Math.min(60, Math.max(0, t.protein - eaten.protein)),
    fibre: Math.max(0, t.fibre - eaten.fibre)
  };
  toast('Thinking up meals...');
  const res = await askAI(body);
  if (!res.ok) { aiFail(res); ui.buildResults = null; saveUi(); render(); return; }
  const list = (res.data.meals || []).map(m => ({
    name: String(m.name || 'Meal').slice(0, 80),
    text: [].concat(m.uses || [], m.pantry || []).join(', '),
    steps: Array.isArray(m.steps) ? m.steps.slice(0, 8) : [],
    tip: String(m.tip || '').slice(0, 200),
    offTarget: !!m.offTarget,
    calories: clampNum(m.calories, 5000), protein: clampNum(m.protein, 500), carbs: clampNum(m.carbs, 800),
    fat: clampNum(m.fat, 400), fibre: clampNum(m.fibre, 200)
  }));
  ui.buildResults = list.length ? list : null;
  if (!list.length) toast('No meals came back. Try again or enter the numbers yourself.');
  saveUi(); render();
};

/* ---- Set and rep logging (coaching clients) and steps (everyone) ---- */
function numOrNull(v) { const x = parseFloat(v); return isFinite(x) ? x : null; }
function intOrNull(v) { const x = parseInt(v, 10); return isFinite(x) ? x : null; }
function woInput(el) {
  const wo = ui.wo;
  if (!wo) return;
  const k = el.dataset.wo;
  if (k === 'what' || k === 'minutes' || k === 'notes') wo[k] = el.value;
  else {
    const st = wo.ex[Number(el.dataset.i)].sets[Number(el.dataset.j)];
    st[k === 'w' ? 'w' : 'r'] = el.value;
  }
  saveUi();
}
ACT.woMode = el => {

  ui.wo = Object.assign({}, ui.wo, { mode: m, ex: m === 'plan' ? null : (ui.wo && ui.wo.ex) });

ACT.woSetAdd = el => {
  const e = ui.wo.ex[Number(el.dataset.i)];
  e.sets.push({ w: '', r: e.sets.length ? e.sets[e.sets.length - 1].r : '' });
  saveUi(); render();
};
ACT.woSetDel = el => {
  ui.wo.ex[Number(el.dataset.i)].sets.splice(Number(el.dataset.j), 1);
  saveUi(); render();

ACT.saveWorkout = () => {
  const c = clientById(ui.clientId);
  const day = logDay();
  if (!guardDay(day)) return;
  const wo = ui.wo || {};
  const late = day < todayS() ? { addedLate: true } : {};
  if (wo.mode === 'plan' && wo.ex) {
    const exercises = wo.ex.map(e => ({
      name: e.name, unit: e.unit || '', skipped: !!e.skipped,
      sets: e.skipped ? [] : e.sets.map(st => {
        const w = numOrNull(st.w);
        const kg = w == null ? null : Math.round((ui.unit === 'kg' ? w : lbToKg(w)) * 10) / 10;
        return { kg, reps: intOrNull(st.r) };
      }).filter(s => s.kg != null || s.reps != null)
    }));
    if (!exercises.some(e => e.skipped || e.sets.length)) { toast('Log a set for at least one exercise, or mark it skipped.'); return; }
    const session = planSessions(c).find(s => s.day === dowNum(day));
    c.workouts.push(Object.assign({ id: uid(), date: day, what: session ? session.title : 'Workout', minutes: null,
      notes: (wo.notes || '').trim().slice(0, 300), session: { exercises } }, late));
  } else {
    // Other activity: what, minutes (blank means no minutes, not 0) and notes.
    const what = (wo.what || '').trim();
    if (!what) { toast('Say what you did.'); return; }
    const minutes = String(wo.minutes == null ? '' : wo.minutes).trim() === '' ? null : clampNum(wo.minutes, 600);
    c.workouts.push(Object.assign({ id: uid(), date: day, what: what.slice(0, 120), minutes,
      notes: (wo.notes || '').trim().slice(0, 300) }, late));
  }
  ui.wo = null; persist(); saveUi(); render(); toast('Workout saved.');
};
ACT.deleteWorkout = el => {
  const c = clientById(ui.clientId);
  const w = c.workouts.find(x => x.id === el.dataset.id);

  c.workouts = c.workouts.filter(x => x.id !== el.dataset.id);

ACT.saveSteps = () => {
  const c = clientById(ui.clientId);

  const v = document.getElementById('st-val').value;
  if (v === '') { delete c.steps[day]; delete c.stepsLate[day]; }

};
ACT.saveWeigh = () => {
  const c = clientById(ui.clientId);
  const today = todayS();
  if (!isWeighDay(c, today)) { toast('Weigh-ins are only on ' + DAYS_FULL[DAYS.indexOf(c.ob.weighInDay || 'Mon')] + '.'); return; }
  const raw = parseFloat(document.getElementById('wi-val').value);

  const ws = weekStart(today), we = addDays(ws, 6);

  c.weighIns.push({ date: today, kg: Math.round(kg * 10) / 10 });
  persist(); render(); toast('Weigh-in saved.');
};

function parseLines(text) {
  return text.split('\n').map(s => s.trim()).filter(Boolean).map((line, i) => {
    const idx = line.indexOf(':');
    if (idx > 0) return { label: line.slice(0, idx).trim().slice(0, 40), text: line.slice(idx + 1).trim().slice(0, 300) };
    return { label: 'Meal ' + (i + 1), text: line.slice(0, 300) };
  });
}
function zeroMeal(p) { return Object.assign({ label: p.label, text: p.text }, { calories:0, protein:0, carbs:0, fat:0, fibre:0 }); }
ACT.calcDay = async el => {
  const c = clientById(ui.coachClientId);
  const d = Number(el.dataset.d);
  const lines = c.plan.mealDraft[d].lines.split('\n').map(s => s.trim()).filter(Boolean);
  if (!lines.length) { toast('Type the meals first, one per line.'); return; }
  toast('Calculating...');
  const res = await askAI({ mode: 'day', text: lines.join('\n').slice(0, 2000) });
  if (res.ok && Array.isArray(res.data.meals) && res.data.meals.length === lines.length) {
    const meals = res.data.meals.map((m, i) => Object.assign({ label: String(m.label || parseLines(lines[i])[0].label), text: String(m.text || parseLines(lines[i])[0].text) },
      nutFrom(m)));
    c.plan.mealDraft[d] = { lines: c.plan.mealDraft[d].lines, meals };
    persist(); render(); toast('Numbers calculated. Check them before you publish.');
    return;
  }
  if (!res.ok) aiFail(res); else toast('Beast AI returned a different number of meals. Check the numbers by hand.');
  c.plan.mealDraft[d] = { lines: c.plan.mealDraft[d].lines, meals: parseLines(lines.join('\n')).map(zeroMeal) };
  persist(); render();
};

/* ==========================================================================
   Event wiring (one delegated listener each)
   ========================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
const OB_SEL = '#onboardForm [data-ob], #onboardForm [data-obgrp], #onboardForm [data-health]';
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.woskip !== undefined) {
    ui.wo.ex[Number(el.dataset.woskip)].skipped = el.checked; saveUi(); render(); return;
  }
  if (el.dataset && el.dataset.ch === 'viewAs') {
    const v = el.value;
    if (v === 'coach') { ui.view = 'coach'; ui.coachClientId = null; }
    else if (v === 'new') { ui.view = 'new'; ui.newStep = 'plans'; }
    else if (v.startsWith('client:')) {
      ui.view = 'client'; ui.clientId = v.slice(7); ui.clientTab = 'today'; ui.editId = null;
      activeZone = zoneFor(clientById(ui.clientId));        // their "today", before picking the day
      ui.clientDay = todayS();
    }
    saveUi(); render(); window.scrollTo(0, 0);
    return;
  }
  if (el.dataset && el.dataset.ch && CH[el.dataset.ch]) { CH[el.dataset.ch](el, e); return; }
  if (el.dataset && el.dataset.ui) { ui[el.dataset.ui] = el.value; saveUi(); return; }
  if (el.matches && el.matches(OB_SEL)) handleObInput(el);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.wo) { woInput(el); return; }
  if (el.dataset && el.dataset.ui) { ui[el.dataset.ui] = el.value; saveUi(); return; }
  if (el.dataset && el.dataset.inp && INP[el.dataset.inp]) { INP[el.dataset.inp](el, e); return; }
  if (el.matches && el.matches(OB_SEL)) handleObInput(el);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('#nc-name, #nc-email')) {
    const btn = document.querySelector('[data-act="pay"]');
    if (btn) btn.click();
  }
});

function handleObInput(el) {
  const c = clientById(ui.clientId);
  if (!c) return;
  const ob = c.ob;
  if (el.dataset.health) {
    ob.health[el.dataset.health] = el.value;
    const anyYes = Object.values(ob.health).some(v => v === 'yes');
    document.getElementById('clearWrap').hidden = !anyYes;
    document.getElementById('otherWrap').hidden = ob.health.other !== 'yes';
    clearObErr('health');
    persist();
    return;
  }
  if (el.dataset.obgrp) {
    const k = el.dataset.obgrp;
    const set = new Set(ob[k]);
    if (el.checked) set.add(el.value); else set.delete(el.value);
    ob[k] = Array.from(set);
    clearObErr(k);
    persist();
    return;
  }
  const k = el.dataset.ob;
  if (el.type === 'checkbox') ob[k] = el.checked;
  else if (el.type === 'radio') { if (el.checked) ob[k] = el.value; }
  else ob[k] = el.value;
  persist();
  if (k === 'heightUnit') { render(); return; }            // swaps the height inputs; answers are kept
  if (k === 'heightFt' || k === 'heightIn') { clearObErr('heightCm'); return; }
  if (k === 'weightUnit' || k === 'weight') { clearObErr('weight'); return; }
  clearObErr(k);
}

/* ==========================================================================
   Boot
   ========================================================================== */
db = Store.load();
initUi();
if (ui.view === 'client' && !clientById(ui.clientId)) { ui.view = 'coach'; ui.clientId = null; }
activeZone = zoneFor(ui.view === 'client' ? clientById(ui.clientId) : null);
if (new URLSearchParams(location.search).has('shot')) document.body.classList.add('shot');
ui.clientDay = logDay();
document.getElementById('tzList').innerHTML = TZ_CITIES.map(([city, zone]) => `<option value="${city}">${zone}</option>`).join('');
saveUi();
render();
</script>
